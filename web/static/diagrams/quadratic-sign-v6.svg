<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">抛物线与横轴的位置</title><desc id="desc">函数y=(x−1)(x−4)，开口向上，在x=1和x=4处与横轴相交，最低处位于两个零点之间。两轴每格1单位。</desc><rect width="480" height="390" fill="white"/><text x="36" y="32" font-family="sans-serif" font-size="20" fill="#334155">y=(x−1)(x−4)</text><g stroke="#e2e8f0"><path d="M70 75V325"/><path d="M130 75V325"/><path d="M190 75V325"/><path d="M250 75V325"/><path d="M310 75V325"/><path d="M370 75V325"/><path d="M35 315H410"/><path d="M35 290H410"/><path d="M35 265H410"/><path d="M35 240H410"/><path d="M35 215H410"/><path d="M35 190H410"/><path d="M35 165H410"/><path d="M35 140H410"/><path d="M35 115H410"/><path d="M35 90H410"/></g><g stroke="#334155" stroke-width="2"><path d="M35 240H420m-7 -4 7 4-7 4M70 330V65m-4 7 4-7 4 7"/></g><g fill="#334155" font-family="sans-serif" font-size="14"><text x="70" y="259" text-anchor="middle">0</text><text x="130" y="259" text-anchor="middle">1</text><text x="190" y="259" text-anchor="middle">2</text><text x="250" y="259" text-anchor="middle">3</text><text x="310" y="259" text-anchor="middle">4</text><text x="370" y="259" text-anchor="middle">5</text><text x="60" y="320" text-anchor="end">-3</text><text x="60" y="295" text-anchor="end">-2</text><text x="60" y="270" text-anchor="end">-1</text><text x="60" y="220" text-anchor="end">1</text><text x="60" y="195" text-anchor="end">2</text><text x="60" y="170" text-anchor="end">3</text><text x="60" y="145" text-anchor="end">4</text><text x="60" y="120" text-anchor="end">5</text><text x="60" y="95" text-anchor="end">6</text><text x="428" y="246">x</text><text x="79" y="63">y</text><text x="36" y="370">观察曲线低于横轴的部分，对应哪些 x？</text></g><path d="M55 107.1875Q220 485.3125 385 107.1875" fill="none" stroke="#2563eb" stroke-width="3"/><g fill="#2563eb"><circle cx="130" cy="240" r="4"/><circle cx="310" cy="240" r="4"/></g></svg>
