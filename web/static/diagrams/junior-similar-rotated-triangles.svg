<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-labelledby="title desc"><title id="title">不同朝向的相似三角形</title><desc id="desc">小三角形AB=3、AC=4、BC=5，A为直角；大三角形DE=6、DF=8、EF=10，D为直角且整体旋转。角标匹配A↔D、B↔E、C↔F，长度比1:2，面积比1:4；图形按实际比例构造。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="565" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="450" y="36" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">旋转后仍按对应顶点比较</text><text x="450" y="68" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">两图使用相同长度单位</text><line x1="150" y1="300" x2="150" y2="180" stroke="#18324d" stroke-width="2.5"/><line x1="150" y1="180" x2="310" y2="300" stroke="#18324d" stroke-width="2.5"/><line x1="310" y1="300" x2="150" y2="300" stroke="#18324d" stroke-width="2.5"/><line x1="500" y1="110" x2="740" y2="110" stroke="#18324d" stroke-width="2.5"/><line x1="740" y1="110" x2="500" y2="430" stroke="#18324d" stroke-width="2.5"/><line x1="500" y1="430" x2="500" y2="110" stroke="#18324d" stroke-width="2.5"/><line x1="150" y1="282" x2="168" y2="282" stroke="#18324d" stroke-width="2"/><line x1="168" y1="282" x2="168" y2="300" stroke="#18324d" stroke-width="2"/><line x1="500" y1="130" x2="520" y2="130" stroke="#18324d" stroke-width="2"/><line x1="520" y1="130" x2="520" y2="110" stroke="#18324d" stroke-width="2"/><path d="M 170.000 195.000 A 25 25 0 0 1 150.000 205.000" fill="none" stroke="#c65b19" stroke-width="2"/><path d="M 718.400 138.800 A 36 36 0 0 1 704.000 110.000" fill="none" stroke="#c65b19" stroke-width="2"/><path d="M 283.000 300.000 A 27 27 0 0 1 288.400 283.800" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 277.000 300.000 A 33 33 0 0 1 283.600 280.200" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 500.000 394.000 A 36 36 0 0 1 521.600 401.200" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 500.000 388.000 A 42 42 0 0 1 525.200 396.400" fill="none" stroke="#19769b" stroke-width="2"/><text x="130" y="323" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">A</text><text x="132" y="165" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">B</text><text x="327" y="323" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">C</text><text x="480" y="99" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">D</text><text x="760" y="111" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">E</text><text x="491" y="456" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">F</text><text x="127" y="246" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><text x="230" y="328" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><text x="246" y="226" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">5</text><text x="620" y="94" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">6</text><text x="477" y="275" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">8</text><text x="648" y="286" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">10</text><text x="450" y="490" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">AB ↔ DE，AC ↔ DF，BC ↔ EF</text><text x="450" y="532" font-size="24" text-anchor="middle" fill="#18324d" font-weight="normal">长度比 1:2  →  面积比 1:4</text></g></svg>
