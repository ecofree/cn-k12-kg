<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">六格图的折叠观察</title><desc id="desc">图甲A、B、C、D横排，E在B正上方，F在B正下方。图乙为两行三列的完整六格矩形。所有方格边长相同，颜色不表示相对面。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="800" height="420" fill="#fff"/><text x="400" y="35" text-anchor="middle" class="title">两个由六个相同正方形组成的图</text><text x="220" y="80" text-anchor="middle" class="">图甲：按字母追踪各面</text><text x="615" y="80" text-anchor="middle" class="">图乙：两行三列</text><rect x="60" y="180" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="100" y="228" text-anchor="middle" class="">A</text><rect x="140" y="180" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="180" y="228" text-anchor="middle" class="">B</text><rect x="220" y="180" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="260" y="228" text-anchor="middle" class="">C</text><rect x="300" y="180" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="340" y="228" text-anchor="middle" class="">D</text><rect x="140" y="100" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="180" y="148" text-anchor="middle" class="">E</text><rect x="140" y="260" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="180" y="308" text-anchor="middle" class="">F</text><rect x="495" y="140" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="535" y="188" text-anchor="middle" class="">1</text><rect x="575" y="140" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="615" y="188" text-anchor="middle" class="">2</text><rect x="655" y="140" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="695" y="188" text-anchor="middle" class="">3</text><rect x="495" y="220" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="535" y="268" text-anchor="middle" class="">4</text><rect x="575" y="220" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="615" y="268" text-anchor="middle" class="">5</text><rect x="655" y="220" width="80" height="80" fill="#e7f2fb" class="shape"/><text x="695" y="268" text-anchor="middle" class="">6</text><text x="400" y="385" text-anchor="middle" class="label">沿相邻格的公共边折叠，逐一检查六个面的位置。</text></svg>
