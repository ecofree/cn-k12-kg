<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">三角形内角和的平行线证明</title><desc id="desc">DE过A且平行于BC。两组相等角分别用α、β及不同颜色对应，α、顶角A、β在A旁合成平角。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="430" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">平行线把两个底角转移到顶点旁</text><line x1="65" y1="100" x2="705" y2="100" stroke="#18324d" stroke-width="2"/><line x1="340" y1="100" x2="140" y2="330" stroke="#18324d" stroke-width="2"/><line x1="340" y1="100" x2="610" y2="330" stroke="#18324d" stroke-width="2"/><line x1="140" y1="330" x2="610" y2="330" stroke="#18324d" stroke-width="2"/><path d="M 313.753 130.184 A 40 40 0 0 1 300.000 100.000" fill="none" stroke="#c65b19" stroke-width="2"/><path d="M 166.247 299.816 A 40 40 0 0 1 180.000 330.000" fill="none" stroke="#c65b19" stroke-width="2"/><path d="M 383.000 100.000 A 43 43 0 0 1 372.733 127.884" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 567.000 330.000 A 43 43 0 0 1 577.267 302.116" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 384.152 137.611 A 58 58 0 0 1 301.942 143.767" fill="none" stroke="#7a589f" stroke-width="2"/><text x="286" y="121" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">α</text><text x="195" y="315" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">α</text><text x="397" y="123" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">β</text><text x="553" y="318" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">β</text><text x="345" y="183" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">∠A</text><text x="75" y="83" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">D</text><text x="697" y="83" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">E</text><text x="340" y="81" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">A</text><text x="127" y="355" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">B</text><text x="623" y="355" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">C</text><text x="380" y="394" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">DE ∥ BC；α + ∠A + β = 180°</text><line x1="241" y1="94" x2="251" y2="100" stroke="#18324d" stroke-width="2"/><line x1="251" y1="100" x2="241" y2="106" stroke="#18324d" stroke-width="2"/><line x1="241" y1="324" x2="251" y2="330" stroke="#18324d" stroke-width="2"/><line x1="251" y1="330" x2="241" y2="336" stroke="#18324d" stroke-width="2"/></g></svg>
