<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="title desc">
  <title id="title">两轴刻度不同的匀速进水记录</title>
  <desc id="desc">横轴t为时间，每格2分钟；纵轴y为水量，每格5升。直线从（0，5）到（8，25），标出P（2，10）和Q（6，20）。</desc>
  <rect width="520" height="380" fill="white"/>
  <g stroke="#dce4e0" stroke-width="1">
    <path d="M90 60V310 M170 60V310 M250 60V310 M330 60V310 M410 60V310"/>
    <path d="M90 310H410 M90 260H410 M90 210H410 M90 160H410 M90 110H410 M90 60H410"/>
  </g>
  <g stroke="#34473e" stroke-width="2" fill="none">
    <path d="M90 42V310H445 M85 52L90 42L95 52 M435 305L445 310L435 315"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#24332d">
    <text x="90" y="335" text-anchor="middle">0</text><text x="170" y="335" text-anchor="middle">2</text><text x="250" y="335" text-anchor="middle">4</text><text x="330" y="335" text-anchor="middle">6</text><text x="410" y="335" text-anchor="middle">8</text>
    <text x="75" y="315" text-anchor="end">0</text><text x="75" y="265" text-anchor="end">5</text><text x="75" y="215" text-anchor="end">10</text><text x="75" y="165" text-anchor="end">15</text><text x="75" y="115" text-anchor="end">20</text><text x="75" y="65" text-anchor="end">25</text>
    <text x="90" y="28">水量 y（升）</text><text x="330" y="365">时间 t（分钟）</text>
  </g>
  <path d="M90 260L410 60" fill="none" stroke="#126a55" stroke-width="3"/>
  <g stroke="#547c70" stroke-dasharray="5 4" fill="none">
    <path d="M170 310V210H90 M330 310V110H90"/>
  </g>
  <g fill="#126a55"><circle cx="170" cy="210" r="5"/><circle cx="330" cy="110" r="5"/></g>
  <g font-family="sans-serif" font-size="17" fill="#163e33"><text x="178" y="200">P</text><text x="338" y="100">Q</text></g>
</svg>
