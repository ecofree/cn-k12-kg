05" y1="345" x2="783" y2="345" stroke="#18324d" stroke-width="2" /><line x1="105" y1="345" x2="105" y2="75" stroke="#18324d" stroke-width="2" /><polyline points="145,150 341.667,128.333 538.333,139.167 735,95.8333" fill="none" stroke="#2872ad" stroke-width="3"/><circle id="point-0" cx="145" cy="150" r="5" fill="#2872ad"/><text x="145" y="377" font-size="18" text-anchor="middle">第1天</text><circle id="point-1" cx="341.667" cy="128.333" r="5" fill="#2872ad"/><text x="341.667" y="377" font-size="18" text-anchor="middle">第2天</text><circle id="point-2" cx="538.333" cy="139.167" r="5" fill="#2872ad"/><text x="538.333" y="377" font-size="18" text-anchor="middle">第3天</text><circle id="point-3" cx="735" cy="95.8333" r="5" fill="#2872ad"/><text x="735" y="377" font-size="18" text-anchor="middle">第4天</text><text x="420" y="412" font-size="18" text-anchor="middle">横轴按相等时间间隔排列；先读坐标，再算变化量。</text>
