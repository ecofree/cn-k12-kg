<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">把长方形裁成等大的正方形</title>
  <desc id="desc">长方形长40厘米、宽24厘米。图中未画分割线，学生需确定相同正方形的边长并说明能整齐排满。</desc>
  <rect width="640" height="430" fill="#fff"/>
  <g font-family="sans-serif" fill="#142d4e" text-anchor="middle">
    <text x="320" y="38" font-size="24">每个正方形要同样大，并且不留余料</text>
    <rect x="120" y="95" width="400" height="240" rx="0" fill="#eaf2fc" stroke="#205a91" stroke-width="3"/>
    <path d="M120 75H520 M120 66V84 M520 66V84 M98 95V335 M89 95H107 M89 335H107" fill="none" stroke="#466680" stroke-width="2"/>
    <text x="320" y="66" font-size="20">40厘米</text>
    <text x="65" y="220" font-size="20" transform="rotate(-90 65 220)">24厘米</text>
    <text x="320" y="382" font-size="21">沿与边平行的线裁剪，不拼接。</text>
    <text x="320" y="412" font-size="19">先选边长，再检查一行和一列是否都能排满。</text>
  </g>
</svg>
