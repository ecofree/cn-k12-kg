<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc"><title id="title">长方体六面展开图</title><desc id="desc">长3厘米宽2厘米高1厘米；侧面A、B、C、D横排，尺寸依次2乘1、3乘1、2乘1、3乘1；B上下分别接3乘2的面E、F；折后A对C、B对D、E对F。</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#172033;text-anchor:middle} .edge{fill:#eff6ff;stroke:#334155;stroke-width:2}</style><text x="400" y="34" font-size="25">长3厘米、宽2厘米、高1厘米的长方体</text><rect x="90" y="210" width="120" height="60" class="edge"/><text x="150.0" y="235.0" font-size="23">A</text><text x="150.0" y="260.0" font-size="18">2×1 厘米</text><rect x="210" y="210" width="180" height="60" class="edge"/><text x="300.0" y="235.0" font-size="23">B</text><text x="300.0" y="260.0" font-size="18">3×1 厘米</text><rect x="390" y="210" width="120" height="60" class="edge"/><text x="450.0" y="235.0" font-size="23">C</text><text x="450.0" y="260.0" font-size="18">2×1 厘米</text><rect x="510" y="210" width="180" height="60" class="edge"/><text x="600.0" y="235.0" font-size="23">D</text><text x="600.0" y="260.0" font-size="18">3×1 厘米</text><rect x="210" y="90" width="180" height="120" class="edge"/><text x="300.0" y="145.0" font-size="23">E</text><text x="300.0" y="170.0" font-size="18">3×2 厘米</text><rect x="210" y="270" width="180" height="120" class="edge"/><text x="300.0" y="325.0" font-size="23">F</text><text x="300.0" y="350.0" font-size="18">3×2 厘米</text><text x="400" y="442" font-size="20">沿共有边折起；尺寸相同不等于已检查折后位置。</text></svg>