<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title desc"><title id="title">两直线与一条截线</title><desc id="desc">上直线AB与下直线CD分别被同一截线SR交于P、Q；同位角、内错角、同旁内角的识别取决于图中位置，题目不据外观要求平行。</desc><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#172b4d}.base{stroke:#243746;stroke-width:2;fill:none}.accent{stroke:#1659a6;stroke-width:3;fill:none}.grid{stroke:#d8e0e8;stroke-width:1}.point{fill:#172b4d}</style><rect width="500" height="400" fill="white"/><line class="base" x1="50" y1="90" x2="450" y2="90"/><line class="base" x1="50" y1="300" x2="450" y2="300"/><line class="accent" x1="120" y1="30" x2="340" y2="360"/><circle class="point" cx="70" cy="90" r="3"/><text x="60" y="72" >A</text><circle class="point" cx="430" cy="90" r="3"/><text x="435" y="73" >B</text><circle class="point" cx="70" cy="300" r="3"/><text x="60" y="327" >C</text><circle class="point" cx="430" cy="300" r="3"/><text x="435" y="327" >D</text><circle class="point" cx="160" cy="90" r="3"/><text x="137" y="117" >P</text><circle class="point" cx="300" cy="300" r="3"/><text x="310" y="286" >Q</text><circle class="point" cx="120" cy="30" r="3"/><text x="100" y="25" >S</text><circle class="point" cx="340" cy="360" r="3"/><text x="350" y="370" >R</text></svg>