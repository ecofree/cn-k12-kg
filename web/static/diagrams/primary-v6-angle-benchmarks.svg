<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">按直角开口辨认角</title><desc id="d">四个实际角依次为锐角、直角、钝角和平角，图中不要求读取角度数；每个角同一顶点处有竖直虚线，与向右的边共同表示直角基准。</desc><rect width="1000" height="350" fill="white"/><style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#172033;text-anchor:middle}</style><text x="500" y="40" font-size="25">对齐顶点和向右的边，用直角作比较</text><path d="M100 220V105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><path d="M118 220v-18h-18" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M205 220H100L174.2462 145.7538" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M132 220A32 32 0 0 0 122.6274 197.3726" fill="none" stroke="#b45309" stroke-width="2"/><circle cx="100" cy="220" r="3" fill="#172033"/><text x="120" y="275" font-size="24">甲</text><path d="M340 220V105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><path d="M358 220v-18h-18" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M445 220H340L340.0000 115.0000" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M372 220A32 32 0 0 0 340.0000 188.0000" fill="none" stroke="#b45309" stroke-width="2"/><circle cx="340" cy="220" r="3" fill="#172033"/><text x="360" y="275" font-size="24">乙</text><path d="M580 220V105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><path d="M598 220v-18h-18" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M685 220H580L527.5000 129.0673" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M612 220A32 32 0 0 0 564.0000 192.2872" fill="none" stroke="#b45309" stroke-width="2"/><circle cx="580" cy="220" r="3" fill="#172033"/><text x="600" y="275" font-size="24">丙</text><path d="M820 220V105" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><path d="M838 220v-18h-18" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M925 220H820L715.0000 220.0000" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M852 220A32 32 0 0 0 788.0000 220.0000" fill="none" stroke="#b45309" stroke-width="2"/><circle cx="820" cy="220" r="3" fill="#172033"/><text x="840" y="275" font-size="24">丁</text><text x="500" y="325" font-size="20">虚线与向右的边组成直角基准；不按边画得长短判断。</text></svg>