<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">不等组距的频率密度直方图</title><desc id="desc">模拟样本100人，区间10至20宽10、频率密度0.04，面积0.4对应40人；区间20至40宽20、频率密度0.03，面积0.6对应60人。第二柱较低但人数更多。</desc>
<rect width="760" height="440" fill="white"/><g font-family="sans-serif" fill="#17364d"><text x="28" y="32" font-size="23">先读纵轴，再用面积读比例</text><text x="28" y="60" font-size="16">作者编写的模拟样本：100人；不等组距，柱高是密度</text></g>
<g transform="translate(95,330)"><path d="M0 0V-220M0 0H600" fill="none" stroke="#324d60" stroke-width="2"/>
<g stroke="#d7e3eb" stroke-dasharray="4 5"><path d="M0 -50H590M0 -100H590M0 -150H590M0 -200H590"/></g>
<rect x="150" y="-200" width="150" height="200" fill="#9ad1ec" stroke="#236584" stroke-width="2"/><rect x="300" y="-150" width="300" height="150" fill="#a7ddc4" stroke="#347554" stroke-width="2"/>
<g font-family="sans-serif" font-size="16" fill="#17364d"><text x="-30" y="6">0</text><text x="-50" y="-44">0.01</text><text x="-50" y="-94">0.02</text><text x="-50" y="-144">0.03</text><text x="-50" y="-194">0.04</text><text x="143" y="25">10</text><text x="292" y="25">20</text><text x="589" y="25">40</text><text x="160" y="-120">面积0.4</text><text x="180" y="-90">40人</text><text x="405" y="-90">面积0.6</text><text x="425" y="-60">60人</text></g></g>
<g font-family="sans-serif" fill="#41596a" font-size="15"><text x="100" y="94">纵轴：频率 / 组距</text><text x="570" y="383">横轴：测量值</text><text x="28" y="419">0.04×10=0.4；0.03×20=0.6；总面积1。柱高较低不一定人数较少。</text></g></svg>
