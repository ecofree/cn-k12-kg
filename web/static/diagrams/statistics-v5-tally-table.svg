<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">保留原始记录，逐条分类计数</title>
<desc id="desc">原始六条记录为红、蓝、红、黄、蓝、红。每条只记一笔，红3笔、蓝2笔、黄1笔，对应频数3、2、1。</desc>
<rect width="840" height="430" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">保留原始记录，逐条分类计数</text>
<text x="420" y="73" font-size="21" text-anchor="middle">原始记录：红、蓝、红、黄、蓝、红</text><text x="150" y="120" font-size="17" text-anchor="middle">类别</text><text x="370" y="120" font-size="17" text-anchor="middle">一条记录对应一笔</text><text x="660" y="120" font-size="17" text-anchor="middle">频数</text><circle cx="150" cy="173" r="16" fill="#d66565"/><text x="188" y="179" font-size="18" text-anchor="start">红</text><line x1="335" y1="156" x2="335" y2="190" stroke="#18324d" stroke-width="3" /><line x1="355" y1="156" x2="355" y2="190" stroke="#18324d" stroke-width="3" /><line x1="375" y1="156" x2="375" y2="190" stroke="#18324d" stroke-width="3" /><text x="660" y="180" font-size="23" text-anchor="middle">3</text><circle cx="150" cy="241" r="16" fill="#4c92c2"/><text x="188" y="247" font-size="18" text-anchor="start">蓝</text><line x1="335" y1="224" x2="335" y2="258" stroke="#18324d" stroke-width="3" /><line x1="355" y1="224" x2="355" y2="258" stroke="#18324d" stroke-width="3" /><text x="660" y="248" font-size="23" text-anchor="middle">2</text><circle cx="150" cy="309" r="16" fill="#dbb34a"/><text x="188" y="315" font-size="18" text-anchor="start">黄</text><line x1="335" y1="292" x2="335" y2="326" stroke="#18324d" stroke-width="3" /><text x="660" y="316" font-size="23" text-anchor="middle">1</text><text x="420" y="410" font-size="18" text-anchor="middle">逐条划去已记录项目，再核对各类频数之和等于6。</text>
</g></svg>
