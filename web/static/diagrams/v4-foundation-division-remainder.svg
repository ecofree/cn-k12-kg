<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 440" role="img" aria-labelledby="title desc">
<title id="title">14除以3的竖式与分组</title><desc id="desc">商4代表四个完整组，乘回12表示已分走，余数2小于每组3。</desc>
<rect width="790" height="440" rx="14" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="30" y="42" font-size="27" fill="#17324d" text-anchor="start" font-weight="bold">14 ÷ 3 = 4 …… 2：把每一步对应到分组</text><rect x="30" y="75" width="280" height="285" rx="8" fill="#ffffff" stroke="#d1dee8"/><text x="55" y="109" font-size="20" fill="#17324d" text-anchor="start" font-weight="normal">商：4个完整组</text><text x="240" y="150" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">4</text><path d="M135 209 V164 H267" fill="none" stroke="#37566b" stroke-width="2"/><text x="105" y="204" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">3</text><text x="200" y="204" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="240" y="204" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">4</text><text x="200" y="250" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="240" y="250" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">2</text><line x1="176" y1="263" x2="263" y2="263" stroke="#37566b" stroke-width="2"/><text x="240" y="307" font-size="32" fill="#946014" text-anchor="middle" font-weight="normal">2</text><text x="56" y="342" font-size="19" fill="#17324d" text-anchor="start" font-weight="normal">余数2小于除数3</text><text x="350" y="99" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">4个完整组，每组3个</text><rect x="350" y="115" width="80" height="48" rx="7" fill="#e1f0f3" stroke="#277d94"/><circle cx="370" cy="139" r="6" fill="#277d94"/><circle cx="390" cy="139" r="6" fill="#277d94"/><circle cx="410" cy="139" r="6" fill="#277d94"/><rect x="445" y="115" width="80" height="48" rx="7" fill="#e1f0f3" stroke="#277d94"/><circle cx="465" cy="139" r="6" fill="#277d94"/><circle cx="485" cy="139" r="6" fill="#277d94"/><circle cx="505" cy="139" r="6" fill="#277d94"/><rect x="540" y="115" width="80" height="48" rx="7" fill="#e1f0f3" stroke="#277d94"/><circle cx="560" cy="139" r="6" fill="#277d94"/><circle cx="580" cy="139" r="6" fill="#277d94"/><circle cx="600" cy="139" r="6" fill="#277d94"/><rect x="635" y="115" width="80" height="48" rx="7" fill="#e1f0f3" stroke="#277d94"/><circle cx="655" cy="139" r="6" fill="#277d94"/><circle cx="675" cy="139" r="6" fill="#277d94"/><circle cx="695" cy="139" r="6" fill="#277d94"/><circle cx="375" cy="220" r="7" fill="#ad7020"/><circle cx="410" cy="220" r="7" fill="#ad7020"/><text x="442" y="228" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">余下2个</text><text x="350" y="276" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">乘回：4 × 3 = 12（已分走）</text><text x="350" y="314" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">相减：14 − 12 = 2（未分走）</text><text x="350" y="352" font-size="20" fill="#17324d" text-anchor="start" font-weight="normal">2小于3，不能再组成完整的一份。</text><text x="33" y="408" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">检查：3 × 4 + 2 = 14，而且 2 &lt; 3。</text>
</g></svg>
