<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-labelledby="title desc">
  <title id="title">借阅本数与截断纵轴</title>
  <desc id="desc">纵轴单位本，起点为10，刻度10、12、14、16等距。甲条从10到12，乙条从10到14；底部双斜线表明纵轴没有从0开始。</desc>
  <rect width="560" height="340" fill="#fff"/>
  <g font-family="sans-serif" font-size="19" fill="#152940">
    <text x="56" y="32">本</text>
    <text x="28" y="78">16</text><text x="28" y="138">14</text><text x="28" y="198">12</text><text x="28" y="258">10</text>
    <text x="201" y="293">甲</text><text x="361" y="293">乙</text>
    <text x="92" y="325" font-size="16">纵轴起点为 10 本</text>
  </g>
  <g stroke="#d6e0e8" stroke-width="1"><path d="M80 70H480M80 130H480M80 190H480M80 250H480"/></g>
  <rect x="180" y="190" width="66" height="60" fill="#367baf"/>
  <rect x="340" y="130" width="66" height="120" fill="#19796f"/>
  <g fill="none" stroke="#20394f" stroke-width="2"><path d="M80 48V250H480"/><path d="M72 263l16-8m-16 18 16-8"/></g>
</svg>
