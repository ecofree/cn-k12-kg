<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
<title id="title">用于实际作图的钝角三角形</title><desc id="desc">A在B的左上方，BC水平向右，角B为钝角。只给三角形和顶点，未提前画出高、角平分线、中线或垂足。</desc>
<style>text{font-family:Arial,sans-serif;font-size:22px;fill:#172b4d}.edge{stroke:#243746;stroke-width:2.5;fill:none}.light{stroke:#778899;stroke-width:2;fill:none;stroke-dasharray:6 5}.unit{stroke:#243746;stroke-width:2;fill:#dceafa}</style>
<rect width="620" height="300" fill="white"/>
<path class="edge" d="M 120 65 L 230 230 L 505 230 Z"/>
<circle cx="120" cy="65" r="3" fill="#172b4d"/>
<circle cx="230" cy="230" r="3" fill="#172b4d"/>
<circle cx="505" cy="230" r="3" fill="#172b4d"/>
<text x="113" y="46" text-anchor="middle">A</text>
<text x="228" y="261" text-anchor="middle">B</text>
<text x="516" y="261" text-anchor="middle">C</text>
