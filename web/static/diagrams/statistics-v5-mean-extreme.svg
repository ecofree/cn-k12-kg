<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" role="img" aria-labelledby="title desc">
<title id="title">总量改变，平均数也改变</title>
<desc id="desc">两行同尺度数轴。3、4、5、8的平均数是5；只将8改为28后，3、4、5、28的平均数是10。不能把28删去后仍称原数据的平均数。</desc>
<rect width="840" height="410" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">总量改变，平均数也改变</text>
<text x="420" y="105" font-size="21" text-anchor="middle">原来：3、4、5、8</text><line x1="110" y1="160" x2="770" y2="160" stroke="#18324d" stroke-width="2" /><line x1="110" y1="155" x2="110" y2="165" stroke="#18324d" stroke-width="2" /><text x="110" y="189" font-size="16" text-anchor="middle">0</text><line x1="220" y1="155" x2="220" y2="165" stroke="#18324d" stroke-width="2" /><text x="220" y="189" font-size="16" text-anchor="middle">5</text><line x1="330" y1="155" x2="330" y2="165" stroke="#18324d" stroke-width="2" /><text x="330" y="189" font-size="16" text-anchor="middle">10</text><line x1="440" y1="155" x2="440" y2="165" stroke="#18324d" stroke-width="2" /><text x="440" y="189" font-size="16" text-anchor="middle">15</text><line x1="550" y1="155" x2="550" y2="165" stroke="#18324d" stroke-width="2" /><text x="550" y="189" font-size="16" text-anchor="middle">20</text><line x1="660" y1="155" x2="660" y2="165" stroke="#18324d" stroke-width="2" /><text x="660" y="189" font-size="16" text-anchor="middle">25</text><line x1="770" y1="155" x2="770" y2="165" stroke="#18324d" stroke-width="2" /><text x="770" y="189" font-size="16" text-anchor="middle">30</text><circle cx="176" cy="145" r="6" fill="#2872ad"/><circle cx="198" cy="145" r="6" fill="#2872ad"/><circle cx="220" cy="145" r="6" fill="#2872ad"/><circle cx="286" cy="145" r="6" fill="#2872ad"/><line x1="220" y1="124" x2="220" y2="166" stroke="#bc5f29" stroke-width="3" /><text x="220" y="116" font-size="17" text-anchor="middle" fill="#9f4a20">平均5</text><text x="420" y="265" font-size="21" text-anchor="middle">只把8改为28</text><line x1="110" y1="320" x2="770" y2="320" stroke="#18324d" stroke-width="2" /><line x1="110" y1="315" x2="110" y2="325" stroke="#18324d" stroke-width="2" /><text x="110" y="349" font-size="16" text-anchor="middle">0</text><line x1="220" y1="315" x2="220" y2="325" stroke="#18324d" stroke-width="2" /><text x="220" y="349" font-size="16" text-anchor="middle">5</text><line x1="330" y1="315" x2="330" y2="325" stroke="#18324d" stroke-width="2" /><text x="330" y="349" font-size="16" text-anchor="middle">10</text><line x1="440" y1="315" x2="440" y2="325" stroke="#18324d" stroke-width="2" /><text x="440" y="349" font-size="16" text-anchor="middle">15</text><line x1="550" y1="315" x2="550" y2="325" stroke="#18324d" stroke-width="2" /><text x="550" y="349" font-size="16" text-anchor="middle">20</text><line x1="660" y1="315" x2="660" y2="325" stroke="#18324d" stroke-width="2" /><text x="660" y="349" font-size="16" text-anchor="middle">25</text><line x1="770" y1="315" x2="770" y2="325" stroke="#18324d" stroke-width="2" /><text x="770" y="349" font-size="16" text-anchor="middle">30</text><circle cx="176" cy="305" r="6" fill="#2872ad"/><circle cx="198" cy="305" r="6" fill="#2872ad"/><circle cx="220" cy="305" r="6" fill="#2872ad"/><circle cx="726" cy="305" r="6" fill="#2872ad"/><line x1="330" y1="284" x2="330" y2="326" stroke="#bc5f29" stroke-width="3" /><text x="330" y="276" font-size="17" text-anchor="middle" fill="#9f4a20">平均10</text>
</g></svg>
