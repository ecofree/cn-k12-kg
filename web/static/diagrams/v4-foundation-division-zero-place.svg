<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
<title id="title">816除以4：保留商的中间0</title><desc id="desc">逐步写出8减8、1减0、16减16；商的十位0表示这一位分不到一个十。</desc>
<rect width="900" height="530" rx="14" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="30" y="42" font-size="28" fill="#17324d" text-anchor="start" font-weight="bold">816 ÷ 4 = 204：商的十位0不能省去</text><rect x="30" y="68" width="300" height="390" rx="8" fill="#ffffff" stroke="#d1dee8"/><text x="180" y="101" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">百</text><text x="230" y="101" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">十</text><text x="280" y="101" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">个</text><text x="180" y="142" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">2</text><text x="230" y="142" font-size="32" fill="#946014" text-anchor="middle" font-weight="normal">0</text><text x="280" y="142" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">4</text><path d="M140 194 V155 H311" fill="none" stroke="#37566b" stroke-width="2"/><text x="105" y="194" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">4</text><text x="180" y="194" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">8</text><text x="230" y="194" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="280" y="194" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">6</text><text x="180" y="231" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">8</text><line x1="165" y1="241" x2="206" y2="241" stroke="#37566b" stroke-width="2"/><text x="230" y="277" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="230" y="310" font-size="30" fill="#946014" text-anchor="middle" font-weight="normal">0</text><line x1="215" y1="320" x2="301" y2="320" stroke="#37566b" stroke-width="2"/><text x="230" y="355" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="280" y="355" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">6</text><text x="230" y="389" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="280" y="389" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">6</text><line x1="215" y1="400" x2="301" y2="400" stroke="#37566b" stroke-width="2"/><text x="280" y="437" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">0</text><text x="365" y="125" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">① 8个百 ÷ 4 = 2个百</text><text x="365" y="164" font-size="21" fill="#17324d" text-anchor="start" font-weight="normal">百位商2；乘回8个百，减后为0。</text><text x="365" y="227" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">② 1个十不够每份1个十</text><text x="365" y="266" font-size="21" fill="#17324d" text-anchor="start" font-weight="normal">十位商0；0 × 4仍是0个十。</text><text x="365" y="329" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">③ 1个十与6个一合成16个一</text><text x="365" y="368" font-size="21" fill="#17324d" text-anchor="start" font-weight="normal">16 ÷ 4 = 4，个位商4，余数0。</text><text x="365" y="429" font-size="21" fill="#17324d" text-anchor="start" font-weight="normal">204表示2个百、0个十、4个一。</text><text x="32" y="497" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">检查：204 × 4 = 816；若漏写0，24 × 4只有96。</text>
</g></svg>
