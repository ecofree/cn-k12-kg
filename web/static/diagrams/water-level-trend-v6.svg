<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">五天水位折线图</title><desc id="desc">第1至5天水位依次10、12、11、13、12厘米。纵轴从9开始，每格1厘米，横轴每格一天。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="36" y="30" font-size="19" fill="#334155">五天水位观测记录</text><g stroke="#e2e8f0"><path d="M75 280H390"/><path d="M75 240H390"/><path d="M75 200H390"/><path d="M75 160H390"/><path d="M75 120H390"/><path d="M75 80H390"/><path d="M75 65V280"/><path d="M145 65V280"/><path d="M215 65V280"/><path d="M285 65V280"/><path d="M355 65V280"/></g><path d="M75 65V280H395" fill="none" stroke="#334155" stroke-width="2"/><polyline points="75,240 145,160 215,200 285,120 355,160" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="75" cy="240" r="4" fill="#2563eb"/><text x="75" y="304" text-anchor="middle" font-size="15">第1天</text><circle cx="145" cy="160" r="4" fill="#2563eb"/><text x="145" y="304" text-anchor="middle" font-size="15">第2天</text><circle cx="215" cy="200" r="4" fill="#2563eb"/><text x="215" y="304" text-anchor="middle" font-size="15">第3天</text><circle cx="285" cy="120" r="4" fill="#2563eb"/><text x="285" y="304" text-anchor="middle" font-size="15">第4天</text><circle cx="355" cy="160" r="4" fill="#2563eb"/><text x="355" y="304" text-anchor="middle" font-size="15">第5天</text><text x="64" y="285" text-anchor="end" font-size="15">9</text><text x="64" y="245" text-anchor="end" font-size="15">10</text><text x="64" y="205" text-anchor="end" font-size="15">11</text><text x="64" y="165" text-anchor="end" font-size="15">12</text><text x="64" y="125" text-anchor="end" font-size="15">13</text><text x="64" y="85" text-anchor="end" font-size="15">14</text><text x="24" y="58" font-size="15">水位/厘米</text><text x="36" y="340" font-size="14">纵轴从 9 开始，每格 1 厘米；横轴每格 1 天。</text></g></svg>
