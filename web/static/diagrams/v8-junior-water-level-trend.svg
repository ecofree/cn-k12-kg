<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 335" role="img" aria-labelledby="title desc"><title id="title">水位随天数的五次记录</title><desc id="desc">横轴d为第1至5天，间隔相同；纵轴h单位厘米，从9开始；五点水位10、12、11、13、12。纵轴并非从0开始。</desc><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#172b4d}.base{stroke:#243746;stroke-width:2;fill:none}.accent{stroke:#1659a6;stroke-width:3;fill:none}.grid{stroke:#d8e0e8;stroke-width:1}.point{fill:#172b4d}</style><rect width="465" height="335" fill="white"/><line class="grid" x1="60" y1="280" x2="390" y2="280"/><text x="28" y="286" >9</text><line class="grid" x1="60" y1="235" x2="390" y2="235"/><text x="28" y="241" >10</text><line class="grid" x1="60" y1="190" x2="390" y2="190"/><text x="28" y="196" >11</text><line class="grid" x1="60" y1="145" x2="390" y2="145"/><text x="28" y="151" >12</text><line class="grid" x1="60" y1="100" x2="390" y2="100"/><text x="28" y="106" >13</text><line class="grid" x1="60" y1="55" x2="390" y2="55"/><text x="28" y="61" >14</text><line class="base" x1="60" y1="295" x2="60" y2="35"/><line class="base" x1="50" y1="280" x2="410" y2="280"/><text x="425" y="286" >d</text><text x="66" y="25" >h / cm</text><text x="95" y="307" >1</text><line class="base" x1="100" y1="276" x2="100" y2="284"/><text x="160" y="307" >2</text><line class="base" x1="165" y1="276" x2="165" y2="284"/><text x="225" y="307" >3</text><line class="base" x1="230" y1="276" x2="230" y2="284"/><text x="290" y="307" >4</text><line class="base" x1="295" y1="276" x2="295" y2="284"/><text x="355" y="307" >5</text><line class="base" x1="360" y1="276" x2="360" y2="284"/><polyline class="accent" points="100,235 165,145 230,190 295,100 360,145"/><circle class="point" cx="100" cy="235" r="3"/><circle class="point" cx="165" cy="145" r="3"/><circle class="point" cx="230" cy="190" r="3"/><circle class="point" cx="295" cy="100" r="3"/><circle class="point" cx="360" cy="145" r="3"/></svg>