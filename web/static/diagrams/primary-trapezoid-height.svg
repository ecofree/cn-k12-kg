<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">梯形的底和高</title>
  <desc id="desc">梯形ABCD中AB与CD平行，D到AB的垂线段DH是以AB为底的高，斜边AD不是高。</desc>
  <rect width="640" height="380" rx="16" fill="#f6f9fc"/>
  <path d="M110 280 L510 280 L410 100 L250 100 Z" fill="#e3f2ec" stroke="#245468" stroke-width="3"/>
  <path d="M250 100 V280" stroke="#b35325" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M250 262 H268 V280" fill="none" stroke="#b35325" stroke-width="2"/>
  <path d="M302 272 L310 280 L302 288 M322 92 L330 100 L322 108" fill="none" stroke="#245468" stroke-width="2"/>
  <g font-family="sans-serif" fill="#173947" font-size="24" text-anchor="middle">
    <text x="95" y="310">A</text><text x="525" y="310">B</text>
    <text x="425" y="87">C</text><text x="237" y="87">D</text>
    <text x="250" y="310">H</text><text x="285" y="190" fill="#9a431d">高</text>
    <text x="320" y="350">AB ∥ CD，DH ⟂ AB</text>
  </g>
</svg>
