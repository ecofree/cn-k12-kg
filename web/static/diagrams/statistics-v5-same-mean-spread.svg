<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">均值相同，分散程度仍可不同</title>
<desc id="desc">两个同尺度数轴以分钟计。甲为4、5、6，乙为1、5、9；均值都是5，虚线标出均值，乙的两端距均值更远。</desc>
<rect width="840" height="430" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">均值相同，分散程度仍可不同</text>
<text x="420" y="100" font-size="21" text-anchor="middle">甲：4、5、6</text><line x1="110" y1="155" x2="770" y2="155" stroke="#18324d" stroke-width="2" /><line x1="110" y1="150" x2="110" y2="160" stroke="#18324d" stroke-width="2" /><text x="110" y="184" font-size="15" text-anchor="middle">0</text><line x1="176" y1="150" x2="176" y2="160" stroke="#18324d" stroke-width="2" /><text x="176" y="184" font-size="15" text-anchor="middle">1</text><line x1="242" y1="150" x2="242" y2="160" stroke="#18324d" stroke-width="2" /><text x="242" y="184" font-size="15" text-anchor="middle">2</text><line x1="308" y1="150" x2="308" y2="160" stroke="#18324d" stroke-width="2" /><text x="308" y="184" font-size="15" text-anchor="middle">3</text><line x1="374" y1="150" x2="374" y2="160" stroke="#18324d" stroke-width="2" /><text x="374" y="184" font-size="15" text-anchor="middle">4</text><line x1="440" y1="150" x2="440" y2="160" stroke="#18324d" stroke-width="2" /><text x="440" y="184" font-size="15" text-anchor="middle">5</text><line x1="506" y1="150" x2="506" y2="160" stroke="#18324d" stroke-width="2" /><text x="506" y="184" font-size="15" text-anchor="middle">6</text><line x1="572" y1="150" x2="572" y2="160" stroke="#18324d" stroke-width="2" /><text x="572" y="184" font-size="15" text-anchor="middle">7</text><line x1="638" y1="150" x2="638" y2="160" stroke="#18324d" stroke-width="2" /><text x="638" y="184" font-size="15" text-anchor="middle">8</text><line x1="704" y1="150" x2="704" y2="160" stroke="#18324d" stroke-width="2" /><text x="704" y="184" font-size="15" text-anchor="middle">9</text><line x1="770" y1="150" x2="770" y2="160" stroke="#18324d" stroke-width="2" /><text x="770" y="184" font-size="15" text-anchor="middle">10</text><circle id="spread-0-0" cx="374" cy="140" r="7" fill="#2872ad"/><circle id="spread-0-1" cx="440" cy="140" r="7" fill="#2872ad"/><circle id="spread-0-2" cx="506" cy="140" r="7" fill="#2872ad"/><line x1="440" y1="117" x2="440" y2="160" stroke="#bc5f29" stroke-width="2" stroke-dasharray="5 4"/><text x="420" y="255" font-size="21" text-anchor="middle">乙：1、5、9</text><line x1="110" y1="310" x2="770" y2="310" stroke="#18324d" stroke-width="2" /><line x1="110" y1="305" x2="110" y2="315" stroke="#18324d" stroke-width="2" /><text x="110" y="339" font-size="15" text-anchor="middle">0</text><line x1="176" y1="305" x2="176" y2="315" stroke="#18324d" stroke-width="2" /><text x="176" y="339" font-size="15" text-anchor="middle">1</text><line x1="242" y1="305" x2="242" y2="315" stroke="#18324d" stroke-width="2" /><text x="242" y="339" font-size="15" text-anchor="middle">2</text><line x1="308" y1="305" x2="308" y2="315" stroke="#18324d" stroke-width="2" /><text x="308" y="339" font-size="15" text-anchor="middle">3</text><line x1="374" y1="305" x2="374" y2="315" stroke="#18324d" stroke-width="2" /><text x="374" y="339" font-size="15" text-anchor="middle">4</text><line x1="440" y1="305" x2="440" y2="315" stroke="#18324d" stroke-width="2" /><text x="440" y="339" font-size="15" text-anchor="middle">5</text><line x1="506" y1="305" x2="506" y2="315" stroke="#18324d" stroke-width="2" /><text x="506" y="339" font-size="15" text-anchor="middle">6</text><line x1="572" y1="305" x2="572" y2="315" stroke="#18324d" stroke-width="2" /><text x="572" y="339" font-size="15" text-anchor="middle">7</text><line x1="638" y1="305" x2="638" y2="315" stroke="#18324d" stroke-width="2" /><text x="638" y="339" font-size="15" text-anchor="middle">8</text><line x1="704" y1="305" x2="704" y2="315" stroke="#18324d" stroke-width="2" /><text x="704" y="339" font-size="15" text-anchor="middle">9</text><line x1="770" y1="305" x2="770" y2="315" stroke="#18324d" stroke-width="2" /><text x="770" y="339" font-size="15" text-anchor="middle">10</text><circle id="spread-1-0" cx="176" cy="295" r="7" fill="#2872ad"/><circle id="spread-1-1" cx="440" cy="295" r="7" fill="#2872ad"/><circle id="spread-1-2" cx="704" cy="295" r="7" fill="#2872ad"/><line x1="440" y1="272" x2="440" y2="315" stroke="#bc5f29" stroke-width="2" stroke-dasharray="5 4"/><text x="420" y="415" font-size="18" text-anchor="middle">两组平均数都是5；比较的是数据围绕均值的偏离。</text>
</g></svg>
