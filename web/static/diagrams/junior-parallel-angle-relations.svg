<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">平行线被截的角关系</title><desc id="desc">两条水平线a、b已给定平行；截线与它们的锐角均为60度。对应位置的两角同为60度，同旁内角为120度和60度，和为180度。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="455" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="36" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">已知 a ∥ b，再使用角的关系</text><line x1="80" y1="135" x2="690" y2="135" stroke="#18324d" stroke-width="2"/><line x1="80" y1="330" x2="690" y2="330" stroke="#18324d" stroke-width="2"/><line x1="264.8889300106973" y1="395" x2="446.75426480542944" y2="80" stroke="#18324d" stroke-width="2"/><path d="M 436.000 98.627 A 42 42 0 0 1 457.000 135.000" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 323.417 293.627 A 42 42 0 0 1 344.417 330.000" fill="none" stroke="#19769b" stroke-width="2"/><path d="M 479.000 135.000 A 64 64 0 0 1 383.000 190.426" fill="none" stroke="#c65b19" stroke-width="2"/><text x="484" y="117" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">60°</text><text x="371.41669750802293" y="312" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">60°</text><text x="477" y="214" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">120°</text><text x="705" y="141" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">a</text><text x="705" y="336" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">b</text><text x="466" y="85" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">t</text><text x="380" y="421" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">同位角相等；同旁内角 120° + 60° = 180°</text><line x1="172" y1="129" x2="182" y2="135" stroke="#18324d" stroke-width="2"/><line x1="182" y1="135" x2="172" y2="141" stroke="#18324d" stroke-width="2"/><line x1="172" y1="324" x2="182" y2="330" stroke="#18324d" stroke-width="2"/><line x1="182" y1="330" x2="172" y2="336" stroke="#18324d" stroke-width="2"/></g></svg>
