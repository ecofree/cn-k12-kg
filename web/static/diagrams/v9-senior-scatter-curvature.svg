<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">散点中的上升与弯曲</title><desc id="desc">点为0,0；1,1；2,4；3,9；4,16。未连线或提供拟合模型。</desc>
<style>text{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;fill:#142b43;font-size:20px} .grid{stroke:#dbe3ec;stroke-width:1} .axis{stroke:#334b63;stroke-width:2} .small{font-size:16px}</style>
<rect width="720" height="500" fill="#fff"/>
