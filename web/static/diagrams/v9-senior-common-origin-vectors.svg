<svg xmlns="http://www.w3.org/2000/svg" width="720" height="465" viewBox="0 0 720 465" role="img" aria-labelledby="title desc">
<title id="title">共起点向量a与b</title><desc id="desc">向量a从O指向P，向量b从O指向Q。P与Q以无箭头灰虚线连接。</desc>
<style>text{font-family:'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif;fill:#142b43;font-size:20px} .grid{stroke:#dbe3ec;stroke-width:1} .axis{stroke:#334b63;stroke-width:2} .small{font-size:16px}</style>
<rect width="720" height="465" fill="#fff"/>
<defs><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176eb4"/></marker><marker id="orange-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b24e07"/></marker></defs>
<text x="40" y="36" >a = OP, b = OQ</text>
<line x1="300" y1="100" x2="580" y2="290" stroke="#99a8b8" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="100" y1="360" x2="580" y2="290" stroke="#176eb4" stroke-width="4" marker-end="url(#blue-arrow)"/>
<line x1="100" y1="360" x2="300" y2="100" stroke="#b24e07" stroke-width="4" marker-end="url(#orange-arrow)"/>
<circle cx="100" cy="360" r="4" fill="#142b43"/>
<text x="75" y="384" >O</text>
<circle cx="580" cy="290" r="4" fill="#142b43"/>
<text x="595" y="298" >P</text>
<circle cx="300" cy="100" r="4" fill="#142b43"/>
<text x="312" y="91" >Q</text>
<text x="365" y="345" >a</text>
<text x="180" y="215" >b</text>
<text x="40" y="435" class="small">The grey dashed segment PQ has no assigned direction.</text>
</svg>
