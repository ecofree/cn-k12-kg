<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">步行占全班35%的扇形图</title><desc id="desc">蓝色步行扇形占35%，灰色其他方式占65%；整圆代表全班40人。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="45" y="32" font-size="19" fill="#334155">某班 40 人的上学方式</text><circle cx="240" cy="150" r="90" fill="#e2e8f0" stroke="#64748b"/><path d="M240 150L240 60A90 90 0 0 1 312.811529 202.900673Z" fill="#2563eb" stroke="white" stroke-width="2"/><text x="275" y="129" fill="white" font-size="21" text-anchor="middle">35%</text><text x="193" y="179" fill="#334155" font-size="21" text-anchor="middle">65%</text><rect x="102" y="267" width="16" height="16" fill="#2563eb"/><text x="127" y="281" font-size="17">步行</text><rect x="235" y="267" width="16" height="16" fill="#e2e8f0" stroke="#64748b"/><text x="260" y="281" font-size="17">其他方式</text><text x="82" y="328" font-size="15">整圆代表全班 40 人，类别互不重叠。</text></g></svg>
