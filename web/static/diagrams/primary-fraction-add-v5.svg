<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="title desc"><title id="title">同一单位下二分之一与三分之一的通分加法</title><desc id="desc">三条等长色带均等分6份；第一条涂3份，第二条涂2份，第三条涂5份，直观核对三份加两份。</desc><rect width="640" height="310" fill="#fff"/><g font-family="sans-serif" fill="#243449"><text x="28" y="28" font-size="18">三条色带都表示同一个单位“1”</text><rect x="90" y="60" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="150" y="60" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="210" y="60" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="270" y="60" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="330" y="60" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="390" y="60" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><text x="470" y="88" font-size="17">1/2=3/6</text><rect x="90" y="128" width="60" height="42" fill="#e6ab71" stroke="#40546a" stroke-width="1.5"/><rect x="150" y="128" width="60" height="42" fill="#e6ab71" stroke="#40546a" stroke-width="1.5"/><rect x="210" y="128" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="270" y="128" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="330" y="128" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="390" y="128" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><text x="470" y="156" font-size="17">1/3=2/6</text><rect x="90" y="196" width="60" height="42" fill="#8ebaa2" stroke="#40546a" stroke-width="1.5"/><rect x="150" y="196" width="60" height="42" fill="#8ebaa2" stroke="#40546a" stroke-width="1.5"/><rect x="210" y="196" width="60" height="42" fill="#8ebaa2" stroke="#40546a" stroke-width="1.5"/><rect x="270" y="196" width="60" height="42" fill="#8ebaa2" stroke="#40546a" stroke-width="1.5"/><rect x="330" y="196" width="60" height="42" fill="#8ebaa2" stroke="#40546a" stroke-width="1.5"/><rect x="390" y="196" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><text x="470" y="224" font-size="17">5/6</text><text x="28" y="278" font-size="16">合起来是5个六分之一；分母6表示每份大小，不能把它相加。</text></g></svg>
