<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">在同一个x处计算带符号残差</title>
<desc id="desc">拟合线为ŷ=20+3x。x=4时预测32，观测35，竖直段从预测点32到观测点35，残差为正3；不是两点的水平距离。</desc>
<rect width="840" height="430" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">在同一个x处计算带符号残差</text>
<line x1="100" y1="340" x2="730" y2="340" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="345" font-size="15" text-anchor="end">0</text><line x1="100" y1="308.125" x2="730" y2="308.125" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="313.125" font-size="15" text-anchor="end">5</text><line x1="100" y1="276.25" x2="730" y2="276.25" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="281.25" font-size="15" text-anchor="end">10</text><line x1="100" y1="244.375" x2="730" y2="244.375" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="249.375" font-size="15" text-anchor="end">15</text><line x1="100" y1="212.5" x2="730" y2="212.5" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="217.5" font-size="15" text-anchor="end">20</text><line x1="100" y1="180.625" x2="730" y2="180.625" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="185.625" font-size="15" text-anchor="end">25</text><line x1="100" y1="148.75" x2="730" y2="148.75" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="153.75" font-size="15" text-anchor="end">30</text><line x1="100" y1="116.875" x2="730" y2="116.875" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="121.875" font-size="15" text-anchor="end">35</text><line x1="100" y1="85" x2="730" y2="85" stroke="#dbe5ec" stroke-width="1" /><text x="88" y="90" font-size="15" text-anchor="end">40</text><line x1="100" y1="340" x2="730" y2="340" stroke="#18324d" stroke-width="2" /><line x1="100" y1="340" x2="100" y2="85" stroke="#18324d" stroke-width="2" /><text x="100" y="365" font-size="16" text-anchor="middle">0</text><text x="205" y="365" font-size="16" text-anchor="middle">1</text><text x="310" y="365" font-size="16" text-anchor="middle">2</text><text x="415" y="365" font-size="16" text-anchor="middle">3</text><text x="520" y="365" font-size="16" text-anchor="middle">4</text><text x="625" y="365" font-size="16" text-anchor="middle">5</text><text x="730" y="365" font-size="16" text-anchor="middle">6</text><line x1="100" y1="212.5" x2="730" y2="97.75" stroke="#2872ad" stroke-width="3" /><line x1="520" y1="136" x2="520" y2="116.875" stroke="#bc5f29" stroke-width="4" /><circle cx="520" cy="116.875" r="6" fill="#bc5f29"/><circle cx="520" cy="136" r="5" fill="#2872ad"/><text x="538" y="108.875" font-size="17" text-anchor="start">观测(4,35)</text><text x="538" y="159" font-size="17" text-anchor="start">预测(4,32)</text><text x="285" y="108" font-size="20" text-anchor="middle">ŷ = 20 + 3x</text><text x="420" y="410" font-size="18" text-anchor="middle">竖直方向：观测减预测；正残差表示观测点在线上方。</text>
</g></svg>
