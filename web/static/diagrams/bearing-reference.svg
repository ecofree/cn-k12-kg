<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430" role="img" aria-labelledby="title desc">
<title id="title">以学校为观察点确定公园的位置</title>
<desc id="desc">北向朝上。学校O到公园P的线段与正北方向夹角30度，OP距离600米。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>
<rect width="500" height="430" rx="16" fill="#f7fafc"/>
<g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5">
<line x1="180" y1="310" x2="180" y2="60" marker-end="url(#arrow)"/>
<line x1="180" y1="310" x2="180" y2="385"/>
<line x1="65" y1="310" x2="430" y2="310"/>
</g>
<g font-family="sans-serif" font-size="20" fill="#334155">
<text x="180" y="38" text-anchor="middle">北</text><text x="450" y="317" text-anchor="middle">东</text>
<text x="180" y="413" text-anchor="middle">南</text><text x="40" y="317" text-anchor="middle">西</text>
</g>
<line x1="180" y1="310" x2="295" y2="110.814157" stroke="#146b56" stroke-width="4"/>
<path d="M180,260 A50,50 0 0 1 205,266.69873" fill="none" stroke="#d97921" stroke-width="3"/>
<text x="195" y="245" font-family="sans-serif" font-size="20" fill="#9a4b0b">30°</text>
<g fill="#146b56"><circle cx="180" cy="310" r="6"/><circle cx="295" cy="110.814157" r="6"/></g>
<g font-family="sans-serif" font-size="20" fill="#172033">
<text x="147" y="347" text-anchor="middle">学校 O</text><text x="310" y="108">公园 P</text>
<text x="284" y="233">600 米</text>
</g>
</svg>
