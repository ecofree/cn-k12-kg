<svg xmlns="http://www.w3.org/2000/svg" width="650" height="490" viewBox="0 0 650 490" role="img" aria-labelledby="title desc"><title id="title">截断纵轴的条形图</title><desc id="desc">纵轴起点16本，甲18本，乙20本；可见条长比2比4不等于本数比18比20。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:18px}.title{font-size:25px;font-weight:700}.small{font-size:16px}.tick{font-size:17px}.grid{stroke:#d5e0e8;stroke-width:1}.axis{stroke:#37566b;stroke-width:2}.label{font-size:20px;font-weight:600}</style><rect width="100%" height="100%" fill="#f8fbfd" rx="12"/><text x="30" y="40" class="title" text-anchor="start">画出的条长与实际本数</text><text x="30" y="72" class="small" text-anchor="start">甲 18 本，乙 20 本；纵轴从 16 本截起</text><line x1="100" y1="360" x2="580" y2="360" class="grid"/><text x="85" y="366" class="tick" text-anchor="end">16</text><line x1="100" y1="322" x2="580" y2="322" class="grid"/><text x="85" y="328" class="tick" text-anchor="end">17</text><line x1="100" y1="284" x2="580" y2="284" class="grid"/><text x="85" y="290" class="tick" text-anchor="end">18</text><line x1="100" y1="246" x2="580" y2="246" class="grid"/><text x="85" y="252" class="tick" text-anchor="end">19</text><line x1="100" y1="208" x2="580" y2="208" class="grid"/><text x="85" y="214" class="tick" text-anchor="end">20</text><line x1="100" y1="170" x2="580" y2="170" class="grid"/><text x="85" y="176" class="tick" text-anchor="end">21</text><line x1="100" y1="132" x2="580" y2="132" class="grid"/><text x="85" y="138" class="tick" text-anchor="end">22</text><line x1="100" y1="120" x2="100" y2="360" class="axis"/><line x1="100" y1="360" x2="580" y2="360" class="axis"/><path d="M93 373 l14 -7 l-14 14 l14 -7" stroke="#b24a35" fill="none" stroke-width="3"/><rect x="205" y="284" width="75" height="76" fill="#805da6" rx="3"/><text x="242.5" y="274" class="label" text-anchor="middle">18本</text><text x="242.5" y="397" class="label" text-anchor="middle">甲</text><rect x="405" y="208" width="75" height="152" fill="#805da6" rx="3"/><text x="442.5" y="198" class="label" text-anchor="middle">20本</text><text x="442.5" y="397" class="label" text-anchor="middle">乙</text><text x="32" y="435" class="small" text-anchor="start">从16起：可见条长分别对应 2 本、4 本。</text><text x="32" y="464" class="small" text-anchor="start">实际数量要读 18 与 20，不能把条长之比当成本数之比。</text></svg>
