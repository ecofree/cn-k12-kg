<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 435" role="img" aria-labelledby="title desc"><title id="title">未画目标点的北向基准图</title><desc id="desc">学校O处有正北和东西基准线，没有预画待求方向或距离，供自己预测和作图。</desc><rect width="600" height="435" fill="#fff"/><g font-family="sans-serif" fill="#243449"><text x="25" y="30" font-size="18">作图辅助：先写观测点与方向基准</text><line x1="240" y1="330" x2="240" y2="65" stroke="#5d7180"/><line x1="80" y1="330" x2="440" y2="330" stroke="#5d7180"/><text x="226" y="55" font-size="18">北</text><text x="450" y="336" font-size="18">东</text><text x="43" y="336" font-size="18">西</text><text x="205" y="358" font-size="18">学校O</text><text x="25" y="405" font-size="16">请在纸上另作图；屏幕显示会缩放，不把像素当厘米。</text></g></svg>
