<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">签到时刻与经过的时间</title>
  <desc id="desc">同一周周一到周四上午8时在时间线上等距标出。四个时刻点之间有相邻的日间隔。</desc>
  <rect width="760" height="240" fill="#fff"/>
  <g font-family="sans-serif" fill="#17334f" text-anchor="middle">
    <text x="380" y="38" font-size="24">每一天都在上午8:00签到</text>
    <path d="M75 112H690L679 106M690 112L679 118" fill="none" stroke="#385e7b" stroke-width="3"/>
    <g fill="#196b9e"><circle cx="100" cy="112" r="7"/><circle cx="280" cy="112" r="7"/><circle cx="460" cy="112" r="7"/><circle cx="640" cy="112" r="7"/></g>
    <g font-size="20"><text x="100" y="151">周一 8:00</text><text x="280" y="151">周二 8:00</text><text x="460" y="151">周三 8:00</text><text x="640" y="151">周四 8:00</text></g>
    <g font-size="19"><text x="190" y="91">1天</text><text x="370" y="91">1天</text><text x="550" y="91">1天</text></g>
    <text x="380" y="208" font-size="20">求经过时间时数间隔；求签到次数时数时刻点。</text>
  </g>
</svg>
