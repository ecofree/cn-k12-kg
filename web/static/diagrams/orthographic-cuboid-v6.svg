<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" role="img" aria-labelledby="title desc"><title id="title">长方体三视图与对应尺寸</title><desc id="desc">主视4乘2，左视3乘2，俯视4乘3；三图每单位长度用相同尺度，主俯长度对正，主左高度平齐。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="35" y="30" font-size="19" fill="#334155">长 4、宽 3、高 2：三视图</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="65" y="85" width="160" height="80"/><rect x="275" y="85" width="120" height="80"/><rect x="65" y="225" width="160" height="120"/></g><g stroke="#94a3b8" stroke-dasharray="4 4"><path d="M65 165V225M225 165V345M225 85H275M225 165H395"/></g><g fill="#334155" font-size="16"><text x="145" y="70" text-anchor="middle">主视：长 × 高</text><text x="335" y="70" text-anchor="middle">左视：宽 × 高</text><text x="145" y="210" text-anchor="middle">俯视：长 × 宽</text><text x="145" y="131" text-anchor="middle">4 × 2</text><text x="335" y="131" text-anchor="middle">3 × 2</text><text x="145" y="290" text-anchor="middle">4 × 3</text><text x="270" y="250">同一单位长度</text><text x="270" y="279">长对正</text><text x="270" y="308">高平齐</text><text x="270" y="337">宽相等</text></g></g></svg>
