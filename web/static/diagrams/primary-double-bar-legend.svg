<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" role="img" aria-labelledby="title desc"><title id="title">带图例和刻度的复式条形图</title><desc id="desc">某班男生为蓝色实条，女生为斜线条；纵轴0到24人，每格2人，男生22人、女生20人。图例不只依赖颜色。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="465" fill="#f8fafc" stroke="none" stroke-width="2"/><defs><pattern id="girl-stripes" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f5c589"/><path d="M -3 3 L 3 -3 M 0 9 L 9 0 M 6 12 L 12 6" stroke="#98622e" stroke-width="1.5"/></pattern></defs><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">先看图例，再比较同一班的两组数据</text><line x1="160" y1="350" x2="640" y2="350" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="355" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">0</text><line x1="160" y1="330" x2="640" y2="330" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="335" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">2</text><line x1="160" y1="310" x2="640" y2="310" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="315" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">4</text><line x1="160" y1="290" x2="640" y2="290" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="295" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">6</text><line x1="160" y1="270" x2="640" y2="270" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="275" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">8</text><line x1="160" y1="250" x2="640" y2="250" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="255" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">10</text><line x1="160" y1="230" x2="640" y2="230" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="235" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">12</text><line x1="160" y1="210" x2="640" y2="210" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="215" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">14</text><line x1="160" y1="190" x2="640" y2="190" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="195" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">16</text><line x1="160" y1="170" x2="640" y2="170" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="175" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">18</text><line x1="160" y1="150" x2="640" y2="150" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="155" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">20</text><line x1="160" y1="130" x2="640" y2="130" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="135" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">22</text><line x1="160" y1="110" x2="640" y2="110" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="115" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">24</text><line x1="160" y1="350" x2="160" y2="90" stroke="#18324d" stroke-width="2"/><line x1="160" y1="350" x2="655" y2="350" stroke="#18324d" stroke-width="2"/><text x="147" y="75" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">人数（人）</text><rect x="250" y="130" width="90" height="220" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><rect x="430" y="150" width="90" height="200" fill="url(#girl-stripes)" stroke="#18324d" stroke-width="2"/><text x="385" y="385" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">某班</text><rect x="420" y="70" width="22" height="22" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><text x="455" y="88" font-size="18" text-anchor="start" fill="#18324d" font-weight="normal">男生</text><rect x="550" y="70" width="22" height="22" fill="url(#girl-stripes)" stroke="#18324d" stroke-width="2"/><text x="585" y="88" font-size="18" text-anchor="start" fill="#18324d" font-weight="normal">女生</text><text x="380" y="430" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">纵轴每格2人；图例同时用颜色和条纹区分</text></g></svg>
