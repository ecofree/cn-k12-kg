<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 365" role="img" aria-labelledby="title desc"><title id="title">不等时间间隔的水量记录</title><desc id="desc">横轴时间t以小时为单位、每小时60像素；纵轴水量V以升为单位、每升20像素；记录点(0,1)、(2,7)、(5,13)，横向间隔真实为2与3小时。</desc><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#172b4d}.base{stroke:#243746;stroke-width:2;fill:none}.accent{stroke:#1659a6;stroke-width:3;fill:none}.grid{stroke:#d8e0e8;stroke-width:1}.point{fill:#172b4d}</style><rect width="500" height="365" fill="white"/><line class="grid" x1="70" y1="310" x2="405" y2="310"/><text x="40" y="316" >0</text><line class="grid" x1="70" y1="270" x2="405" y2="270"/><text x="40" y="276" >2</text><line class="grid" x1="70" y1="230" x2="405" y2="230"/><text x="40" y="236" >4</text><line class="grid" x1="70" y1="190" x2="405" y2="190"/><text x="40" y="196" >6</text><line class="grid" x1="70" y1="150" x2="405" y2="150"/><text x="40" y="156" >8</text><line class="grid" x1="70" y1="110" x2="405" y2="110"/><text x="40" y="116" >10</text><line class="grid" x1="70" y1="70" x2="405" y2="70"/><text x="40" y="76" >12</text><line class="grid" x1="70" y1="30" x2="405" y2="30"/><text x="40" y="36" >14</text><line class="grid" x1="80" y1="30" x2="80" y2="310"/><text x="75" y="335" >0</text><line class="grid" x1="140" y1="30" x2="140" y2="310"/><text x="135" y="335" >1</text><line class="grid" x1="200" y1="30" x2="200" y2="310"/><text x="195" y="335" >2</text><line class="grid" x1="260" y1="30" x2="260" y2="310"/><text x="255" y="335" >3</text><line class="grid" x1="320" y1="30" x2="320" y2="310"/><text x="315" y="335" >4</text><line class="grid" x1="380" y1="30" x2="380" y2="310"/><text x="375" y="335" >5</text><line class="base" x1="80" y1="320" x2="80" y2="20"/><line class="base" x1="65" y1="310" x2="425" y2="310"/><text x="425" y="335" >t / h</text><text x="86" y="18" >V / L</text><polyline class="accent" points="80,290 200,170 380,50"/><circle class="point" cx="80" cy="290" r="3"/><text x="90" y="283" >(0,1)</text><circle class="point" cx="200" cy="170" r="3"/><text x="212" y="165" >(2,7)</text><circle class="point" cx="380" cy="50" r="3"/><text x="315" y="40" >(5,13)</text></svg>