<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-labelledby="title desc"><title id="title">组合图形的缺口与分割</title><desc id="desc">外框是8厘米乘6厘米长方形，右上角去掉3厘米乘2厘米矩形。蓝色区域保留。水平虚线从左边延伸到缺口左下角，给出一种不重叠的分割。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="720" height="465" fill="#fff"/><text x="360" y="35" text-anchor="middle" class="title">长方形去掉右上角后的剩余图形</text><path d="M150 100H350V180H470V340H150Z" fill="#cfe6f7" class="shape"/><rect x="350" y="100" width="120" height="80" fill="#fff" stroke="#8a4b12" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M150 180H350" class="dash"/><text x="310" y="380" text-anchor="middle" class="">外框长 8 cm</text><text x="75" y="225" text-anchor="middle" class="label">外框宽</text><text x="75" y="252" text-anchor="middle" class="label">6 cm</text><text x="410" y="83" text-anchor="middle" class="label">缺口长 3 cm</text><text x="535" y="138" text-anchor="middle" class="label">缺口宽</text><text x="535" y="165" text-anchor="middle" class="label">2 cm</text><text x="250" y="145" text-anchor="middle" class="label">留下的部分</text><text x="310" y="270" text-anchor="middle" class="label">留下的部分</text><text x="360" y="430" text-anchor="middle" class="label">虚线补出被去掉的区域；另一条虚线提示一种分割。</text></svg>
