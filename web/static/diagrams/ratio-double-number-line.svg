<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">水量和费用双数轴</title><desc id="desc">0、1、3、5升对应0、4、12、20元，固定单价4元每升。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="380" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="40" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">固定单价：用对应数量表示</text><text x="110" y="90" font-size="19" text-anchor="start" fill="#18324d" font-weight="normal">水量（升）</text><line x1="120" y1="135" x2="650" y2="135" stroke="#18324d" stroke-width="2"/><line x1="120" y1="127" x2="120" y2="143" stroke="#18324d" stroke-width="2"/><text x="120" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="226" y1="127" x2="226" y2="143" stroke="#18324d" stroke-width="2"/><text x="226" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="332" y1="127" x2="332" y2="143" stroke="#18324d" stroke-width="2"/><text x="332" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><line x1="438" y1="127" x2="438" y2="143" stroke="#18324d" stroke-width="2"/><text x="438" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><line x1="544" y1="127" x2="544" y2="143" stroke="#18324d" stroke-width="2"/><text x="544" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><line x1="650" y1="127" x2="650" y2="143" stroke="#18324d" stroke-width="2"/><text x="650" y="170" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">5</text><text x="110" y="215" font-size="19" text-anchor="start" fill="#18324d" font-weight="normal">费用（元）</text><line x1="120" y1="260" x2="650" y2="260" stroke="#18324d" stroke-width="2"/><line x1="120" y1="252" x2="120" y2="268" stroke="#18324d" stroke-width="2"/><text x="120" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="226" y1="252" x2="226" y2="268" stroke="#18324d" stroke-width="2"/><text x="226" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><line x1="332" y1="252" x2="332" y2="268" stroke="#18324d" stroke-width="2"/><text x="332" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">8</text><line x1="438" y1="252" x2="438" y2="268" stroke="#18324d" stroke-width="2"/><text x="438" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">12</text><line x1="544" y1="252" x2="544" y2="268" stroke="#18324d" stroke-width="2"/><text x="544" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">16</text><line x1="650" y1="252" x2="650" y2="268" stroke="#18324d" stroke-width="2"/><text x="650" y="295" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">20</text><line x1="120" y1="148" x2="120" y2="246" stroke="#8aa6bc" stroke-width="1" stroke-dasharray="5 5"/><line x1="226" y1="148" x2="226" y2="246" stroke="#8aa6bc" stroke-width="1" stroke-dasharray="5 5"/><line x1="438" y1="148" x2="438" y2="246" stroke="#8aa6bc" stroke-width="1" stroke-dasharray="5 5"/><line x1="650" y1="148" x2="650" y2="246" stroke="#8aa6bc" stroke-width="1" stroke-dasharray="5 5"/><text x="380" y="345" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">1 升对应 4 元；水量和费用同步按倍数变化</text></g></svg>
