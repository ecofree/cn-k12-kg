<svg xmlns="http://www.w3.org/2000/svg" width="570" height="380" viewBox="0 0 570 380" role="img" aria-labelledby="title"><title id="title">从截断的起点继续读数</title><rect width="570" height="380" fill="white"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:19px;fill:#172b4d}.small{font-size:16px}.title{font-size:23px;font-weight:700}.grid{stroke:#d8e2ef;stroke-width:1}</style><text class="title" x="25" y="34">从截断的起点继续读数</text><text class="small" x="32" y="63">数量（本）</text><path class="grid" d="M92 292.0 H510"/><text x="76" y="298.0" text-anchor="end">20</text><path class="grid" d="M92 239.0 H510"/><text x="76" y="245.0" text-anchor="end">25</text><path class="grid" d="M92 186.0 H510"/><text x="76" y="192.0" text-anchor="end">30</text><path class="grid" d="M92 133.0 H510"/><text x="76" y="139.0" text-anchor="end">35</text><path class="grid" d="M92 80.0 H510"/><text x="76" y="86.0" text-anchor="end">40</text><path d="M92 75 V292 H520" fill="none" stroke="#34445b" stroke-width="2"/><rect x="220" y="186.0" width="74" height="106.0" fill="#54a8b5" stroke="#13697e" stroke-width="2"/><text x="257" y="321" text-anchor="middle">甲</text><path d="M86 297 l12 5 -12 5 12 5" fill="none" stroke="#34445b" stroke-width="2"/><text class="small" x="25" y="360">注意：纵轴起点是20本，这里没有画出从0到起点的一段。</text></svg>