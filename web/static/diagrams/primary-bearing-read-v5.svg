<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 410" role="img" aria-labelledby="title desc"><title id="title">以学校为观测点的北偏东30度500米</title><desc id="desc">O为学校，北向上，东向右；OP与正北夹角30度，标注距离500米。OP的几何方向按三角函数确定。</desc><rect width="610" height="410" fill="#fff"/><g font-family="sans-serif" fill="#243449"><text x="28" y="30" font-size="18">学校O与图书馆P的位置</text><line x1="200" y1="300" x2="200" y2="50" stroke="#5d7180"/><line x1="200" y1="300" x2="450" y2="300" stroke="#5d7180"/><line id="bearing-ray" x1="200" y1="300" x2="300" y2="126.794919243" stroke="#267d9a" stroke-width="3"/><path d="M200 250 A50 50 0 0 1 225 256.69873" fill="none" stroke="#ae5f25" stroke-width="2"/><text x="185" y="45" font-size="17">北</text><text x="460" y="307" font-size="17">东</text><text x="165" y="327" font-size="17">学校O</text><text x="313" y="130" font-size="17">图书馆P</text><text x="209" y="239" font-size="16">30°</text><text x="260" y="217" font-size="17">500米</text><text x="28" y="375" font-size="16">转角从北向东量。屏幕图仅供读图，不用尺量屏幕厘米。</text></g></svg>
