<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">相同实物量在不同整体中的分数</title><desc id="desc">第一行整体18厘米，第二行整体24厘米；两行都从同一起点标出12厘米红线，实际红线等长。</desc><rect width="760" height="340" fill="#fff"/><g font-family="sans-serif" fill="#17334f" text-anchor="middle"><text x="380" y="36" font-size="24">红线保持12厘米，改变参照整体</text><path d="M90 105H522" stroke="#7094ae" stroke-width="9"/><path d="M90 105H378" stroke="#c53e3e" stroke-width="9"/><path d="M90 92V118M522 92V118" stroke="#17334f" stroke-width="2"/><text x="306" y="77" font-size="20">整体18厘米</text><text x="234" y="144" fill="#ac2929" font-size="20">红线12厘米</text><path d="M90 225H666" stroke="#7094ae" stroke-width="9"/><path d="M90 225H378" stroke="#c53e3e" stroke-width="9"/><path d="M90 212V238M666 212V238" stroke="#17334f" stroke-width="2"/><text x="378" y="197" font-size="20">整体24厘米</text><text x="234" y="264" fill="#ac2929" font-size="20">红线12厘米</text><text x="380" y="311" font-size="19">两行按相同比例绘制；红线没有移动或裁剪。</text></g></svg>
