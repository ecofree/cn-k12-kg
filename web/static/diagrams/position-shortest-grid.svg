<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">两个给定网格点</title><desc id="desc">列1到6从左到右，行1到4从下到上；A在(2,1)、B在(6,4)，每格边100米，未预画路线。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="410" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="36" font-size="23" text-anchor="middle" fill="#18324d" font-weight="bold">只沿横竖网格线走，图上没有障碍</text><line x1="120" y1="90" x2="120" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="120" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="200" y1="90" x2="200" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="200" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><line x1="280" y1="90" x2="280" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="280" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><line x1="360" y1="90" x2="360" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="360" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><line x1="440" y1="90" x2="440" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="440" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">5</text><line x1="520" y1="90" x2="520" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="520" y="363" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6</text><line x1="120" y1="330" x2="520" y2="330" stroke="#aabfce" stroke-width="1.5"/><text x="98" y="336" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="120" y1="250" x2="520" y2="250" stroke="#aabfce" stroke-width="1.5"/><text x="98" y="256" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><line x1="120" y1="170" x2="520" y2="170" stroke="#aabfce" stroke-width="1.5"/><text x="98" y="176" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><line x1="120" y1="90" x2="520" y2="90" stroke="#aabfce" stroke-width="1.5"/><text x="98" y="96" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><circle cx="200" cy="330" r="7" fill="#c65b19"/><text x="181" y="314" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">A</text><circle cx="520" cy="90" r="7" fill="#c65b19"/><text x="542" y="86" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">B</text><text x="550" y="365" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">列</text><text x="95" y="72" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">行</text><line x1="580" y1="250" x2="660" y2="250" stroke="#18324d" stroke-width="2"/><line x1="580" y1="243" x2="580" y2="257" stroke="#18324d" stroke-width="2"/><line x1="660" y1="243" x2="660" y2="257" stroke="#18324d" stroke-width="2"/><text x="620" y="285" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">100米</text></g></svg>
