<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">闰年跨越二月的时间线</title>
  <desc id="desc">2028年2月28日中午、2月29日中午和3月1日中午是三个连续等距的时刻点，相邻两点间隔1天。</desc>
  <rect width="760" height="240" fill="#fff"/>
  <g font-family="sans-serif" fill="#17334f" text-anchor="middle">
    <text x="380" y="38" font-size="24">2028年：2月有29天</text>
    <path d="M65 112H695L684 106M695 112L684 118" fill="none" stroke="#385e7b" stroke-width="3"/>
    <g fill="#196b9e"><circle cx="120" cy="112" r="7"/><circle cx="380" cy="112" r="7"/><circle cx="640" cy="112" r="7"/></g>
    <g font-size="20"><text x="120" y="153">2月28日12:00</text><text x="380" y="153">2月29日12:00</text><text x="640" y="153">3月1日12:00</text></g>
    <g font-size="19"><text x="250" y="91">1天</text><text x="510" y="91">1天</text></g>
    <text x="380" y="209" font-size="20">先确认日历中存在的日期，再区分点与间隔。</text>
  </g>
</svg>
