<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" role="img" aria-labelledby="title desc"><title id="title">百分比与总体</title><desc id="desc">整个圆表示200人，某部分30%对应108度扇形，其余70%对应252度；图中不给出部分人数。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="425" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">整圆表示总体，扇形表示占比</text><path d="M 245 220 L 245.0000 100.0000 A 120 120 0 0 1 359.1268 257.0820 Z" fill="#72b4dc" stroke="#284e68" stroke-width="2"/><path d="M 245 220 L 359.1268 257.0820 A 120 120 0 1 1 245.0000 100.0000 Z" fill="#f5c589" stroke="#284e68" stroke-width="2"/><text x="299" y="181" font-size="25" text-anchor="middle" fill="#18324d" font-weight="normal">30%</text><text x="194" y="270" font-size="25" text-anchor="middle" fill="#18324d" font-weight="normal">70%</text><text x="535" y="136" font-size="24" text-anchor="middle" fill="#18324d" font-weight="normal">整体：200人</text><rect x="425" y="190" width="24" height="24" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><text x="466" y="211" font-size="21" text-anchor="start" fill="#18324d" font-weight="normal">某部分占30%</text><rect x="425" y="246" width="24" height="24" fill="#f5c589" stroke="#18324d" stroke-width="2"/><text x="466" y="267" font-size="21" text-anchor="start" fill="#18324d" font-weight="normal">其余部分占70%</text><text x="380" y="390" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">30% + 70% = 100%；人数还需结合总体计算</text></g></svg>
