<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" role="img" aria-labelledby="title desc"><title id="title">圆柱侧面与两底展开</title><desc id="desc">半径2厘米高5厘米的直圆柱，侧面长方形宽为底周长4π厘米、高5厘米，两底均为半径2厘米圆。侧面积20π，两底8π，表面积28π平方厘米，体积20π立方厘米，答案留给学习者计算。</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#172033;text-anchor:middle} .edge{fill:#eff6ff;stroke:#334155;stroke-width:2}</style><text x="410" y="40" font-size="25">封闭直圆柱：半径2厘米，高5厘米</text><rect x="130" y="225" width="427.25660" height="170" class="edge"/><circle cx="343.62830" cy="157" r="68" class="edge"/><circle cx="343.62830" cy="463" r="68" class="edge"/><path d="M343.62830 157h68" stroke="#2563eb" stroke-width="2"/><circle cx="343.62830" cy="157" r="3" fill="#2563eb"/><text x="377.62830" y="147" font-size="20">2 厘米</text><text x="343.62830" y="310.0" font-size="24">侧面长方形</text><text x="343.62830" y="345.0" font-size="21">长＝底面圆周长＝4π 厘米</text><text x="637.25660" y="318.0" font-size="21">高5厘米</text><text x="410" y="627" font-size="21">封闭表面＝侧面＋两个圆底</text><text x="410" y="666" font-size="19">两个圆与长方形只在各自一处相切，表示侧面展开后的组成。</text><text x="410" y="694" font-size="19">可用纸条绕圆底一周核对侧面长；不能把直径当周长。</text></svg>