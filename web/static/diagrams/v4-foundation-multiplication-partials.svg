<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">两位数乘两位数的部分积对位</title><desc id="desc">竖式两部分积92与230按数位对齐，第二行按十位乘，不能写成个位的23。</desc>
<rect width="900" height="470" rx="14" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#17324d">
<text x="30" y="42" font-size="28" fill="#17324d" text-anchor="start" font-weight="bold">23 × 14 = 322：第二部分积是23个十</text><rect x="30" y="70" width="300" height="320" rx="8" fill="#ffffff" stroke="#d1dee8"/><text x="170" y="105" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">百</text><text x="230" y="105" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">十</text><text x="290" y="105" font-size="19" fill="#17324d" text-anchor="middle" font-weight="normal">个</text><text x="230" y="150" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">2</text><text x="290" y="150" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">3</text><text x="110" y="193" font-size="30" fill="#17324d" text-anchor="middle" font-weight="normal">×</text><text x="230" y="193" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">1</text><text x="290" y="193" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">4</text><line x1="95" y1="208" x2="311" y2="208" stroke="#37566b" stroke-width="2"/><text x="230" y="253" font-size="32" fill="#277d94" text-anchor="middle" font-weight="normal">9</text><text x="290" y="253" font-size="32" fill="#277d94" text-anchor="middle" font-weight="normal">2</text><text x="170" y="299" font-size="32" fill="#946014" text-anchor="middle" font-weight="normal">2</text><text x="230" y="299" font-size="32" fill="#946014" text-anchor="middle" font-weight="normal">3</text><text x="290" y="299" font-size="32" fill="#946014" text-anchor="middle" font-weight="normal">0</text><line x1="95" y1="316" x2="311" y2="316" stroke="#37566b" stroke-width="2"/><text x="170" y="365" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">3</text><text x="230" y="365" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">2</text><text x="290" y="365" font-size="32" fill="#17324d" text-anchor="middle" font-weight="normal">2</text><text x="360" y="126" font-size="24" fill="#17324d" text-anchor="start" font-weight="bold">先拆分：14 = 10 + 4</text><text x="360" y="171" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">个位的4表示4个一。</text><text x="360" y="207" font-size="22" fill="#17324d" text-anchor="start" font-weight="normal">十位的1表示1个十，也就是10。</text><text x="360" y="254" font-size="23" fill="#277d94" text-anchor="start" font-weight="normal">第一部分积：23 × 4 = 92</text><text x="360" y="300" font-size="23" fill="#946014" text-anchor="start" font-weight="normal">第二部分积：23 × 10 = 230</text><text x="360" y="355" font-size="23" fill="#17324d" text-anchor="start" font-weight="bold">同数位相加：92 + 230 = 322</text><text x="32" y="434" font-size="23" fill="#17324d" text-anchor="start" font-weight="normal">第二部分积的0占个位：不能把23个十当成23个一。</text>
</g></svg>
