<svg xmlns="http://www.w3.org/2000/svg" width="500" height="390" viewBox="0 0 500 390" role="img" aria-labelledby="title desc"><title id="title">两条一次函数图象</title><desc id="desc">横轴x从负一到五，纵轴y从负二到十二。蓝线y1=2x+1与橙线y2=−x+7相交，可比较同一横坐标的上下位置。横轴每格1，纵轴每格2。</desc><rect width="500" height="390" fill="white"/><g stroke="#e2e8f0" stroke-width="1"><path d="M50 40V340"/><path d="M100 40V340"/><path d="M150 40V340"/><path d="M200 40V340"/><path d="M250 40V340"/><path d="M300 40V340"/><path d="M350 40V340"/><path d="M40 340H380"/><path d="M40 300H380"/><path d="M40 260H380"/><path d="M40 220H380"/><path d="M40 180H380"/><path d="M40 140H380"/><path d="M40 100H380"/><path d="M40 60H380"/></g><g stroke="#334155" stroke-width="2"><path d="M40 300H390m-7 -4 7 4-7 4M100 350V35m-4 7 4-7 4 7"/></g><g fill="#334155" font-family="sans-serif" font-size="14"><text x="50" y="321" text-anchor="middle">-1</text><text x="100" y="321" text-anchor="middle">0</text><text x="150" y="321" text-anchor="middle">1</text><text x="200" y="321" text-anchor="middle">2</text><text x="250" y="321" text-anchor="middle">3</text><text x="300" y="321" text-anchor="middle">4</text><text x="350" y="321" text-anchor="middle">5</text><text x="90" y="345" text-anchor="end">-2</text><text x="90" y="265" text-anchor="end">2</text><text x="90" y="225" text-anchor="end">4</text><text x="90" y="185" text-anchor="end">6</text><text x="90" y="145" text-anchor="end">8</text><text x="90" y="105" text-anchor="end">10</text><text x="90" y="65" text-anchor="end">12</text><text x="398" y="305">x</text><text x="107" y="32">y</text><text x="45" y="378">横轴每格 1；纵轴每格 2</text></g><path d="M50 320L350 80" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M50 140L350 260" fill="none" stroke="#c2410c" stroke-width="3"/><g font-family="sans-serif" font-size="17"><text x="365" y="82" fill="#2563eb">y₁=2x+1</text><text x="365" y="265" fill="#c2410c">y₂=−x+7</text></g></svg>
