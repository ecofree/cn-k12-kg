<svg xmlns="http://www.w3.org/2000/svg" width="670" height="480" viewBox="0 0 670 480" role="img" aria-labelledby="title desc"><title id="title">同均值数据的两行点图</title><desc id="desc">甲4、5、6分钟；乙1、5、9分钟。两组均值5，同一刻度0到10。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:18px}.title{font-size:25px;font-weight:700}.small{font-size:16px}.tick{font-size:17px}.grid{stroke:#d5e0e8;stroke-width:1}.axis{stroke:#37566b;stroke-width:2}.label{font-size:20px;font-weight:600}</style><rect width="100%" height="100%" fill="#f8fbfd" rx="12"/><text x="32" y="42" class="title" text-anchor="start">平均相同，波动可以不同</text><text x="32" y="73" class="small" text-anchor="start">同一调查背景、同一单位：分钟；每个点是一条记录</text><text x="28" y="189" class="label" text-anchor="start">甲组</text><line x1="110" y1="212" x2="610" y2="212" class="axis"/><line x1="110" y1="207" x2="110" y2="217" class="axis"/><text x="110" y="240" class="tick" text-anchor="middle">0</text><line x1="160" y1="207" x2="160" y2="217" class="axis"/><text x="160" y="240" class="tick" text-anchor="middle">1</text><line x1="210" y1="207" x2="210" y2="217" class="axis"/><text x="210" y="240" class="tick" text-anchor="middle">2</text><line x1="260" y1="207" x2="260" y2="217" class="axis"/><text x="260" y="240" class="tick" text-anchor="middle">3</text><line x1="310" y1="207" x2="310" y2="217" class="axis"/><text x="310" y="240" class="tick" text-anchor="middle">4</text><line x1="360" y1="207" x2="360" y2="217" class="axis"/><text x="360" y="240" class="tick" text-anchor="middle">5</text><line x1="410" y1="207" x2="410" y2="217" class="axis"/><text x="410" y="240" class="tick" text-anchor="middle">6</text><line x1="460" y1="207" x2="460" y2="217" class="axis"/><text x="460" y="240" class="tick" text-anchor="middle">7</text><line x1="510" y1="207" x2="510" y2="217" class="axis"/><text x="510" y="240" class="tick" text-anchor="middle">8</text><line x1="560" y1="207" x2="560" y2="217" class="axis"/><text x="560" y="240" class="tick" text-anchor="middle">9</text><line x1="610" y1="207" x2="610" y2="217" class="axis"/><text x="610" y="240" class="tick" text-anchor="middle">10</text><line x1="360" y1="132" x2="360" y2="205" stroke="#c16c24" stroke-width="2" stroke-dasharray="6 5"/><circle cx="310" cy="182" r="9" fill="#277d94"/><text x="310" y="164" class="label" text-anchor="middle">4</text><circle cx="360" cy="182" r="9" fill="#277d94"/><text x="360" y="164" class="label" text-anchor="middle">5</text><circle cx="410" cy="182" r="9" fill="#277d94"/><text x="410" y="164" class="label" text-anchor="middle">6</text><text x="28" y="317" class="label" text-anchor="start">乙组</text><line x1="110" y1="340" x2="610" y2="340" class="axis"/><line x1="110" y1="335" x2="110" y2="345" class="axis"/><text x="110" y="368" class="tick" text-anchor="middle">0</text><line x1="160" y1="335" x2="160" y2="345" class="axis"/><text x="160" y="368" class="tick" text-anchor="middle">1</text><line x1="210" y1="335" x2="210" y2="345" class="axis"/><text x="210" y="368" class="tick" text-anchor="middle">2</text><line x1="260" y1="335" x2="260" y2="345" class="axis"/><text x="260" y="368" class="tick" text-anchor="middle">3</text><line x1="310" y1="335" x2="310" y2="345" class="axis"/><text x="310" y="368" class="tick" text-anchor="middle">4</text><line x1="360" y1="335" x2="360" y2="345" class="axis"/><text x="360" y="368" class="tick" text-anchor="middle">5</text><line x1="410" y1="335" x2="410" y2="345" class="axis"/><text x="410" y="368" class="tick" text-anchor="middle">6</text><line x1="460" y1="335" x2="460" y2="345" class="axis"/><text x="460" y="368" class="tick" text-anchor="middle">7</text><line x1="510" y1="335" x2="510" y2="345" class="axis"/><text x="510" y="368" class="tick" text-anchor="middle">8</text><line x1="560" y1="335" x2="560" y2="345" class="axis"/><text x="560" y="368" class="tick" text-anchor="middle">9</text><line x1="610" y1="335" x2="610" y2="345" class="axis"/><text x="610" y="368" class="tick" text-anchor="middle">10</text><line x1="360" y1="260" x2="360" y2="333" stroke="#c16c24" stroke-width="2" stroke-dasharray="6 5"/><circle cx="160" cy="310" r="9" fill="#805da6"/><text x="160" y="292" class="label" text-anchor="middle">1</text><circle cx="360" cy="310" r="9" fill="#805da6"/><text x="360" y="292" class="label" text-anchor="middle">5</text><circle cx="560" cy="310" r="9" fill="#805da6"/><text x="560" y="292" class="label" text-anchor="middle">9</text><text x="110" y="120" class="small" text-anchor="start">甲：4、5、6　　乙：1、5、9</text><text x="32" y="425" class="small" text-anchor="start">两组平均数都为 5 分钟。橙色虚线标出平均数。</text><text x="32" y="453" class="small" text-anchor="start">方差看全部平方离差；平均相同不表示分布相同。</text></svg>
