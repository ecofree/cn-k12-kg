<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" role="img" aria-labelledby="title desc">
<title id="title">一次函数的对应值表</title><desc id="desc">上行为x：0、2、5；下行对应y：1、5、11。横向各列为一组输入输出，表中没有给出函数式。</desc>
<style>text{font-family:Arial,sans-serif;font-size:22px;fill:#172b4d}.edge{stroke:#243746;stroke-width:2.5;fill:none}.light{stroke:#778899;stroke-width:2;fill:none;stroke-dasharray:6 5}.unit{stroke:#243746;stroke-width:2;fill:#dceafa}</style>
<rect width="540" height="200" fill="white"/>
<rect x="40" y="35" width="115" height="65" fill="#e1edf7" stroke="#243746" stroke-width="2"/>
<text x="97.5" y="76" text-anchor="middle">x</text>
<rect x="155" y="35" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="212.5" y="76" text-anchor="middle">0</text>
<rect x="270" y="35" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="327.5" y="76" text-anchor="middle">2</text>
<rect x="385" y="35" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="442.5" y="76" text-anchor="middle">5</text>
<rect x="40" y="100" width="115" height="65" fill="#e1edf7" stroke="#243746" stroke-width="2"/>
<text x="97.5" y="141" text-anchor="middle">y</text>
<rect x="155" y="100" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="212.5" y="141" text-anchor="middle">1</text>
<rect x="270" y="100" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="327.5" y="141" text-anchor="middle">5</text>
<rect x="385" y="100" width="115" height="65" fill="white" stroke="#243746" stroke-width="2"/>
<text x="442.5" y="141" text-anchor="middle">11</text>
</svg>
