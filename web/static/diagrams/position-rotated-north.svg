<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">北向不朝上的地图</title><desc id="desc">北箭头指向页面右侧，图书馆L在学校S的页面正上方，题目要求按北箭头判断地理方向。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="380" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="38" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">先读北向箭头，再判断方向</text><line x1="510" y1="95" x2="675" y2="95" stroke="#18324d" stroke-width="3"/><line x1="675" y1="95" x2="658" y2="87" stroke="#18324d" stroke-width="3"/><line x1="675" y1="95" x2="658" y2="103" stroke="#18324d" stroke-width="3"/><text x="588" y="77" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">北</text><line x1="310" y1="145" x2="310" y2="310" stroke="#90a9bc" stroke-width="2" stroke-dasharray="6 5"/><circle cx="310" cy="145" r="9" fill="#19769b"/><circle cx="310" cy="310" r="9" fill="#c65b19"/><text x="340" y="150" font-size="23" text-anchor="start" fill="#18324d" font-weight="normal">L 图书馆</text><text x="340" y="315" font-size="23" text-anchor="start" fill="#18324d" font-weight="normal">S 学校</text></g></svg>
