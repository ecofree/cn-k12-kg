<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">数量与总价的对应记录</title><desc id="desc">数量x（千克）、2、5、7；总价y（元）、6、15、21</desc><rect width="760" height="276" fill="#fff"/><g font-family="sans-serif" fill="#17334f" text-anchor="middle"><text x="380" y="36" font-size="24">数量与总价的对应记录</text><rect x="65" y="65" width="210" height="58" fill="#edf4fb" stroke="#819eb5"/><text x="170" y="102" font-size="21">数量x（千克）</text><rect x="275" y="65" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="345" y="102" font-size="21">2</text><rect x="415" y="65" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="485" y="102" font-size="21">5</text><rect x="555" y="65" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="625" y="102" font-size="21">7</text><rect x="65" y="123" width="210" height="58" fill="#edf4fb" stroke="#819eb5"/><text x="170" y="160" font-size="21">总价y（元）</text><rect x="275" y="123" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="345" y="160" font-size="21">6</text><rect x="415" y="123" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="485" y="160" font-size="21">15</text><rect x="555" y="123" width="140" height="58" fill="#fff" stroke="#819eb5"/><text x="625" y="160" font-size="21">21</text><text x="380" y="252" font-size="19">题设保证单价固定，没有其他收费。</text></g></svg>
