<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" role="img" aria-labelledby="title desc"><title id="title">每格五人的条形统计图</title><desc id="desc">纵轴以人计，从0到35，每格5人；A班条高25人，B班条高30人，不在条顶另外印出答案。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="465" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">按纵轴刻度读取直条高度</text><line x1="160" y1="350" x2="640" y2="350" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="355" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">0</text><line x1="160" y1="315" x2="640" y2="315" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="320" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">5</text><line x1="160" y1="280" x2="640" y2="280" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="285" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">10</text><line x1="160" y1="245" x2="640" y2="245" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="250" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">15</text><line x1="160" y1="210" x2="640" y2="210" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="215" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">20</text><line x1="160" y1="175" x2="640" y2="175" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="180" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">25</text><line x1="160" y1="140" x2="640" y2="140" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="145" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">30</text><line x1="160" y1="105" x2="640" y2="105" stroke="#dbe5ec" stroke-width="1"/><text x="146" y="110" font-size="16" text-anchor="end" fill="#18324d" font-weight="normal">35</text><line x1="160" y1="350" x2="160" y2="85" stroke="#18324d" stroke-width="2"/><line x1="160" y1="350" x2="655" y2="350" stroke="#18324d" stroke-width="2"/><text x="147" y="70" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">人数（人）</text><rect x="250" y="175" width="80" height="175" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><text x="290" y="386" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">A班</text><rect x="460" y="140" width="80" height="210" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><text x="500" y="386" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">B班</text><text x="380" y="434" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">纵轴从0开始，每个相邻刻度相差5人</text></g></svg>
