<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 255" role="img" aria-labelledby="title desc"><title id="title">等长分数条的三分之二与六分之四</title><desc id="desc">两条360单位长的条，涂色长度都是240；上条等分3份涂2份，下条等分6份涂4份。整体和涂色边界不变。</desc><rect width="610" height="255" fill="#fff"/><g font-family="sans-serif" fill="#243449"><text x="30" y="30" font-size="18">同一整体：只细分，不改变涂色边界</text><rect x="70" y="65" width="120" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="190" y="65" width="120" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="310" y="65" width="120" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><text x="450" y="92" font-size="18">2/3</text><rect x="70" y="145" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="130" y="145" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="190" y="145" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="250" y="145" width="60" height="42" fill="#82bdd0" stroke="#40546a" stroke-width="1.5"/><rect x="310" y="145" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><rect x="370" y="145" width="60" height="42" fill="#fff" stroke="#40546a" stroke-width="1.5"/><text x="450" y="172" font-size="18">4/6</text><text x="30" y="225" font-size="16">每个三分之一再平分为2份：总份数和涂色份数同乘2。</text></g></svg>
