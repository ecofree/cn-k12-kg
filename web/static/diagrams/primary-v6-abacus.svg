<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d"><title id="t">四档算盘的数位和靠梁珠</title><desc id="d">每档一颗上珠计该档五个单位，每颗下珠计一个单位，只有靠梁的珠算数。千位0上3下靠梁，百位没有靠梁珠，十位1上0下靠梁，个位1上2下靠梁。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:20px} </style><rect width="760" height="440" fill="white"/><text x="380" y="36" text-anchor="middle" font-size="25">先认数位，再读靠梁的珠</text><rect x="120" y="75" width="460" height="300" rx="10" fill="#fcf5e9" stroke="#18324a" stroke-width="4"/><path d="M120 170H580" stroke="#8a4b12" stroke-width="10"/><path d="M185 90V360" stroke="#6f7780" stroke-width="3"/><text x="185" y="410" text-anchor="middle">千位</text><ellipse cx="185" cy="105" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="185" cy="195" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="185" cy="223" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="185" cy="251" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="185" cy="350" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><path d="M295 90V360" stroke="#6f7780" stroke-width="3"/><text x="295" y="410" text-anchor="middle">百位</text><ellipse cx="295" cy="105" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="295" cy="266" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="295" cy="294" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="295" cy="322" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="295" cy="350" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><path d="M405 90V360" stroke="#6f7780" stroke-width="3"/><text x="405" y="410" text-anchor="middle">十位</text><ellipse cx="405" cy="145" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="405" cy="266" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="405" cy="294" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="405" cy="322" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="405" cy="350" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><path d="M515 90V360" stroke="#6f7780" stroke-width="3"/><text x="515" y="410" text-anchor="middle">个位</text><ellipse cx="515" cy="145" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="515" cy="195" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="515" cy="223" rx="34" ry="12" fill="#377cb5" stroke="#18324a" stroke-width="2"/><ellipse cx="515" cy="322" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><ellipse cx="515" cy="350" rx="34" ry="12" fill="#e0e5e9" stroke="#18324a" stroke-width="2"/><text x="610" y="170">梁</text><text x="610" y="215" font-size="17">靠梁才计数</text><text x="610" y="250" font-size="17">上珠：5个单位</text><text x="610" y="280" font-size="17">下珠：1个单位</text></svg>
