<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">待实际测量的两个角</title>
  <desc id="desc">左图I是甲角AOB，右图II是乙角CPD。两图均有向右的基准射线，未标注角度答案。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16324f" stroke-width="1.5"/></marker></defs>
  <rect width="760" height="320" fill="#fff"/>
  <g fill="#16324f" font-family="sans-serif" font-size="23">
    <text x="80" y="48">I: AOB</text><text x="490" y="48">II: CPD</text>
    <text x="68" y="268">O</text><text x="305" y="249">A</text><text x="263" y="116">B</text>
    <text x="470" y="268">P</text><text x="706" y="249">C</text><text x="352" y="73">D</text>
  </g>
  <g fill="none" stroke="#16324f" stroke-width="2.5" marker-end="url(#arrow)">
    <path id="ray-oa" d="M 90 240 L 290 240"/>
    <path id="ray-ob" d="M 90 240 L 253.830409 125.284713"/>
    <path id="ray-pc" d="M 490 240 L 690 240"/>
    <path id="ray-pd" d="M 490 240 L 375.284713 76.169591"/>
  </g>
  <g fill="#16324f"><circle cx="90" cy="240" r="3.5"/><circle cx="490" cy="240" r="3.5"/></g>
</svg>
