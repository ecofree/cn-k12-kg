<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">两张与四张正方形的拼组</title><desc id="desc">图甲为两个同样小正方形左右并排，图乙为四个同样小正方形排成两行两列。各片沿完整边相接，无重叠无缝隙，内部接缝可见。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="800" height="390" fill="#fff"/><text x="390" y="38" text-anchor="middle" class="title">用相同的小正方形拼组</text><text x="200" y="90" text-anchor="middle" class="">图甲：两张并排</text><text x="580" y="90" text-anchor="middle" class="">图乙：两行，每行两张</text><rect x="100" y="160" width="100" height="100" fill="#d8edfa" class="shape"/><rect x="200" y="160" width="100" height="100" fill="#d8edfa" class="shape"/><rect x="480" y="110" width="100" height="100" fill="#d8edfa" class="shape"/><rect x="580" y="110" width="100" height="100" fill="#d8edfa" class="shape"/><rect x="480" y="210" width="100" height="100" fill="#d8edfa" class="shape"/><rect x="580" y="210" width="100" height="100" fill="#d8edfa" class="shape"/><text x="390" y="355" text-anchor="middle" class="label">相邻纸片沿完整边相接，内部不重叠；接缝不算外轮廓的边。</text></svg>
