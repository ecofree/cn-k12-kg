<svg xmlns="http://www.w3.org/2000/svg" width="640" height="575" viewBox="0 0 640 575" role="img" aria-labelledby="title desc"><title id="title">正面相同的两个候选模型</title><desc id="desc">候选甲是一排三个小正方体，候选乙是前后两排、每排三个小正方体，均只有一层。箭头标明从前方观察的方向。上方给出两者正面共有的三格宽一格高轮廓。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f" stroke-linejoin="round"><text x="320.0" y="36" text-anchor="middle" font-size="24">正面相同的两个候选模型</text><rect x="251" y="75" width="46" height="46" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="297" y="75" width="46" height="46" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="343" y="75" width="46" height="46" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="320" y="150" text-anchor="middle" font-size="20">已知正面轮廓</text><polygon points="125,304 221,352 221,314 125,266" fill="#96bdd9" stroke="#16324f" stroke-width="2"/><polygon points="253,336 221,352 221,314 253,298" fill="#6f9cbf" stroke="#16324f" stroke-width="2"/><polygon points="157,250 253,298 221,314 125,266" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><path d="M189 266L157 282" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M157 320L157 282" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M221 282L189 298" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M189 336L189 298" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M125.0 352.0L161.0 334.0" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M161.0 334.0L149.0 335.0" fill="none" stroke="#16324f" stroke-width="1.6"/><path d="M161.0 334.0L155.0 344.0" fill="none" stroke="#16324f" stroke-width="1.6"/><text x="117.0" y="376.0" text-anchor="middle" font-size="17">前方</text><polygon points="381,320 477,368 477,330 381,282" fill="#96bdd9" stroke="#16324f" stroke-width="2"/><polygon points="541,336 477,368 477,330 541,298" fill="#6f9cbf" stroke="#16324f" stroke-width="2"/><polygon points="445,250 541,298 477,330 381,282" fill