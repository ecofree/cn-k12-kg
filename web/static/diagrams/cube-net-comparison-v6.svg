<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title"><title id="title">两种由六个全等正方形组成的图：甲十字扩展形，乙六格直条</title><rect width="900" height="320" fill="#fff"/><g font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="23" fill="#152e45" text-anchor="middle"><text x="220" y="36">甲：四格横排，第二格上下各添一格</text><text x="663" y="36">乙：六格直排</text><rect x="95" y="123" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="123" y="159">B</text><rect x="151" y="123" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="179" y="159">A</text><rect x="207" y="123" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="235" y="159">C</text><rect x="263" y="123" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="291" y="159">D</text><rect x="151" y="67" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="179" y="103">E</text><rect x="151" y="179" width="56" height="56" fill="#e5f2fb" stroke="#284f70" stroke-width="2"/><text x="179" y="215">F</text><rect x="478" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="506" y="159">1</text><rect x="534" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="562" y="159">2</text><rect x="590" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="618" y="159">3</text><rect x="646" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="674" y="159">4</text><rect x="702" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="730" y="159">5</text><rect x="758" y="123" width="56" height="56" fill="#f6ead8" stroke="#785129" stroke-width="2"/><text x="786" y="159">6</text><text x="450" y="284" font-size="20">每个小正方形全等；沿相邻公共边折叠，不能剪开后重新拼接。</text></g></svg>
