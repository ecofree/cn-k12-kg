<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">四等分单位的数轴</title><desc id="desc">数轴标0、1、2；每个单位分成4等份，点P在1右侧第一个刻度。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="290" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="40" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">读取点 P 的数值</text><line x1="90" y1="155" x2="670" y2="155" stroke="#18324d" stroke-width="2"/><line x1="90.0" y1="144" x2="90.0" y2="166" stroke="#18324d" stroke-width="2"/><text x="90.0" y="202" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="162.5" y1="144" x2="162.5" y2="166" stroke="#18324d" stroke-width="2"/><line x1="235.0" y1="144" x2="235.0" y2="166" stroke="#18324d" stroke-width="2"/><line x1="307.5" y1="144" x2="307.5" y2="166" stroke="#18324d" stroke-width="2"/><line x1="380.0" y1="144" x2="380.0" y2="166" stroke="#18324d" stroke-width="2"/><text x="380.0" y="202" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="452.5" y1="144" x2="452.5" y2="166" stroke="#18324d" stroke-width="2"/><line x1="525.0" y1="144" x2="525.0" y2="166" stroke="#18324d" stroke-width="2"/><line x1="597.5" y1="144" x2="597.5" y2="166" stroke="#18324d" stroke-width="2"/><line x1="670.0" y1="144" x2="670.0" y2="166" stroke="#18324d" stroke-width="2"/><text x="670.0" y="202" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><circle cx="452.5" cy="155" r="5" fill="#c65b19"/><text x="452.5" y="125" font-size="24" text-anchor="middle" fill="#18324d" font-weight="normal">P</text><text x="380" y="253" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">相邻整数之间有 4 个相等间隔</text></g></svg>
