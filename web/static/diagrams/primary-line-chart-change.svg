<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">一月至三月的折线图</title><desc id="desc">1月5摄氏度，2月8摄氏度，3月12摄氏度；横轴按月等距，纵轴为摄氏度，每格2度，依次连线，不给出两段差值。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="460" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">按时间顺序连点，读取数量与变化</text><line x1="150" y1="340" x2="650" y2="340" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="346" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">0</text><line x1="150" y1="310" x2="650" y2="310" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="316" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">2</text><line x1="150" y1="280" x2="650" y2="280" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="286" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">4</text><line x1="150" y1="250" x2="650" y2="250" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="256" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">6</text><line x1="150" y1="220" x2="650" y2="220" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="226" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">8</text><line x1="150" y1="190" x2="650" y2="190" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="196" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">10</text><line x1="150" y1="160" x2="650" y2="160" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="166" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">12</text><line x1="150" y1="130" x2="650" y2="130" stroke="#dbe5ec" stroke-width="1"/><text x="135" y="136" font-size="17" text-anchor="end" fill="#18324d" font-weight="normal">14</text><line x1="150" y1="340" x2="150" y2="100" stroke="#18324d" stroke-width="2"/><line x1="150" y1="340" x2="670" y2="340" stroke="#18324d" stroke-width="2"/><text x="142" y="82" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">气温（℃）</text><line x1="230" y1="265" x2="410" y2="220" stroke="#19769b" stroke-width="3"/><line x1="410" y1="220" x2="590" y2="160" stroke="#19769b" stroke-width="3"/><circle cx="230" cy="265" r="6" fill="#c65b19"/><text x="230" y="250" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">5℃</text><text x="230" y="378" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">1月</text><circle cx="410" cy="220" r="6" fill="#c65b19"/><text x="410" y="205" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">8℃</text><text x="410" y="378" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">2月</text><circle cx="590" cy="160" r="6" fill="#c65b19"/><text x="590" y="145" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">12℃</text><text x="590" y="378" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">3月</text><text x="380" y="428" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">先核对横纵轴单位，再比较相邻月份的增减幅度</text></g></svg>
