<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">原图与斜二测直观图对照</title><desc id="desc">左为沿x长6、沿y宽4的水平矩形；右沿x′长6、沿45度y′长2，保持平行关系而不保持直角。</desc><rect width="960" height="420" rx="16" fill="#f5f8fc"/><g font-family="sans-serif" fill="#243746"><text x="225" y="38" font-size="24" text-anchor="middle" fill="#243746">原图：水平矩形</text><text x="700" y="38" font-size="24" text-anchor="middle" fill="#243746">45°斜二测直观图</text><path d="M70.000 250.000 L310.000 250.000 L310.000 90.000 L70.000 90.000 Z" fill="#dceff2" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="270" x2="70" y2="55" stroke="#344e68" stroke-width="2.5" /><line x1="45" y1="250" x2="365" y2="250" stroke="#344e68" stroke-width="2.5" /><text x="58" y="278" font-size="20" text-anchor="start" fill="#243746">O</text><text x="365" y="276" font-size="20" text-anchor="start" fill="#243746">x</text><text x="46" y="60" font-size="20" text-anchor="start" fill="#243746">y</text><text x="190" y="280" font-size="21" text-anchor="middle" fill="#243746">6</text><text x="40" y="175" font-size="21" text-anchor="middle" fill="#243746">4</text><path d="M565.000 250.000 L805.000 250.000 L861.569 193.431 L621.569 193.431 Z" fill="#dceff2" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><line x1="540" y1="250" x2="910" y2="250" stroke="#344e68" stroke-width="2.5" /><line x1="565" y1="250" x2="658.3380951166242" y2="156.6619048833757" stroke="#344e68" stroke-width="2.5" /><text x="550" y="278" font-size="20" text-anchor="start" fill="#243746">O′</text><text x="911" y="276" font-size="20" text-anchor="start" fill="#243746">x′</text><text x="662" y="149" font-size="20" text-anchor="start" fill="#243746">y′</text><text x="687" y="279" font-size="21" text-anchor="middle" fill="#243746">6</text><text x="581" y="206" font-size="21" text-anchor="middle" fill="#243746">2</text><path d="M605 250 A40 40 0 0 0 593.284 221.716" fill="none" stroke="#ce7130" stroke-width="2"/><text x="612" y="236" font-size="19" text-anchor="start" fill="#243746">45°</text><text x="465" y="315" font-size="22" text-anchor="middle" fill="#243746">x 向：6 → 6；y 向：4 → 2；原来的直角在图上不是直角。</text><text x="465" y="355" font-size="21" text-anchor="middle" fill="#243746">“y 向减半”不是“所有竖直线都减半”；空间 z 向长度保持。</text><text x="465" y="390" font-size="19" text-anchor="middle" fill="#243746">任意斜边先变换两个端点，再连线；不要直接把整条斜边减半。</text></g></svg>
