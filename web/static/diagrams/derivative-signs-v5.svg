<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-labelledby="title"><title id="title">导数符号与原函数变化分别写一行</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;fill:#172b4d}.title{font-size:23px;font-weight:700}.small{font-size:15px}.axis{stroke:#34445b;stroke-width:2}.grid{stroke:#dce4ee;stroke-width:1}.curve{stroke:#147d92;stroke-width:4;fill:none}.mark{fill:#147d92}.note{fill:#45556b}</style><text class="title" x="30" y="35">导数符号与原函数变化分别写一行</text><text x="30" y="78">f(x)=x³−3x；f′(x)=3(x−1)(x+1)</text><path d="M30 96 H630" stroke="#bac7d6"/><path d="M30 157 H630" stroke="#bac7d6"/><path d="M30 220 H630" stroke="#bac7d6"/><path d="M30 282 H630" stroke="#bac7d6"/><path d="M140 96 V282" stroke="#bac7d6"/><path d="M290 96 V282" stroke="#bac7d6"/><path d="M450 96 V282" stroke="#bac7d6"/><text x="40" y="133">x的区间</text><text x="158" y="133">(−∞,−1)</text><text x="310" y="133">(−1,1)</text><text x="470" y="133">(1,+∞)</text><text x="40" y="195">f′符号</text><text x="158" y="195">+</text><text x="310" y="195">−</text><text x="470" y="195">+</text><text x="40" y="257">f的变化</text><text x="158" y="257">递增 ↗</text><text x="310" y="257">递减 ↘</text><text x="470" y="257">递增 ↗</text><text class="small note" x="30" y="325">−1和1是导数零点；分析的是三个分别连续的区间。</text><text class="small note" x="30" y="358">两个分离的递增区间不能直接合成“整体递增”的集合。</text></svg>