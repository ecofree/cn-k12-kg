<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-labelledby="title"><title id="title">在同一等可能样本空间内检验独立性</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;fill:#172b4d}.title{font-size:23px;font-weight:700}.small{font-size:15px}.axis{stroke:#34445b;stroke-width:2}.grid{stroke:#dce4ee;stroke-width:1}.curve{stroke:#147d92;stroke-width:4;fill:none}.mark{fill:#147d92}.note{fill:#45556b}</style><text class="title" x="30" y="35">在同一等可能样本空间内检验独立性</text><text x="30" y="78">一次公平六面骰；A：偶数；B：大于4</text><rect x="31" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="74" y="140" text-anchor="middle">点数</text><rect x="117" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="160" y="140" text-anchor="middle">1</text><rect x="203" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="246" y="140" text-anchor="middle">2</text><rect x="289" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="332" y="140" text-anchor="middle">3</text><rect x="375" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="418" y="140" text-anchor="middle">4</text><rect x="461" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="504" y="140" text-anchor="middle">5</text><rect x="547" y="104" width="86" height="56" fill="#eef4f8" stroke="#bac7d6"/><text x="590" y="140" text-anchor="middle">6</text><rect x="31" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="74" y="196" text-anchor="middle">属于A</text><rect x="117" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="160" y="196" text-anchor="middle">否</text><rect x="203" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="246" y="196" text-anchor="middle">是</text><rect x="289" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="332" y="196" text-anchor="middle">否</text><rect x="375" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="418" y="196" text-anchor="middle">是</text><rect x="461" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="504" y="196" text-anchor="middle">否</text><rect x="547" y="160" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="590" y="196" text-anchor="middle">是</text><rect x="31" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="74" y="252" text-anchor="middle">属于B</text><rect x="117" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="160" y="252" text-anchor="middle">否</text><rect x="203" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="246" y="252" text-anchor="middle">否</text><rect x="289" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="332" y="252" text-anchor="middle">否</text><rect x="375" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="418" y="252" text-anchor="middle">否</text><rect x="461" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="504" y="252" text-anchor="middle">是</text><rect x="547" y="216" width="86" height="56" fill="#fff" stroke="#bac7d6"/><text x="590" y="252" text-anchor="middle">是</text><text class="small note" x="30" y="317">先找A、B和交集中的结果，再比较交概率与边际概率乘积。</text><text class="small note" x="30" y="351">“同一次实验”或“不同条件”本身都不能决定是否独立。</text></svg>