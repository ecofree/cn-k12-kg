<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
  <title id="title">在共同刻度上补画乙组直条</title>
  <desc id="desc">纵轴人数从0到16，每小格2人。A为甲组8人，B为乙组且留空，C为丙组6人。需要学习者补画的乙组未画直条。</desc>
  <rect width="700" height="430" fill="#fff"/>
  <g stroke="#d7e1eb" stroke-width="1">
    <path d="M 95 65 H 620 M 95 100 H 620 M 95 135 H 620 M 95 170 H 620 M 95 205 H 620 M 95 240 H 620 M 95 275 H 620 M 95 310 H 620"/>
  </g>
  <g fill="#ddeaf5" stroke="#16324f" stroke-width="2">
    <rect id="bar-a" x="160" y="205" width="80" height="140"/>
    <rect id="bar-c" x="480" y="240" width="80" height="105"/>
  </g>
  <path d="M 95 57 V 345 H 628" fill="none" stroke="#16324f" stroke-width="2"/>
  <g stroke="#16324f" stroke-width="1.5"><path d="M 89 65 H 95 M 89 100 H 95 M 89 135 H 95 M 89 170 H 95 M 89 205 H 95 M 89 240 H 95 M 89 275 H 95 M 89 310 H 95 M 89 345 H 95"/></g>
  <g font-family="sans-serif" fill="#16324f" font-size="19" text-anchor="end">
    <text x="80" y="72">16</text><text x="80" y="107">14</text><text x="80" y="142">12</text><text x="80" y="177">10</text>
    <text x="80" y="212">8</text><text x="80" y="247">6</text><text x="80" y="282">4</text><text x="80" y="317">2</text><text x="80" y="352">0</text>
  </g>
  <g font-family="sans-serif" fill="#16324f" font-size="22" text-anchor="middle">
    <text x="200" y="378">A</text><text x="360" y="378">B</text><text x="520" y="378">C</text>
    <text x="200" y="194">8</text><text x="520" y="229">6</text>
  </g>
  <g font-family="sans-serif" fill="#16324f" font-size="19"><text x="67" y="35">people</text><text x="217" y="414">1 step = 2 people</text></g>
</svg>
