<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">棱柱、棱锥、棱台中的高</title><desc id="desc">三个立体均画有垂直于底面的蓝色高。棱锥另画橙色侧面高l。棱台由同一棱锥的平行截面截得。</desc>
<rect width="960" height="390" rx="16" fill="#f5f8fc"/>
<g font-family="sans-serif" font-size="24" fill="#243746" text-anchor="middle"><text x="155" y="40">棱柱</text><text x="475" y="40">棱锥</text><text x="795" y="40">棱台</text></g>
<g stroke="#344e68" stroke-width="2.5" stroke-linejoin="round">
<path d="M65 255 L210 255 L260 205 L115 205 Z" fill="#e4edf5"/>
<path d="M65 120 L210 120 L260 70 L115 70 Z" fill="#d3e8f1"/>
<path d="M65 120 L65 255 M210 120 L210 255 M260 70 L260 205" fill="none"/>
<path d="M115 70 L115 205" stroke-dasharray="6 5" fill="none"/>
<path d="M375 255 L520 255 L570 205 L425 205 Z" fill="#e4edf5"/>
<path d="M475 70 L375 255 M475 70 L520 255 M475 70 L570 205" fill="none"/>
<path d="M475 70 L425 205" stroke-dasharray="6 5" fill="none"/>
<path d="M695 255 L840 255 L890 205 L745 205 Z" fill="#e4edf5"/>
<path d="M735 150 L808 150 L833 125 L760 125 Z" fill="#d3e8f1"/>
<path d="M735 150 L695 255 M808 150 L840 255 M833 125 L890 205" fill="none"/>
<path d="M760 125 L745 205" stroke-dasharray="6 5" fill="none"/>
</g>
<g stroke="#177aa1" stroke-width="3" stroke-dasharray="7 5" fill="none"><path d="M165 95 L165 230"/><path d="M475 70 L475 230"/><path d="M785 138 L785 230"/></g>
<g stroke="#177aa1" stroke-width="2" fill="none"><path d="M165 219 L176 219 L176 230"/><path d="M475 219 L486 219 L486 230"/><path d="M785 219 L796 219 L796 230"/></g>
<path d="M475 70 L448 255" stroke="#ce7130" stroke-width="3" fill="none"/>
<g font-family="sans-serif" font-size="23" fill="#177aa1"><text x="178" y="172">h</text><text x="488" y="164">h</text><text x="798" y="198">h</text></g>
<text x="442" y="164" font-family="sans-serif" font-size="23" fill="#b15c20">l</text>
<g font-family="sans-serif" font-size="20" fill="#243746" text-anchor="middle"><text x="155" y="302">V = Sh</text><text x="475" y="302">V = Sh / 3</text><text x="795" y="302">上下底平行、相似</text><text x="480" y="351">蓝色 h 用于体积；橙色 l 用于一个三角形侧面的面积。</text></g>
</svg>
