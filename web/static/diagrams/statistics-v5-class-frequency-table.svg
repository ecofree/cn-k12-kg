<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">本班人数统计表</title>
<desc id="desc">统计表单位为人：男生12人，女生13人。已覆盖全班且每人只计一次，总人数留待计算。</desc>
<rect width="840" height="430" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">本班人数统计表</text>
<line x1="170" y1="110" x2="670" y2="110" stroke="#97afc2" stroke-width="2" /><line x1="170" y1="180" x2="670" y2="180" stroke="#97afc2" stroke-width="2" /><line x1="170" y1="250" x2="670" y2="250" stroke="#97afc2" stroke-width="2" /><line x1="170" y1="320" x2="670" y2="320" stroke="#97afc2" stroke-width="2" /><line x1="170" y1="110" x2="170" y2="320" stroke="#97afc2" stroke-width="2" /><line x1="430" y1="110" x2="430" y2="320" stroke="#97afc2" stroke-width="2" /><line x1="670" y1="110" x2="670" y2="320" stroke="#97afc2" stroke-width="2" /><text x="300" y="155" font-size="23" text-anchor="middle">类别</text><text x="550" y="155" font-size="23" text-anchor="middle">人数（人）</text><text x="300" y="225" font-size="23" text-anchor="middle">男生</text><text x="550" y="225" font-size="23" text-anchor="middle">12</text><text x="300" y="295" font-size="23" text-anchor="middle">女生</text><text x="550" y="295" font-size="23" text-anchor="middle">13</text><text x="420" y="390" font-size="18" text-anchor="middle">本班调查已覆盖所有学生，每人只计入一类。请补总人数。</text>
</g></svg>
