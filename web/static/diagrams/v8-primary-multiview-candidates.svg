<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title desc"><title id="title">三方向轮廓与两个候选模型</title><desc id="desc">上方依次给出正视、右视、俯视的轮廓，均为完整的两行两列单位方格。下方是四个底面位置的柱高：甲两行均为2、2；乙后排2、1，前排1、2。柱内无空洞，所有底面格均被占用。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f" stroke-linejoin="round"><text x="320.0" y="36" text-anchor="middle" font-size="24">三方向轮廓与两个候选模型</text><rect x="80" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="116" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="80" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="116" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="116" y="190" text-anchor="middle" font-size="20">正视</text><rect x="280" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="316" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="280" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="316" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="316" y="190" text-anchor="middle" font-size="20">右视</text><rect x="480" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="516" y="83" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="480" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="516" y="119" width="36" height="36" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="516" y="190" text-anchor="middle" font-size="20">俯视</text><text x="320" y="244" text-anchor="middle" font-size="19">候选模型：每格的数表示该位置的柱高</text><text x="204" y="286" text-anchor="middle" font-size="24">甲</text><rect x="156" y="306" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="180.0" y="337.0" text-anchor="middle" font-size="22">2</text><rect x="204" y="306" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="228.0" y="337.0" text-anchor="middle" font-size="22">2</text><rect x="156" y="354" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="180.0" y="385.0" text-anchor="middle" font-size="22">2</text><rect x="204" y="354" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="228.0" y="385.0" text-anchor="middle" font-size="22">2</text><text x="204" y="430" text-anchor="middle" font-size="16">前排在下，后排在上</text><text x="444" y="286" text-anchor="middle" font-size="24">乙</text><rect x="396" y="306" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="420.0" y="337.0" text-anchor="middle" font-size="22">2</text><rect x="444" y="306" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="468.0" y="337.0" text-anchor="middle" font-size="22">1</text><rect x="396" y="354" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="420.0" y="385.0" text-anchor="middle" font-size="22">1</text><rect x="444" y="354" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="468.0" y="385.0" text-anchor="middle" font-size="22">2</text><text x="444" y="430" text-anchor="middle" font-size="16">前排在下，后排在上</text><text x="320" y="487" text-anchor="middle" font-size="18">上方只画遮挡后的外轮廓。</text><text x="320" y="520" text-anchor="middle" font-size="18">每柱从底面连续堆叠，没有悬空方块。</text></g></svg>
