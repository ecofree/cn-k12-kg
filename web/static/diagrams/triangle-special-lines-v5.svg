<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">高中线角平分线及外部高</title><desc id="desc">三个同样的三角形分别标垂直的高、对边中点上的中线、等分顶角的角平分线。下图钝角三角形的高落在对边延长线上。</desc><rect width="960" height="560" rx="16" fill="#f5f8fc"/><g font-family="sans-serif" fill="#243746"><text x="480" y="36" font-size="24" text-anchor="middle" fill="#243746">三种线段看不同条件；不能互相代替</text><text x="165" y="69" font-size="22" text-anchor="middle" fill="#243746">高：垂直</text><path d="M105.000 92.000 L35.000 270.000 L295.000 270.000 Z" fill="#e6f0f7" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><text x="92" y="85" font-size="18" text-anchor="start" fill="#243746">A</text><text x="19" y="293" font-size="18" text-anchor="start" fill="#243746">B</text><text x="297" y="293" font-size="18" text-anchor="start" fill="#243746">C</text><line x1="105" y1="92" x2="105" y2="270" stroke="#177aa1" stroke-width="3" /><path d="M105.000 258.000 L117.000 258.000 L117.000 270.000" fill="none" stroke="#177aa1" stroke-width="2" stroke-linejoin="round"/><text x="100" y="295" font-size="18" text-anchor="start" fill="#243746">H</text><text x="485" y="69" font-size="22" text-anchor="middle" fill="#243746">中线：中点</text><path d="M425.000 92.000 L355.000 270.000 L615.000 270.000 Z" fill="#e6f0f7" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><text x="412" y="85" font-size="18" text-anchor="start" fill="#243746">A</text><text x="339" y="293" font-size="18" text-anchor="start" fill="#243746">B</text><text x="617" y="293" font-size="18" text-anchor="start" fill="#243746">C</text><line x1="425" y1="92" x2="485.0" y2="270" stroke="#378469" stroke-width="3" /><text x="480.0" y="295" font-size="18" text-anchor="start" fill="#243746">M</text><line x1="416.0" y1="265" x2="424.0" y2="275" stroke="#378469" stroke-width="2" /><line x1="546.0" y1="265" x2="554.0" y2="275" stroke="#378469" stroke-width="2" /><text x="805" y="69" font-size="22" text-anchor="middle" fill="#243746">角平分线：等角</text><path d="M745.000 92.000 L675.000 270.000 L935.000 270.000 Z" fill="#e6f0f7" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><text x="732" y="85" font-size="18" text-anchor="start" fill="#243746">A</text><text x="659" y="293" font-size="18" text-anchor="start" fill="#243746">B</text><text x="937" y="293" font-size="18" text-anchor="start" fill="#243746">C</text><line x1="745" y1="92" x2="785.1140771971634" y2="270" stroke="#ba7031" stroke-width="3" /><text x="780.1140771971634" y="295" font-size="18" text-anchor="start" fill="#243746">D</text><path d="M766.893 112.511 A30 30 0 0 1 751.595 121.266" stroke="#ba7031" fill="none" stroke-width="2"/><path d="M751.595 121.266 A30 30 0 0 1 734.021 119.919" stroke="#ba7031" fill="none" stroke-width="2"/><line x1="35" y1="325" x2="925" y2="325" stroke="#b8c8d8" stroke-width="1.5" /><path d="M590.000 374.000 L350.000 510.000 L510.000 510.000 Z" fill="#e6f0f7" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><line x1="510" y1="510" x2="635" y2="510" stroke="#344e68" stroke-width="2" stroke-dasharray="7 5" /><line x1="590" y1="374" x2="590" y2="510" stroke="#177aa1" stroke-width="3" /><path d="M590.000 498.000 L578.000 498.000 L578.000 510.000" fill="none" stroke="#177aa1" stroke-width="2" stroke-linejoin="round"/><text x="590" y="365" font-size="18" text-anchor="start" fill="#243746">A</text><text x="330" y="530" font-size="18" text-anchor="start" fill="#243746">B</text><text x="505" y="535" font-size="18" text-anchor="start" fill="#243746">C</text><text x="585" y="535" font-size="18" text-anchor="start" fill="#243746">H</text><text x="170" y="403" font-size="22" text-anchor="middle" fill="#243746">钝角三角形</text><text x="170" y="444" font-size="20" text-anchor="middle" fill="#243746">高可以在三角形外</text><text x="770" y="420" font-size="20" text-anchor="middle" fill="#243746">H 在 BC 的延长线上</text><text x="770" y="460" font-size="19" text-anchor="middle" fill="#243746">AH 仍然垂直于 BC 所在直线</t