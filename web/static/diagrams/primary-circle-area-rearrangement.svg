<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" role="img" aria-labelledby="title desc"><title id="title">圆面积的有限剪拼与细分</title><desc id="desc">同半径圆分8等份后交错重排，边界仍弯曲；同一个圆分32等份的重排更接近长方形。面积重排不变，长趋近πr、宽趋近r，有限次不是准确长方形。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="575" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="450" y="36" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">圆的等分与重排：有限次剪拼仍有弯曲边界</text><path d="M 155.0000 205.0000 L 245.0000 205.0000 A 90 90 0 0 1 218.6396 268.6396 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 218.6396 268.6396 A 90 90 0 0 1 155.0000 295.0000 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 155.0000 295.0000 A 90 90 0 0 1 91.3604 268.6396 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 91.3604 268.6396 A 90 90 0 0 1 65.0000 205.0000 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 65.0000 205.0000 A 90 90 0 0 1 91.3604 141.3604 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 91.3604 141.3604 A 90 90 0 0 1 155.0000 115.0000 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 155.0000 115.0000 A 90 90 0 0 1 218.6396 141.3604 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 155.0000 205.0000 L 218.6396 141.3604 A 90 90 0 0 1 245.0000 205.0000 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><line x1="155" y1="205" x2="245" y2="205" stroke="#18324d" stroke-width="2"/><text x="202" y="192" font-size="22" text-anchor="middle" fill="#18324d" font-weight="normal">r</text><text x="155" y="333" font-size="20" text-anchor="middle" fill="#18324d" font-weight="normal">同一个圆，半径不变</text><path d="M 410.0000 225.1492 L 375.5585 142.0000 A 90 90 0 0 1 444.4415 142.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 444.4415 142.0000 L 478.8830 225.1492 A 90 90 0 0 1 410.0000 225.1492 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 478.8830 225.1492 L 444.4415 142.0000 A 90 90 0 0 1 513.3245 142.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 513.3245 142.0000 L 547.7660 225.1492 A 90 90 0 0 1 478.8830 225.1492 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 547.7660 225.1492 L 513.3245 142.0000 A 90 90 0 0 1 582.2075 142.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 582.2075 142.0000 L 616.6491 225.1492 A 90 90 0 0 1 547.7660 225.1492 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 616.6491 225.1492 L 582.2075 142.0000 A 90 90 0 0 1 651.0906 142.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 651.0906 142.0000 L 685.5321 225.1492 A 90 90 0 0 1 616.6491 225.1492 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><text x="550" y="115" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">8等份交错重排</text><path d="M 410.0000 444.5666 L 401.1785 355.0000 A 90 90 0 0 1 418.8215 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 418.8215 355.0000 L 427.6431 444.5666 A 90 90 0 0 1 410.0000 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 427.6431 444.5666 L 418.8215 355.0000 A 90 90 0 0 1 436.4646 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 436.4646 355.0000 L 445.2862 444.5666 A 90 90 0 0 1 427.6431 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 445.2862 444.5666 L 436.4646 355.0000 A 90 90 0 0 1 454.1077 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 454.1077 355.0000 L 462.9293 444.5666 A 90 90 0 0 1 445.2862 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 462.9293 444.5666 L 454.1077 355.0000 A 90 90 0 0 1 471.7508 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 471.7508 355.00