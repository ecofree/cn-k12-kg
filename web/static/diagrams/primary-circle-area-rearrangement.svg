739 444.5666 L 595.2524 355.0000 A 90 90 0 0 1 612.8955 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 612.8955 355.0000 L 621.7170 444.5666 A 90 90 0 0 1 604.0739 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 621.7170 444.5666 L 612.8955 355.0000 A 90 90 0 0 1 630.5386 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 630.5386 355.0000 L 639.3601 444.5666 A 90 90 0 0 1 621.7170 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 639.3601 444.5666 L 630.5386 355.0000 A 90 90 0 0 1 648.1817 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 648.1817 355.0000 L 657.0032 444.5666 A 90 90 0 0 1 639.3601 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 657.0032 444.5666 L 648.1817 355.0000 A 90 90 0 0 1 665.8247 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 665.8247 355.0000 L 674.6463 444.5666 A 90 90 0 0 1 657.0032 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><path d="M 674.6463 444.5666 L 665.8247 355.0000 A 90 90 0 0 1 683.4678 355.0000 Z" fill="#a4cfe7" stroke="#2f566e" stroke-width="1"/><path d="M 683.4678 355.0000 L 692.2894 444.5666 A 90 90 0 0 1 674.6463 444.5666 Z" fill="#f5c589" stroke="#2f566e" stroke-width="1"/><text x="550" y="328" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">进一步细分为32等份</text><text x="550" y="288" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">面积不变，弧边仍未变直</text><text x="450" y="500" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">越分越细，近似长方形的长趋近 πr、宽趋近 r</text><text x="450" y="542" font-size="27" text-anchor="middle" fill="#18324d" font-weight="normal">S = πr × r = πr²</text><text x="155" y="386" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">有限图示用于直观理解</text><text x="155" y="416" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">不能把近似形状当成</text><text x="155" y="444" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">已经完全准确的长方形</text></g></svg>
