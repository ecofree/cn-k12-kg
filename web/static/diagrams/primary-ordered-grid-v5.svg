<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="title desc"><title id="title">五列五行空白定位网格</title><desc id="desc">列从左向右编号1至5，行从下向上编号1至5。没有预填答案点，供读图、标点和互换数对检验。</desc><rect width="640" height="410" fill="#fff"/><g font-family="sans-serif" fill="#243449"><text x="25" y="30" font-size="18">约定：（列，行），都从1开始</text><line x1="95" y1="320" x2="327" y2="320" stroke="#b0c0cc"/><line x1="95" y1="88" x2="95" y2="320" stroke="#b0c0cc"/><text x="90" y="350" font-size="17">1</text><text x="62" y="326" font-size="17">1</text><line x1="95" y1="262" x2="327" y2="262" stroke="#b0c0cc"/><line x1="153" y1="88" x2="153" y2="320" stroke="#b0c0cc"/><text x="148" y="350" font-size="17">2</text><text x="62" y="268" font-size="17">2</text><line x1="95" y1="204" x2="327" y2="204" stroke="#b0c0cc"/><line x1="211" y1="88" x2="211" y2="320" stroke="#b0c0cc"/><text x="206" y="350" font-size="17">3</text><text x="62" y="210" font-size="17">3</text><line x1="95" y1="146" x2="327" y2="146" stroke="#b0c0cc"/><line x1="269" y1="88" x2="269" y2="320" stroke="#b0c0cc"/><text x="264" y="350" font-size="17">4</text><text x="62" y="152" font-size="17">4</text><line x1="95" y1="88" x2="327" y2="88" stroke="#b0c0cc"/><line x1="327" y1="88" x2="327" y2="320" stroke="#b0c0cc"/><text x="322" y="350" font-size="17">5</text><text x="62" y="94" font-size="17">5</text><text x="250" y="386" font-size="16">列向右增加 →</text><text x="26" y="68" font-size="16">行向上增加 ↑</text><text x="380" y="120" font-size="17">先找列，再找行。</text><text x="380" y="155" font-size="17">在交点上标出自己的点。</text></g></svg>
