<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">一至四月的平均气温</title>
<desc id="desc">月份等距，纵轴从0到20摄氏度，每格2度；一至四月平均气温分别为5、8、12、18摄氏度。</desc>
<rect width="840" height="430" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" fill="#18324d">
<text x="420" y="33" font-size="23" text-anchor="middle">一至四月的平均气温</text>
<text x="74" y="65" font-size="16" text-anchor="middle">气温（℃）</text><line x1="105" y1="345" x2="775" y2="345" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="350" font-size="15" text-anchor="end">0</text><line x1="105" y1="319" x2="775" y2="319" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="324" font-size="15" text-anchor="end">2</text><line x1="105" y1="293" x2="775" y2="293" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="298" font-size="15" text-anchor="end">4</text><line x1="105" y1="267" x2="775" y2="267" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="272" font-size="15" text-anchor="end">6</text><line x1="105" y1="241" x2="775" y2="241" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="246" font-size="15" text-anchor="end">8</text><line x1="105" y1="215" x2="775" y2="215" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="220" font-size="15" text-anchor="end">10</text><line x1="105" y1="189" x2="775" y2="189" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="194" font-size="15" text-anchor="end">12</text><line x1="105" y1="163" x2="775" y2="163" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="168" font-size="15" text-anchor="end">14</text><line x1="105" y1="137" x2="775" y2="137" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="142" font-size="15" text-anchor="end">16</text><line x1="105" y1="111" x2="775" y2="111" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="116" font-size="15" text-anchor="end">18</text><line x1="105" y1="85" x2="775" y2="85" stroke="#dbe5ec" stroke-width="1" /><text x="93" y="90" font-size="15" text-anchor="end">20</text><line x1="105" y1="345" x2="783" y2="345" stroke="#18324d" stroke-width="2" /><line x1="105" y1="345" x2="105" y2="75" stroke="#18324d" stroke-width="2" /><polyline points="145,280 341.667,241 538.333,189 735,111" fill="none" stroke="#2872ad" stroke-width="3"/><circle id="point-0" cx="145" cy="280" r="5" fill="#2872ad"/><text x="145" y="377" font-size="18" text-anchor="middle">1月</text><circle id="point-1" cx="341.667" cy="241" r="5" fill="#2872ad"/><text x="341.667" y="377" font-size="18" text-anchor="middle">2月</text><circle id="point-2" cx="538.333" cy="189" r="5" fill="#2872ad"/><text x="538.333" y="377" font-size="18" text-anchor="middle">3月</text><circle id="point-3" cx="735" cy="111" r="5" fill="#2872ad"/><text x="735" y="377" font-size="18" text-anchor="middle">4月</text><text x="420" y="412" font-size="18" text-anchor="middle">横轴按相等时间间隔排列；先读坐标，再算变化量。</text>
</g></svg>
