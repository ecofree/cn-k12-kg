<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
  <title id="title">一行三列、各列高度一二一的三视图</title>
  <desc id="desc">摆法为一行三列，高度依次1、2、1。前面图高度1、2、1；右面图只有一列高2；上面图一行3格。图中每个小格边长相同。</desc>
  <rect width="720" height="310" rx="16" fill="#f6f9fc"/>
  <g stroke="#245468" stroke-width="2.5" fill="#dcedf5">
    <rect x="55" y="130" width="50" height="50"/><rect x="105" y="130" width="50" height="50"/>
    <rect x="155" y="130" width="50" height="50"/><rect x="105" y="80" width="50" height="50"/>
    <rect x="335" y="130" width="50" height="50"/><rect x="335" y="80" width="50" height="50"/>
    <rect x="515" y="130" width="50" height="50"/><rect x="565" y="130" width="50" height="50"/>
    <rect x="615" y="130" width="50" height="50"/>
  </g>
  <g font-family="sans-serif" fill="#173947" font-size="23" text-anchor="middle">
    <text x="130" y="220">前面</text><text x="360" y="220">右面</text><text x="590" y="220">上面</text>
    <text x="360" y="275" font-size="20">摆法：仅一行，三列高度从左到右为 1、2、1</text>
  </g>
</svg>
