<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
  <title id="title">示例单式条形统计图</title>
  <desc id="desc">纵轴从0到12人，每格2人；A班8人，B班12人，C班10人。三个条形同宽，从0开始。</desc>
  <rect width="620" height="410" rx="16" fill="#f6f9fc"/>
  <g stroke="#d4dfe4" stroke-width="1">
    <path d="M80 310H550 M80 270H550 M80 230H550 M80 190H550 M80 150H550 M80 110H550 M80 70H550"/>
  </g>
  <g fill="#538ca2" stroke="#245468" stroke-width="2">
    <rect x="140" y="150" width="70" height="160"/><rect x="290" y="70" width="70" height="240"/>
    <rect x="440" y="110" width="70" height="200"/>
  </g>
  <path d="M80 50V310H560" fill="none" stroke="#173947" stroke-width="3"/>
  <g font-family="sans-serif" font-size="22" fill="#173947" text-anchor="end">
    <text x="65" y="317">0</text><text x="65" y="277">2</text><text x="65" y="237">4</text>
    <text x="65" y="197">6</text><text x="65" y="157">8</text><text x="65" y="117">10</text><text x="65" y="77">12</text>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#173947" text-anchor="middle">
    <text x="70" y="35">人数</text><text x="175" y="350">A班</text><text x="325" y="350">B班</text>
    <text x="475" y="350">C班</text><text x="310" y="390">示例数据 · 每格代表 2 人</text>
  </g>
</svg>
