<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d"><title id="t">23除以5的竖式与分组含义</title><desc id="d">除数5在左边，被除数23在里面，商4对齐个位；乘回20表示四份每份5，23减20余3，3小于5。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:20px} </style><rect width="760" height="430" fill="white"/><text x="380" y="38" text-anchor="middle" font-size="25">23 ÷ 5：竖式每一步都对应分组</text><g font-size="34" text-anchor="middle"><text x="290" y="105">4</text><text x="180" y="160">5</text><text x="250" y="160">2</text><text x="290" y="160">3</text><text x="250" y="225">2</text><text x="290" y="225">0</text><text x="290" y="300">3</text></g><path d="M220 123H320 M220 123Q230 165 205 190 M230 247H320" fill="none" stroke="#18324a" stroke-width="3"/><g font-size="19"><text x="370" y="102">商：4份，每份5个</text><text x="370" y="160">原有：23个</text><text x="370" y="225">分走：5 × 4 = 20个</text><text x="370" y="300">剩余：23 − 20 = 3个</text><text x="380" y="370" text-anchor="middle">3 &lt; 5，剩下的不够再分完整的一份。</text></g></svg>
