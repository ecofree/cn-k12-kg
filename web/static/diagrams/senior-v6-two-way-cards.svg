<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-labelledby="title desc">
<title id="title">二十张卡的标记数量</title>
<desc id="desc">完整卡组共20张，每张等可能抽到。行表示是否有A标记，列表示是否有B标记。有A有B为6张，有A无B为4张，无A有B为6张，无A无B为4张。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:22px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.count{font-size:32px;font-weight:600}.line{stroke:#7895a6;stroke-width:1.5}</style>
<rect width="700" height="360" rx="12" fill="#f8fbfd"/>
<text x="350" y="42" text-anchor="middle" class="title">完整卡组：20 张，每张等可能被抽到</text>
<rect x="65" y="80" width="570" height="210" fill="white" stroke="#7895a6" stroke-width="1.5"/>
<path d="M65 150H635 M65 220H635 M255 80V290 M445 80V290" fill="none" class="line"/>
<rect x="66" y="81" width="188" height="68" fill="#e9f0f5"/>
<text x="160" y="124" text-anchor="middle">卡片数量</text>
<text x="350" y="124" text-anchor="middle">有 B 标记</text>
<text x="540" y="124" text-anchor="middle">无 B 标记</text>
<text x="160" y="194" text-anchor="middle">有 A 标记</text>
<text x="160" y="264" text-anchor="middle">无 A 标记</text>
<text x="350" y="197" text-anchor="middle" class="count">6</text>
<text x="540" y="197" text-anchor="middle" class="count">4</text>
<text x="350" y="267" text-anchor="middle" class="count">6</text>
<text x="540" y="267" text-anchor="middle" class="count">4</text>
<text x="350" y="330" text-anchor="middle" class="small">四格包括所有卡片；这是完整卡组数量，不是抽样频数估计。</text>
</svg>
