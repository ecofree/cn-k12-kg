<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-labelledby="title"><title id="title">去分母：乘数必须作用于每一项</title><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;fill:#172b4d}.title{font-size:23px;font-weight:700}.small{font-size:15px}.axis{stroke:#34445b;stroke-width:2}.grid{stroke:#dce4ee;stroke-width:1}.curve{stroke:#147d92;stroke-width:4;fill:none}.mark{fill:#147d92}.note{fill:#45556b}</style><text class="title" x="30" y="35">去分母：乘数必须作用于每一项</text><text x="36" y="80">原方程：(x−1)/2 + 1 = 3</text><text x="36" y="125">两边整体同乘2：</text><text x="48" y="175" fill="#147d92">2×(x−1)/2 + 2×1 = 2×3</text><path d="M55 192 H595" stroke="#aab8ca"/><text x="36" y="235">化简为：x−1 + 2 = 6</text><text class="note" x="36" y="287">常数项1也要乘2；不能只消去看得见的分母。</text><text class="small" x="36" y="344">先逐项核对等价变形，再求解并代回最初的方程。</text></svg>