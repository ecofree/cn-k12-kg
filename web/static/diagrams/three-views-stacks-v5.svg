32.12" font-size="20" text-anchor="middle" fill="#243746">2</text><text x="344" y="373" font-size="18" text-anchor="middle" fill="#243746">各格高度</text><text x="824" y="373" font-size="18" text-anchor="middle" fill="#243746">各格高度</text><text x="480" y="422" font-size="20" text-anchor="middle" fill="#243746">限制：同样大小的小正方体，按格无悬空堆叠；行列方向与视图固定。</text><text x="480" y="458" font-size="21" text-anchor="middle" fill="#243746">两方案每行、每列最大高度都为 2；俯视均占四格。</text><text x="480" y="492" font-size="21" text-anchor="middle" fill="#243746">因此三视图不能直接证明“内部全满”，块数不唯一。</text></g></svg>
