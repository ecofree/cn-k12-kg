<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
<title id="title">正方体的顶点、面与平行方向</title><desc id="desc">ABCD为下底面依次顶点，A1、B1、C1、D1分别在对应点上方。AB和CD为同一底面内平行对边；AA1、BB1、CC1、DD1为竖直侧棱。虚线只表示被遮挡的棱，不表示不存在。投影不保持真实角度和长度。</desc>
<rect width="680" height="430" fill="#fff"/>
<g font-family="sans-serif" fill="#18354b"><text x="28" y="34" font-size="23">先确认顶点对应，再判断空间关系</text><text x="28" y="65" font-size="16">同一字母上下对应；纸面交叉不自动代表空间交点</text></g>
<g fill="#edf6ff" stroke="#24465c" stroke-width="2.5" stroke-linejoin="round"><path d="M170 360L410 360L500 280L260 280Z" fill="#e8f3ed"/><path d="M170 180L410 180L500 100L260 100Z"/><path d="M170 180L410 180L410 360L170 360Z" fill="#eff7ff"/><path d="M410 180L500 100L500 280L410 360Z" fill="#e7edf7"/></g>
<g fill="none" stroke="#24465c" stroke-width="2.5"><path d="M170 180L260 100L500 100M260 100L260 280L170 360M260 280L500 280" stroke-dasharray="7 6"/><path d="M170 180L170 360L410 360L500 280L500 100L410 180Z"/><path d="M410 180L410 360"/></g>
<g fill="#102f43" font-family="serif" font-size="24"><text x="145" y="383">A</text><text x="416" y="384">B</text><text x="506" y="295">C</text><text x="239" y="305">D</text><text x="140" y="176">A₁</text><text x="410" y="173">B₁</text><text x="505" y="104">C₁</text><text x="235" y="95">D₁</text></g>
<g font-family="sans-serif" fill="#41596a" font-size="15"><text x="28" y="413">示意投影：实际面为正方形，棱等长；不在图上量角或量长。</text><text x="535" y="180">上底面</text><text x="535" y="203">A₁B₁C₁D₁</text><text x="535" y="286">下底面</text><text x="535" y="309">ABCD</text></g>
</svg>
