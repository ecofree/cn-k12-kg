<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">等值分数与单位长度</title><desc id="desc">同长两条分别涂二分之一和四分之二；下方数轴画到2，0到1才是单位长度。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="400" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="36" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">同一整体，不同的等分单位</text><rect x="170.0" y="75" width="200.0" height="50" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><rect x="370.0" y="75" width="200.0" height="50" fill="white" stroke="#18324d" stroke-width="2"/><text x="115" y="108" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">1/2</text><rect x="170.0" y="155" width="100.0" height="50" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><rect x="270.0" y="155" width="100.0" height="50" fill="#72b4dc" stroke="#18324d" stroke-width="2"/><rect x="370.0" y="155" width="100.0" height="50" fill="white" stroke="#18324d" stroke-width="2"/><rect x="470.0" y="155" width="100.0" height="50" fill="white" stroke="#18324d" stroke-width="2"/><text x="115" y="188" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">2/4</text><text x="370" y="236" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">整体长度相同，涂色长度也相同</text><line x1="130" y1="303" x2="650" y2="303" stroke="#18324d" stroke-width="2"/><line x1="130" y1="295" x2="130" y2="311" stroke="#18324d" stroke-width="2"/><text x="130" y="337" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="260" y1="295" x2="260" y2="311" stroke="#18324d" stroke-width="2"/><line x1="390" y1="295" x2="390" y2="311" stroke="#18324d" stroke-width="2"/><text x="390" y="337" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="520" y1="295" x2="520" y2="311" stroke="#18324d" stroke-width="2"/><line x1="650" y1="295" x2="650" y2="311" stroke="#18324d" stroke-width="2"/><text x="650" y="337" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><circle cx="260" cy="303" r="5" fill="#c65b19"/><text x="260" y="279" font-size="19" text-anchor="middle" fill="#18324d" font-weight="normal">1/2</text><text x="390" y="377" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">数轴以 0 到 1 的长度作为一个单位</text></g></svg>
