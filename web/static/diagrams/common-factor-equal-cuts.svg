<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" role="img" aria-labelledby="title desc"><title id="title">相同小段分割两种长度</title><desc id="desc">12厘米绳子为2段6厘米，18厘米为3段6厘米。两种长度在同一比例下表示。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="315" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="35" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">整体长度不同，分段单位相同</text><rect x="115" y="100" width="160" height="32" fill="#a8d2e8" stroke="#18324d" stroke-width="2"/><rect x="275" y="100" width="160" height="32" fill="#a8d2e8" stroke="#18324d" stroke-width="2"/><text x="455" y="124" font-size="20" text-anchor="start" fill="#18324d" font-weight="normal">12厘米</text><text x="195" y="166" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6厘米</text><text x="355" y="166" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6厘米</text><rect x="115" y="210" width="160" height="32" fill="#a8d2e8" stroke="#18324d" stroke-width="2"/><rect x="275" y="210" width="160" height="32" fill="#a8d2e8" stroke="#18324d" stroke-width="2"/><rect x="435" y="210" width="160" height="32" fill="#a8d2e8" stroke="#18324d" stroke-width="2"/><text x="615" y="234" font-size="20" text-anchor="start" fill="#18324d" font-weight="normal">18厘米</text><text x="195" y="276" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6厘米</text><text x="355" y="276" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6厘米</text><text x="515" y="276" font-size="18" text-anchor="middle" fill="#18324d" font-weight="normal">6厘米</text></g></svg>
