<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">平行四边形剪拼为长方形</title><desc id="desc">原图的底6厘米、高4厘米，沿图示高剪下左侧橙色三角形并向右平移6厘米，拼成6厘米乘4厘米的长方形。原斜边不是长方形的宽。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="840" height="360" fill="#fff"/><text x="420" y="35" text-anchor="middle" class="title">沿高剪开，移动一片，面积保持不变</text><text x="190" y="80" text-anchor="middle" class="">原图</text><text x="615" y="80" text-anchor="middle" class="">移动后</text><polygon points="60,240 240,240 300,120 120,120" fill="#e6f3fa" class="shape"/><polygon points="60,240 120,240 120,120" fill="#ffddb0" class="shape"/><path d="M120 120V240" class="dash"/><path d="M120 228H132V240" fill="none" stroke="#18324a" stroke-width="2"/><text x="170" y="275" text-anchor="middle" class="">底 6 cm</text><text x="135" y="185" text-anchor="start" class="label">高 4 cm</text><path d="M345 182H405L393 170M405 182L393 194" stroke="#18324a" stroke-width="3" fill="none"/><polygon points="510,240 630,240 690,120 510,120" fill="#e6f3fa" class="shape"/><polygon points="630,240 690,240 690,120" fill="#ffddb0" class="shape"/><rect x="510" y="120" width="180" height="120" fill="none" class="shape"/><path d="M510 228H522V240" fill="none" stroke="#18324a" stroke-width="2"/><text x="600" y="275" text-anchor="middle" class="">长 = 原来的底</text><text x="710" y="180" text-anchor="middle" class="label">宽</text><text x="710" y="205" text-anchor="middle" class="label">4 cm</text><text x="420" y="325" text-anchor="middle" class="label">本图橙色三角形只平移，没有拉伸、增添或重叠。</text></svg>
