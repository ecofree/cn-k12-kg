<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">三角形元素及共线反例</title><desc id="desc">三角形ABC的角A由射线AB和AC组成，对边BC为线段。右侧PQR共线，不构成三角形。</desc><rect width="900" height="360" rx="16" fill="#f5f8fc"/><g font-family="sans-serif" fill="#243746"><text x="450" y="36" font-size="24" text-anchor="middle" fill="#243746">边、顶点、内角与对边</text><path d="M145.000 90.000 L70.000 270.000 L370.000 270.000 Z" fill="#e6f0f7" stroke="#344e68" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="270" x2="370" y2="270" stroke="#177aa1" stroke-width="5" /><text x="135" y="77" font-size="20" text-anchor="start" fill="#243746">A</text><text x="45" y="293" font-size="20" text-anchor="start" fill="#243746">B</text><text x="380" y="293" font-size="20" text-anchor="start" fill="#243746">C</text><text x="220" y="307" font-size="21" text-anchor="middle" fill="#177aa1">BC 是 ∠A 的对边</text><text x="610" y="102" font-size="20" text-anchor="middle" fill="#243746">顶点 A 处的角边：射线 AB、AC</text><text x="610" y="143" font-size="20" text-anchor="middle" fill="#243746">三角形的边：线段 AB、BC、CA</text><text x="610" y="184" font-size="20" text-anchor="middle" fill="#243746">边 BC 不经过 A，所以与 ∠A 相对。</text><line x1="505" y1="263" x2="815" y2="263" stroke="#344e68" stroke-width="2.5" /><circle cx="525" cy="263" r="4" fill="#b84a38"/><circle cx="650" cy="263" r="4" fill="#b84a38"/><circle cx="790" cy="263" r="4" fill="#b84a38"/><text x="525" y="291" font-size="19" text-anchor="middle" fill="#243746">P</text><text x="650" y="291" font-size="19" text-anchor="middle" fill="#243746">Q</text><text x="790" y="291" font-size="19" text-anchor="middle" fill="#243746">R</text><text x="650" y="330" font-size="20" text-anchor="middle" fill="#b84a38">三点共线：不能围成非退化三角形</text></g></svg>
