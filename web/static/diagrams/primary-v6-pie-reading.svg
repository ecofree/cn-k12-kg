<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">兴趣小组人员构成</title><desc id="desc">每人只归入一个小组，阅读占35%，其他占65%，合计80人；扇形圆心角为126度和234度。</desc><style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2} .n{font-size:21px;text-anchor:middle}</style><rect width="100%" height="100%" fill="white"/><text x="360" y="40" text-anchor="middle" font-size="25">兴趣小组共80人</text><circle cx="220" cy="225" r="140" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><path d="M220 225V85A140 140 0 0 1 333.26238 307.28994Z" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="430" y="180" font-size="25">阅读：35%</text><text x="430" y="234" font-size="25">其他：65%</text><text x="360" y="400" class="n">每人只计入一类；两类覆盖全体。</text></svg>