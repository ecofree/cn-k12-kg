<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-labelledby="title desc"><title id="title">乘负数反向的数轴解释</title><desc id="desc">上方数轴1在3左边；同乘−1后，下方−1在−3右边。颜色连接对应数，展示次序反转，不以图代替除数非零等条件。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="800" height="465" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="400" y="38" font-size="24" text-anchor="middle" fill="#18324d" font-weight="bold">同乘 −1，数轴上的左右次序反转</text><line x1="130" y1="145" x2="670" y2="145" stroke="#18324d" stroke-width="2"/><line x1="160" y1="139" x2="160" y2="151" stroke="#18324d" stroke-width="2"/><text x="160" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-4</text><line x1="220" y1="139" x2="220" y2="151" stroke="#18324d" stroke-width="2"/><text x="220" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-3</text><line x1="280" y1="139" x2="280" y2="151" stroke="#18324d" stroke-width="2"/><text x="280" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-2</text><line x1="340" y1="139" x2="340" y2="151" stroke="#18324d" stroke-width="2"/><text x="340" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-1</text><line x1="400" y1="139" x2="400" y2="151" stroke="#18324d" stroke-width="2"/><text x="400" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="460" y1="139" x2="460" y2="151" stroke="#18324d" stroke-width="2"/><text x="460" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="520" y1="139" x2="520" y2="151" stroke="#18324d" stroke-width="2"/><text x="520" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><line x1="580" y1="139" x2="580" y2="151" stroke="#18324d" stroke-width="2"/><text x="580" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><line x1="640" y1="139" x2="640" y2="151" stroke="#18324d" stroke-width="2"/><text x="640" y="175" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><line x1="130" y1="330" x2="670" y2="330" stroke="#18324d" stroke-width="2"/><line x1="160" y1="324" x2="160" y2="336" stroke="#18324d" stroke-width="2"/><text x="160" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-4</text><line x1="220" y1="324" x2="220" y2="336" stroke="#18324d" stroke-width="2"/><text x="220" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-3</text><line x1="280" y1="324" x2="280" y2="336" stroke="#18324d" stroke-width="2"/><text x="280" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-2</text><line x1="340" y1="324" x2="340" y2="336" stroke="#18324d" stroke-width="2"/><text x="340" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">-1</text><line x1="400" y1="324" x2="400" y2="336" stroke="#18324d" stroke-width="2"/><text x="400" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">0</text><line x1="460" y1="324" x2="460" y2="336" stroke="#18324d" stroke-width="2"/><text x="460" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">1</text><line x1="520" y1="324" x2="520" y2="336" stroke="#18324d" stroke-width="2"/><text x="520" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">2</text><line x1="580" y1="324" x2="580" y2="336" stroke="#18324d" stroke-width="2"/><text x="580" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">3</text><line x1="640" y1="324" x2="640" y2="336" stroke="#18324d" stroke-width="2"/><text x="640" y="360" font-size="17" text-anchor="middle" fill="#18324d" font-weight="normal">4</text><circle cx="460" cy="145" r="7" fill="#c65b19"/><circle cx="580" cy="145" r="7" fill="#19769b"/><text x="520" y="104" font-size="25" 