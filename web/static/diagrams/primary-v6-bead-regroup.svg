<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">按颗计数与按组计数</title><desc id="desc">同一个盒子里有12颗珠子，其中8颗蓝色、4颗未着色；尚未圈成组。</desc><rect width="760" height="340" fill="#fff"/><g font-family="sans-serif" fill="#17334f" text-anchor="middle"><text x="380" y="37" font-size="24">把整盒珠子看作单位“1”</text><rect x="115" y="66" width="530" height="214" rx="14" fill="#f6f9fc" stroke="#6c8ca7" stroke-width="2"/><circle cx="220" cy="105" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="325" cy="105" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="430" cy="105" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="535" cy="105" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="220" cy="173" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="325" cy="173" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="430" cy="173" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="535" cy="173" r="20" fill="#247eb1" stroke="#315d7a" stroke-width="2"/><circle cx="220" cy="241" r="20" fill="#fff" stroke="#315d7a" stroke-width="2"/><circle cx="325" cy="241" r="20" fill="#fff" stroke="#315d7a" stroke-width="2"/><circle cx="430" cy="241" r="20" fill="#fff" stroke="#315d7a" stroke-width="2"/><circle cx="535" cy="241" r="20" fill="#fff" stroke="#315d7a" stroke-width="2"/><text x="380" y="313" font-size="20">每4颗分成一组；蓝珠单独成组，再比较份数。</text></g></svg>
