<title id="title">三类角的位置识别</title><desc id="desc">两水平直线AB和CD被竖直直线t截于P和Q，P在上Q在下。A和C在左，B和D在右，R在Q下方。</desc><rect width="600" height="380" fill="#fff"/>
<g stroke="#334155" stroke-width="2.5"><path d="M60 115H540 M60 245H540 M285 40V345"/></g><g fill="#086f91"><circle cx="130" cy="115" r="4"/><circle cx="440" cy="115" r="4"/><circle cx="130" cy="245" r="4"/><circle cx="440" cy="245" r="4"/><circle cx="285" cy="115" r="4"/><circle cx="285" cy="245" r="4"/><circle cx="285" cy="315" r="4"/></g>
<g font-family="sans-serif" font-size="23" fill="#182c3e"><text x="121" y="97">A</text><text x="432" y="97">B</text><text x="121" y="273">C</text><text x="432" y="273">D</text><text x="258" y="104">P</text><text x="256" y="236">Q</text><text x="303" y="324">R</text><text x="301" y="55">t</text></g><text x="300" y="372" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#475569">先确定截线，再区分内外及同侧、异侧位置。</text></svg>
