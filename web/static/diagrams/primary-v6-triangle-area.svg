<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" role="img" aria-labelledby="title desc"><title id="title">两个相同三角形拼成平行四边形</title><desc id="desc">蓝色三角形底6厘米，高4厘米。橙色三角形与蓝色全等，以共用斜边中点旋转180度对应；两片内部不重叠，合成同底同高的平行四边形。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="740" height="390" fill="#fff"/><text x="370" y="35" text-anchor="middle" class="title">复制一个相同三角形，旋转后拼接</text><polygon points="100,270 370,270 190,90" fill="#cfe6f7" class="shape"/><polygon points="370,270 460,90 190,90" fill="#ffddb0" class="shape"/><path d="M190 90V270" class="dash"/><path d="M190 258H202V270" fill="none" stroke="#18324a" stroke-width="2"/><text x="235" y="310" text-anchor="middle" class="">底 6 cm</text><text x="205" y="180" text-anchor="start" class="label">高 4 cm</text><text x="250" y="235" text-anchor="middle" class="label">原三角形</text><text x="355" y="130" text-anchor="middle" class="label">复制的一片</text><text x="370" y="355" text-anchor="middle" class="label">两片全等；拼图的底和高与原三角形相同。</text></svg>
