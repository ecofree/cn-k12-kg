<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc"><title id="title">两个班的复式条形统计图</title><desc id="desc">纵轴从0到16人，每相邻刻度相差2人。实条表示男生，斜线条表示女生。A班实条到10、斜线条到12；B班实条到14、斜线条到10。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="720" height="475" fill="#fff"/><defs><pattern id="diagonal" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff3cc"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#8a4b12" stroke-width="2"/></pattern></defs><text x="360" y="35" text-anchor="middle" class="title">A班和B班的男、女生人数</text><text x="80" y="75" text-anchor="start" class="label">人数 / 人</text><line x1="90" y1="350" x2="640" y2="350" class="grid"/><text x="75" y="356" text-anchor="end" class="label">0</text><line x1="90" y1="320" x2="640" y2="320" class="grid"/><text x="75" y="326" text-anchor="end" class="label">2</text><line x1="90" y1="290" x2="640" y2="290" class="grid"/><text x="75" y="296" text-anchor="end" class="label">4</text><line x1="90" y1="260" x2="640" y2="260" class="grid"/><text x="75" y="266" text-anchor="end" class="label">6</text><line x1="90" y1="230" x2="640" y2="230" class="grid"/><text x="75" y="236" text-anchor="end" class="label">8</text><line x1="90" y1="200" x2="640" y2="200" class="grid"/><text x="75" y="206" text-anchor="end" class="label">10</text><line x1="90" y1="170" x2="640" y2="170" class="grid"/><text x="75" y="176" text-anchor="end" class="label">12</text><line x1="90" y1="140" x2="640" y2="140" class="grid"/><text x="75" y="146" text-anchor="end" class="label">14</text><line x1="90" y1="110" x2="640" y2="110" class="grid"/><text x="75" y="116" text-anchor="end" class="label">16</text><path d="M90 105V350H650" fill="none" stroke="#18324a" stroke-width="2.5"/><rect x="190" y="200" width="50" height="150" fill="#377cb5" stroke="#18324a" stroke-width="2"/><rect x="255" y="170" width="50" height="180" fill="url(#diagonal)" stroke="#18324a" stroke-width="2"/><rect x="430" y="140" width="50" height="210" fill="#377cb5" stroke="#18324a" stroke-width="2"/><rect x="495" y="200" width="50" height="150" fill="url(#diagonal)" stroke="#18324a" stroke-width="2"/><text x="247" y="385" text-anchor="middle" class="">A班</text><text x="487" y="385" text-anchor="middle" class="">B班</text><rect x="210" y="420" width="28" height="24" fill="#377cb5" stroke="#18324a"/><text x="250" y="439" text-anchor="start" class="label">男生（实条）</text><rect x="390" y="420" width="28" height="24" fill="url(#diagonal)" stroke="#18324a"/><text x="430" y="439" text-anchor="start" class="label">女生（斜线条）</text></svg>
