<svg xmlns="http://www.w3.org/2000/svg" width="650" height="455" viewBox="0 0 650 455" role="img" aria-labelledby="title desc"><title id="title">四周图书借阅量</title><desc id="desc">第1至4周4、6、2、8本；纵轴0至10，每格2本。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:18px}.title{font-size:25px;font-weight:700}.small{font-size:16px}.tick{font-size:17px}.grid{stroke:#d5e0e8;stroke-width:1}.axis{stroke:#37566b;stroke-width:2}.label{font-size:20px;font-weight:600}</style><rect width="100%" height="100%" fill="#f8fbfd" rx="12"/><text x="34" y="40" class="title" text-anchor="start">四周借阅量</text><text x="34" y="70" class="small" text-anchor="start">单位：本；纵轴从 0 开始，每格 2 本</text><line x1="90" y1="355" x2="595" y2="355" class="grid"/><text x="76" y="361" class="tick" text-anchor="end">0</text><line x1="90" y1="305" x2="595" y2="305" class="grid"/><text x="76" y="311" class="tick" text-anchor="end">2</text><line x1="90" y1="255" x2="595" y2="255" class="grid"/><text x="76" y="261" class="tick" text-anchor="end">4</text><line x1="90" y1="205" x2="595" y2="205" class="grid"/><text x="76" y="211" class="tick" text-anchor="end">6</text><line x1="90" y1="155" x2="595" y2="155" class="grid"/><text x="76" y="161" class="tick" text-anchor="end">8</text><line x1="90" y1="105" x2="595" y2="105" class="grid"/><text x="76" y="111" class="tick" text-anchor="end">10</text><line x1="90" y1="105" x2="90" y2="355" class="axis"/><line x1="90" y1="355" x2="595" y2="355" class="axis"/><rect x="132" y="255" width="65" height="100" rx="3" fill="#277d94"/><text x="164.5" y="245" class="label" text-anchor="middle">4</text><text x="164.5" y="388" class="tick" text-anchor="middle">第1周</text><rect x="252" y="205" width="65" height="150" rx="3" fill="#277d94"/><text x="284.5" y="195" class="label" text-anchor="middle">6</text><text x="284.5" y="388" class="tick" text-anchor="middle">第2周</text><rect x="372" y="305" width="65" height="50" rx="3" fill="#277d94"/><text x="404.5" y="295" class="label" text-anchor="middle">2</text><text x="404.5" y="388" class="tick" text-anchor="middle">第3周</text><rect x="492" y="155" width="65" height="200" rx="3" fill="#277d94"/><text x="524.5" y="145" class="label" text-anchor="middle">8</text><text x="524.5" y="388" class="tick" text-anchor="middle">第4周</text><text x="34" y="430" class="small" text-anchor="start">先读刻度与单位，再比较本数。图中每根条的起点都是 0。</text></svg>
