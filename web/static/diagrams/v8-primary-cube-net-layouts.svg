<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc"><title id="title">三种六格布局</title><desc id="desc">甲：A、B、C、D从左到右一排，E接B上方，F接B下方。乙：完整的两行三列。丙：六个正方形排成一条直线。所有格子边长相同，沿完整边连接。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#16324f" stroke-linejoin="round"><text x="280.0" y="36" text-anchor="middle" font-size="24">三种六格布局</text><text x="65" y="152" text-anchor="middle" font-size="24">甲</text><rect x="150" y="120" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="174.0" y="151.0" text-anchor="middle" font-size="22">A</text><rect x="198" y="120" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="222.0" y="151.0" text-anchor="middle" font-size="22">B</text><rect x="246" y="120" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="270.0" y="151.0" text-anchor="middle" font-size="22">C</text><rect x="294" y="120" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="318.0" y="151.0" text-anchor="middle" font-size="22">D</text><rect x="198" y="72" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="222.0" y="103.0" text-anchor="middle" font-size="22">E</text><rect x="198" y="168" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><text x="222.0" y="199.0" text-anchor="middle" font-size="22">F</text><text x="65" y="325" text-anchor="middle" font-size="24">乙</text><rect x="174" y="272" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="222" y="272" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="270" y="272" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="174" y="320" width="48" height="48" fill="#e7f0f7" stroke="#16324f" stroke-width="2"/><rect x="222" y="320" width="48" height="48" fi