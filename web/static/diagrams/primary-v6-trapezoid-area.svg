<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 375" role="img" aria-labelledby="title desc"><title id="title">两个梯形拼成平行四边形</title><desc id="desc">每个梯形上底3厘米、下底5厘米、高4厘米。把复制的一片旋转180度，沿腰拼接，得到底为5加3厘米、高4厘米的平行四边形；两片没有重叠。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="840" height="375" fill="#fff"/><text x="420" y="35" text-anchor="middle" class="title">两张相同梯形，反向拼成平行四边形</text><text x="170" y="80" text-anchor="middle" class="">一张梯形</text><text x="610" y="80" text-anchor="middle" class="">两张拼接</text><polygon points="60,260 210,260 180,140 90,140" fill="#cfe6f7" class="shape"/><path d="M90 140V260" class="dash"/><path d="M90 248H102V260" fill="none" stroke="#18324a" stroke-width="2"/><text x="135" y="125" text-anchor="middle" class="">3 cm</text><text x="135" y="292" text-anchor="middle" class="">5 cm</text><text x="105" y="205" text-anchor="start" class="label">4 cm</text><polygon points="440,260 590,260 560,140 470,140" fill="#cfe6f7" class="shape"/><polygon points="590,260 680,260 710,140 560,140" fill="#ffddb0" class="shape"/><path d="M470 140V260" class="dash"/><path d="M470 248H482V260" fill="none" stroke="#18324a" stroke-width="2"/><text x="515" y="292" text-anchor="middle" class="">5 cm</text><text x="635" y="292" text-anchor="middle" class="">3 cm</text><text x="485" y="205" text-anchor="start" class="label">高 4 cm</text><text x="420" y="340" text-anchor="middle" class="label">拼图的底由下底与上底接成；高仍是原来两底之间的距离。</text></svg>
