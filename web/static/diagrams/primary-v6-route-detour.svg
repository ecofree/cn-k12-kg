<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" role="img" aria-labelledby="title desc">
  <title id="title">同一终点的两条路线</title>
  <desc id="desc">列向右、行向上编号。A在1列1行、B在4列3行。甲先向东3格再向北2格；乙先向北3格再向东3格最后向南1格。每格100米。</desc>
  <rect width="700" height="490" fill="#fff"/>
  <g font-family="sans-serif" fill="#17334f" text-anchor="middle">
    <text x="350" y="35" font-size="24">终点相同，走过的路线相同吗？</text>
    <path d="M140 100H460M140 180H460M140 260H460M140 340H460M140 100V340M220 100V340M300 100V340M380 100V340M460 100V340" stroke="#c9d7e4" fill="none" stroke-width="1.5"/>
    <g font-size="18"><text x="140" y="372">1</text><text x="220" y="372">2</text><text x="300" y="372">3</text><text x="380" y="372">4</text><text x="460" y="372">5</text><text x="105" y="347">1</text><text x="105" y="267">2</text><text x="105" y="187">3</text><text x="105" y="107">4</text></g>
    <path d="M140 340H380V180" stroke="#b87706" fill="none" stroke-width="5"/>
    <path d="M140 340V100H380V180" stroke="#176aa1" fill="none" stroke-width="5"/>
    <path d="M250 333L262 340L250 347M373 252L380 240L387 252" fill="none" stroke="#b87706" stroke-width="3"/>
    <path d="M133 247L140 235L147 247M250 93L262 100L250 107M373 139L380 151L387 139" fill="none" stroke="#176aa1" stroke-width="3"/>
    <circle cx="140" cy="340" r="7" fill="#17334f"/><circle cx="380" cy="180" r="7" fill="#17334f"/>
    <text x="116" y="330" font-size="20">A</text><text x="403" y="181" font-size="20">B</text>
    <text x="260" y="320" fill="#8c5900" font-size="20">甲路线</text><text x="260" y="83" fill="#176aa1" font-size="20">乙路线</text>
    <text x="500" y="373" font-size="18">列</text><text x="101" y="70" font-size="18">行</text>
    <text x="350" y="418" font-size="21">每个网格边表示100米（示意图）</text>
    <text x="350" y="457" font-size="20">把所有实际走过的路段都计入路程。</text>
  </g>
</svg>
