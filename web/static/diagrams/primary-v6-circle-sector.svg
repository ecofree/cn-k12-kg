<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" role="img" aria-labelledby="title desc"><title id="title">圆的半径直径和扇形</title><desc id="desc">O为圆心，A在圆周左端、B在右端，A、O、B共线。C在圆周右上方。阴影的边界从O沿直线到B，再沿较短圆弧到C，再沿直线回O。D、E在圆周下方，两点的水平连线不经过O。</desc><style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;fill:#172033} .axis{stroke:#334155;stroke-width:2} .n{font-size:21px;text-anchor:middle}</style><rect width="100%" height="100%" fill="white"/><text x="425" y="40" text-anchor="middle" font-size="26">在同一个圆中辨认线段和扇形</text><circle cx="280" cy="245" r="155" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M280 245L435 245A155 155 0 0 0 357.500 110.766Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><path d="M125 245H435" stroke="#b45309" stroke-width="3"/><path d="M157.526 340H402.474" stroke="#7c3aed" stroke-width="2"/><circle cx="280.000" cy="245.000" r="4" fill="#172033"/><text x="268.000" y="269.000" class="n">O</text><circle cx="125.000" cy="245.000" r="4" fill="#172033"/><text x="105.000" y="252.000" class="n">A</text><circle cx="435.000" cy="245.000" r="4" fill="#172033"/><text x="452.000" y="252.000" class="n">B</text><circle cx="357.500" cy="110.766" r="4" fill="#172033"/><text x="364.500" y="98.766" class="n">C</text><circle cx="157.526" cy="340.000" r="4" fill="#172033"/><text x="143.526" y="365.000" class="n">D</text><circle cx="402.474" cy="340.000" r="4" fill="#172033"/><text x="416.474" y="365.000" class="n">E</text><text x="545" y="150" font-size="23">O 是圆心</text><text x="545" y="202" font-size="23">A、B、C、D、E 在圆上</text><text x="545" y="254" font-size="23">请指出：半径、直径、</text><text x="545" y="290" font-size="23">扇形的圆心角和弧</text><text x="425" y="452" class="n">图形用来辨认结构，长度以题目条件为准。</text></svg>