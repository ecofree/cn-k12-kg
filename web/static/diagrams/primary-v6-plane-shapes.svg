<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img" aria-labelledby="title desc"><title id="title">四个平面图形</title><desc id="desc">甲是三条直线段围成的三角形；乙是横放长方形；丙是圆；丁是旋转45度的正方形，四条边相等、四个角为直角。所有轮廓彼此分离。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a;font-size:19px} .title{font-size:24px;font-weight:700} .shape{stroke:#18324a;stroke-width:3;stroke-linejoin:round} .dash{fill:none;stroke:#8a4b12;stroke-width:2.5;stroke-dasharray:7 5} .label{font-size:17px} .grid{stroke:#b6c5d3;stroke-width:1}</style><rect width="850" height="370" fill="#fff"/><text x="390" y="38" text-anchor="middle" class="title">观察四个平面图形的外轮廓</text><polygon points="65,245 225,245 180,105" fill="#d8edfa" class="shape"/><rect x="280" y="125" width="180" height="100" fill="#d8edfa" class="shape"/><circle cx="570" cy="175" r="65" fill="#d8edfa" class="shape"/><polygon points="745,105 815,175 745,245 675,175" fill="#fff0cd" class="shape"/><text x="145" y="285" text-anchor="middle" class="">甲</text><text x="370" y="285" text-anchor="middle" class="">乙</text><text x="570" y="285" text-anchor="middle" class="">丙</text><text x="745" y="285" text-anchor="middle" class="">丁</text><text x="390" y="335" text-anchor="middle" class="label">图形转了方向，边和角的性质是否会改变？</text></svg>
