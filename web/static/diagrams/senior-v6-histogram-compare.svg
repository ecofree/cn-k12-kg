<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" role="img" aria-labelledby="title desc">
<title id="title">三个不等组距组的频率密度直方图</title>
<desc id="desc">横轴测量值，组甲为零至二，组乙为二至七，组丙为七至八。纵轴为频率除以组距，甲高零点二，乙和丙高零点一。</desc>
<rect width="740" height="430" fill="#fff"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#172b4d">
<text x="370" y="32" text-anchor="middle" font-size="21">不等组距：比较柱面积</text>
<text x="90" y="64" font-size="16">频率 / 组距</text>
<g stroke="#d8e0e8" stroke-dasharray="4 4"><path d="M90 230H650 M90 130H650"/></g>
<g fill="#69b6d3" stroke="#176780" stroke-width="2"><rect x="90" y="130" width="140" height="200"/><rect x="230" y="230" width="350" height="100"/><rect x="580" y="230" width="70" height="100"/></g>
<g fill="none" stroke="#273e55" stroke-width="2"><path d="M90 85V330H680"/><path d="M85 130H90 M85 230H90 M230 330V336 M580 330V336 M650 330V336"/></g>
<g font-size="17"><text x="77" y="336" text-anchor="end">0</text><text x="77" y="236" text-anchor="end">0.1</text><text x="77" y="136" text-anchor="end">0.2</text><text x="90" y="358" text-anchor="middle">0</text><text x="230" y="358" text-anchor="middle">2</text><text x="580" y="358" text-anchor="middle">7</text><text x="650" y="358" text-anchor="middle">8</text><text x="655" y="390" text-anchor="end">测量值（单位）</text></g>
<g font-size="20" font-weight="600"><text x="160" y="180" text-anchor="middle">甲组</text><text x="405" y="270" text-anchor="middle">乙组</text><text x="615" y="270" text-anchor="middle">丙组</text></g>
<text x="90" y="408" font-size="15">各组左闭右开，末组包含右端点。柱高表示密度，频率须由面积求得。</text>
</g>
</svg>
