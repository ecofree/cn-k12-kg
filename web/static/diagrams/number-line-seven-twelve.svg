<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">数轴上的步数任务</title><desc id="desc">7至12六个整数刻度等距，7为起点12为终点，未标间隔数。</desc><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="760" height="290" fill="#f8fafc" stroke="none" stroke-width="2"/><text x="380" y="40" font-size="23" text-anchor="middle" fill="#18324d" font-weight="bold">从一个整数跳到下一个整数，算一步</text><line x1="90" y1="150" x2="655" y2="150" stroke="#18324d" stroke-width="2"/><line x1="110" y1="139" x2="110" y2="161" stroke="#18324d" stroke-width="2"/><text x="110" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">7</text><line x1="210" y1="139" x2="210" y2="161" stroke="#18324d" stroke-width="2"/><text x="210" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">8</text><line x1="310" y1="139" x2="310" y2="161" stroke="#18324d" stroke-width="2"/><text x="310" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">9</text><line x1="410" y1="139" x2="410" y2="161" stroke="#18324d" stroke-width="2"/><text x="410" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">10</text><line x1="510" y1="139" x2="510" y2="161" stroke="#18324d" stroke-width="2"/><text x="510" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">11</text><line x1="610" y1="139" x2="610" y2="161" stroke="#18324d" stroke-width="2"/><text x="610" y="196" font-size="23" text-anchor="middle" fill="#18324d" font-weight="normal">12</text><circle cx="110" cy="150" r="7" fill="#19769b"/><circle cx="610" cy="150" r="7" fill="#c65b19"/><text x="110" y="246" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">起点</text><text x="610" y="246" font-size="21" text-anchor="middle" fill="#18324d" font-weight="normal">终点</text></g></svg>
