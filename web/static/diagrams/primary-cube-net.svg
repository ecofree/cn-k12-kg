<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">带编号的正方体展开图</title>
  <desc id="desc">A、B、C、D四个正方形从左向右排列，E在B上面，F在B下面。折叠后A与C、B与D、E与F相对。</desc>
  <rect width="640" height="400" rx="16" fill="#f6f9fc"/>
  <g stroke="#245468" stroke-width="3">
    <rect x="90" y="150" width="110" height="110" fill="#dcedf5"/>
    <rect x="200" y="150" width="110" height="110" fill="#e7e2f6"/>
    <rect x="310" y="150" width="110" height="110" fill="#dcedf5"/>
    <rect x="420" y="150" width="110" height="110" fill="#e7e2f6"/>
    <rect x="200" y="40" width="110" height="110" fill="#f9e6cf"/>
    <rect x="200" y="260" width="110" height="110" fill="#f9e6cf"/>
  </g>
  <g fill="#173947" font-family="sans-serif" font-size="32" text-anchor="middle" dominant-baseline="middle">
    <text x="145" y="205">A</text><text x="255" y="205">B</text>
    <text x="365" y="205">C</text><text x="475" y="205">D</text>
    <text x="255" y="95">E</text><text x="255" y="315">F</text>
  </g>
</svg>
