<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题目复核 · K12 知识图谱</title>
<style>
  :root {
    --bg: #f7f8f7; --surface: #fff; --line: #e3e6e4; --text: #1c1f1d;
    --muted: #6b726c; --accent: #2f6f5e; --accent-weak: #e8f2ee;
    --warn: #b45309; --bad: #b42318; --bad-weak: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 16px 24px 12px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; margin: 10px 0 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .stats { font-size: 13px; color: var(--muted); }
  button, select {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--accent-weak); border-color: #cfe6de; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 18px 24px 80px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .card.done { border-color: #cfe6de; }
  .card.fail { border-color: #f3c2bd; background: #fffdfc; }
  .card.focus { box-shadow: 0 0 0 2px #cfe6de; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .prompt { font-size: 15px; margin: 0 0 10px; white-space: pre-wrap; }
  .opts { margin: 0 0 10px; padding-left: 0; list-style: none; font-size: 14px; }
  .opts li { padding: 2px 0; }
  .opts .k { color: var(--muted); margin-right: 6px; }
  .ans { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  details { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  details summary { cursor: pointer; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .actions button[data-v="fail"].on { background: var(--bad-weak); border-color: var(--bad); color: var(--bad); }
  .actions button[data-v="pass"].on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  .actions button[data-v="skip"].on { background: #f3f4f3; }
  textarea {
    width: 100%; margin-top: 8px; font: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical; min-height: 44px;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  kbd {
    background: #eef0ef; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>题目复核</h1>

  <div class="bar"><div id="fill"></div></div>
  <div class="row">
    <span class="stats" id="stats"></span>
    <select id="filter">
      <option value="all">全部</option>
      <option value="todo">只看未复核</option>
      <option value="fail">只看有问题</option>
    </select>
    <button class="primary" id="export">导出 review.csv</button>
    <button id="reset">清空记录</button>
  </div>
  <p class="muted" style="margin-top:6px">快捷键：<kbd>1</kbd> 通过 · <kbd>2</kbd> 有问题 · <kbd>3</kbd> 跳过 · <kbd>↑</kbd><kbd>↓</kbd> 切换题目</p>
</header>

", "text": "a-1"}, {"id": "o2", "text": "a+1"}, {"id": "o3", "text": "5a-1"}, {"id": "o4", "text": "5a+1"}], "answerDisplay": "o2. a+1", "explanation": "去括号时括号前是负号，各项都要变号：3a-2a+1=a+1。"}, {"id": "m7a.4.2-q3", "topicId": "m7a.4.2", "topicName": "整式的加法与减法", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "当 x=1 时，(2x²-3x+1)+(x²+3x-4) 的值是多少？", "choices": [], "answerDisplay": "0", "explanation": "化简得 3x²-3，代入 x=1 得 0。"}, {"id": "m7a.5.1.1-q3", "topicId": "m7a.5.1.1", "topicName": "方程与一元一次方程", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "下列各数中，是方程 3x+1=7 的解的是哪一个？", "choices": [{"id": "o1", "text": "x=2"}, {"id": "o2", "text": "x=3"}, {"id": "o3", "text": "x=4"}, {"id": "o4", "text": "x=1"}], "answerDisplay": "o1. x=2", "explanation": "把 x=2 代入 3x+1 得 3×2+1=7，与右边相等，所以 x=2 是方程的解；代入 1、3、4 都不等于 7。"}, {"id": "m7a.5.1.2-q3", "topicId": "m7a.5.1.2", "topicName": "等式的性质", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "由 2x=6 得到 x=3，依据是什么？", "choices": [{"id": "o1", "text": "等式两边加同一个数"}, {"id": "o2", "text": "等式两边除以同一个不为 0 的数"}, {"id": "o3", "text": "等式两边同乘 2"}, {"id": "o4", "text": "移项"}], "answerDisplay": "o2. 等式两边除以同一个不为 0 的数", "explanation": "两边同除以 2（2 不为 0）才能得到 x=3；若两边同乘 2，会变成 4x=12，不是 x=3。"}, {"id": "m7a.5.2-q2", "topicId": "m7a.5.2", "topicName": "解一元一次方程", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "解方程 2(x-1)=6，x 等于多少？", "choices": [], "answerDisplay": "4", "explanation": "两边同除以 2 得 x-1=3，再移项得 x=4。"}, {"id": "m7a.5.2-q3", "topicId": "m7a.5.2", "topicName": "解一元一次方程", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "解方程 (x-1)/2=3，x 等于多少？", "choices": [], "answerDisplay": "7", "explanation": "两边同乘 2 得 x-1=6，移项得 x=7。"}, {"id": "m7a.5.3-q2", "topicId": "m7a.5.3", "topicName": "实际问题与一元一次方程", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "一件商品按标价的八折出售，售价是 240 元，标价是多少元？", "choices": [], "answerDisplay": "300", "explanation": "设标价为 x，0.8x=240，解得 x=300。"}, {"id": "m7a.5.3-q3", "topicId": "m7a.5.3", "topicName": "实际问题与一元一次方程", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "甲、乙两人相距 30 千米，相向而行，甲每小时走 4 千米、乙每小时走 6 千米，几小时后两人相遇？", "choices": [], "answerDisplay": "3", "explanation": "设 x 小时相遇，列方程 (4+6)x=30，解得 x=3。"}, {"id": "m7a.6.1.1-q3", "topicId": "m7a.6.1.1", "topicName": "立体图形与平面图形", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "圆柱的侧面展开图是什么图形？", "choices": [{"id": "o1", "text": "扇形"}, {"id": "o2", "text": "三角形"}, {"id": "o3", "text": "长方形"}, {"id": "o4", "text": "圆"}], "answerDisplay": "o3. 长方形", "explanation": "沿高剪开侧面展开是长方形，长等于底面周长。"}, {"id": "m7a.6.1.2-q3", "topicId": "m7a.6.1.2", "topicName": "点、线、面、体", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "面与面相交得到的图形是什么？", "choices": [{"id": "o1", "text": "面"}, {"id": "o2", "text": "体"}, {"id": "o3", "text": "点"}, {"id": "o4", "text": "线"}], "answerDisplay": "o4. 线", "explanation": "面与面相交成线，线与线相交成点。"}, {"id": "m7a.6.2.1-q3", "topicId": "m7a.6.2.1", "topicName": "直线、射线、线段", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "平面上有三个点（不共线），过其中任意两点画直线，最多能画出多少条？", "choices": [], "answerDisplay": "3", "explanation": "每两点确定一条直线，共有 3 组，且不重合。"}, {"id": "m7a.6.2.2-q3", "topicId": "m7a.6.2.2", "topicName": "线段的比较与运算", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "下列说法正确的是哪一个？", "choices": [{"id": "o1", "text": "两点确定一条射线"}, {"id": "o2", "text": "射线可以向两方无限延伸"}, {"id": "o3", "text": "两点之间直线最短"}, {"id": "o4", "text": "两点之间线段最短"}], "answerDisplay": "o4. 两点之间线段最短", "explanation": "两点之间线段最短；直线无限长、无法度量，所以「直线最短」不成立。射线只向一方无限延伸，向两方延伸得到的是直线；两点确定的是直线，不是射线。"}, {"id": "m7a.6.3.1-q2", "topicId": "m7a.6.3.1", "topicName": "角的概念", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "下列表示角的方法中，错误的是哪一个？", "choices": [{"id": "o1", "text": "∠AB"}, {"id": "o2", "text": "∠AOB"}, {"id": "o3", "text": "∠O"}, {"id": "o4", "text": "∠1"}], "answerDisplay": "o1. ∠AB", "explanation": "用三个字母表示角时，顶点字母必须写在中间，∠AB 只有两个字母、无法确定顶点，写法不合规范。∠AOB、∠O、∠1 都是常见表示法。"}, {"id": "m7a.6.3.1-q3", "topicId": "m7a.6.3.1", "topicName": "角的概念", "volume": "七上", "type": "numeric", "typeLabel": "填空题", "difficulty": "standard", "prompt": "30°15′ 等于多少分？", "choices": [], "answerDisplay": "1815", "explanation": "30×60=1800，再加 15 得 1815。"}, {"id": "m7a.6.3.2-q3", "topicId": "m7a.6.3.2", "topicName": "角的比较与运算", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "下列说法正确的是哪一个？", "choices": [{"id": "o1", "text": "角的大小与边的长短无关"}, {"id": "o2", "text": "角的两边越长，角越大"}, {"id": "o3", "text": "角一定小于 90°"}, {"id": "o4", "text": "角的大小与边的长短有关"}], "answerDisplay": "o1. 角的大小与边的长短无关", "explanation": "角的大小取决于两边张开的程度，与画出的边的长短无关。角可以是锐角、直角、钝角，也可以大于 90°。"}, {"id": "m7a.6.3.3-q3", "topicId": "m7a.6.3.3", "topicName": "余角和补角", "volume": "七上", "type": "choice", "typeLabel": "选择题", "difficulty": "standard", "prompt": "下列说法正确的是哪一个？", "choices": [{"id": "o1", "text": "互为补角的两个角一定相等"}, {"id": "o2", "text": "互补的两个角一定都是钝角"}, {"id": "o3", "text": "同角的余角相等"}, {"id": "o4", "text": "一个角的补角一定是钝角"}], "answerDisplay": "o3. 同角的余角相等", "explanation": "同角的余角相等，这是余角的性质。互为补角的两个角不一定相等（30° 与 150° 互补但不相等）；互补的两个角也不一定都是钝角。"}, {"id": "mh1.1.1-q1", "topicId": "mh1.1.1", "topicName": "集合的概念", "volume": "必修一", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "下列各组对象中，能构成集合的是哪一个？", "choices": [{"id": "o1", "text": "某班个子较高的同学"}, {"id": "o2", "text": "方程 x²=1 的实数解"}, {"id": "o3", "text": "接近 0 的数"}, {"id": "o4", "text": "很大的数"}], "answerDisplay": "o2. 方程 x²=1 的实数解", "explanation": "集合的元素必须确定。方程 x²=1 的实数解是 1 和 -1，能构成集合；“个子较高”“接近 0”“很大”都缺少明确标准。"}, {"id": "mh1.1.2-q1", "topicId": "mh1.1.2", "topicName": "集合间的基本关系", "volume": "必修一", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "集合 {a,b} 的子集共有多少个？", "choices": [{"id": "o1", "text": "4 个"}, {"id": "o2", "text": "5 个"}, {"id": "o3", "text": "2 个"}, {"id": "o4", "text": "3 个"}], "answerDisplay": "o1. 4 个", "explanation": "∅、{a}、{b}、{a,b}，共 4 个。"}, {"id": "mh1.1.3-q1", "topicId": "mh1.1.3", "topicName": "集合的基本运算", "volume": "必修一", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "已知 A={1,2,3}，B={2,3,4}，则 A∩B 中元素的个数是多少？", "choices": [], "answerDisplay": "2", "explanation": "A∩B={2,3}，共 2 个元素。"}, {"id": "mh2.6.1-q1", "topicId": "mh2.6.1", "topicName": "平面向量的概念", "volume": "必修二", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "下列量中是向量的是哪一个？", "choices": [{"id": "o1", "text": "温度"}, {"id": "o2", "text": "位移"}, {"id": "o3", "text": "时间"}, {"id": "o4", "text": "质量"}], "answerDisplay": "o2. 位移", "explanation": "位移既有大小又有方向，是向量；温度、时间、质量只有大小，是数量。"}, {"id": "mh2.6.2.1-q1", "topicId": "mh2.6.2.1", "topicName": "向量的加法运算", "volume": "必修二", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "已知 |a|=3，|b|=4，a 与 b 垂直，则 |a+b| 等于多少？", "choices": [], "answerDisplay": "5", "explanation": "垂直时 |a+b|²=|a|²+|b|²，得 5。"}, {"id": "mh2.6.2.2-q1", "topicId": "mh2.6.2.2", "topicName": "向量的减法运算", "volume": "必修二", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "若 a、b 共起点，则 a-b 对应的向量是哪一个？", "choices": [{"id": "o1", "text": "零向量"}, {"id": "o2", "text": "从 a 的终点指向 b 的终点"}, {"id": "o3", "text": "从 b 的终点指向 a 的终点"}, {"id": "o4", "text": "与 a 同向"}], "answerDisplay": "o3. 从 b 的终点指向 a 的终点", "explanation": "共起点时，差向量由减数 b 的终点指向被减数 a 的终点；只有 a=b 时差才是零向量。"}, {"id": "mh3.1.1.1-q1", "topicId": "mh3.1.1.1", "topicName": "空间向量及其线性运算", "volume": "选必一", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "空间向量的加法满足下列哪条运算律？", "choices": [{"id": "o1", "text": "只有结合律"}, {"id": "o2", "text": "都不满足"}, {"id": "o3", "text": "只对特殊向量成立"}, {"id": "o4", "text": "交换律"}], "answerDisplay": "o4. 交换律", "explanation": "空间向量与平面向量一样，加法满足交换律和结合律。"}, {"id": "mh3.1.1.2-q1", "topicId": "mh3.1.1.2", "topicName": "空间向量的数量积运算", "volume": "选必一", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "已知 a=(1,2,3)，b=(2,-1,0)，则 a·b 等于多少？", "choices": [], "answerDisplay": "0", "explanation": "坐标形式的数量积等于对应分量乘积之和：1×2+2×(-1)+3×0=0。"}, {"id": "mh3.1.2-q1", "topicId": "mh3.1.2", "topicName": "空间向量基本定理", "volume": "选必一", "type": "choice", "typeLabel": "选择题", "difficulty": "basic", "prompt": "构成空间基底的一组向量必须满足什么？", "choices": [{"id": "o1", "text": "两两垂直"}, {"id": "o2", "text": "三个向量共面"}, {"id": "o3", "text": "三个向量不共面"}, {"id": "o4", "text": "都是单位向量"}], "answerDisplay": "o3. 三个向量不共面", "explanation": "基底要求三个向量不共面，这样才能唯一表示空间中的任一向量；两两垂直只是其中一种特殊情况。"}, {"id": "mh4.4.1-q1", "topicId": "mh4.4.1", "topicName": "数列的概念", "volume": "选必二", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "数列 a_n=2n+1 的第 3 项是多少？", "choices": [], "answerDisplay": "7", "explanation": "代入 n=3 得 2×3+1=7。"}, {"id": "mh4.4.2.1-q1", "topicId": "mh4.4.2.1", "topicName": "等差数列的概念", "volume": "选必二", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "等差数列首项为 2、公差为 3，第 5 项是多少？", "choices": [], "answerDisplay": "14", "explanation": "a5=2+4×3=14。"}, {"id": "mh4.4.2.2-q1", "topicId": "mh4.4.2.2", "topicName": "等差数列的前n项和公式", "volume": "选必二", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "首项为 1、公差为 1 的等差数列，前 10 项和是多少？", "choices": [], "answerDisplay": "55", "explanation": "S10=10×(1+10)/2=55。"}, {"id": "mh5.6.1-q1", "topicId": "mh5.6.1", "topicName": "分类加法计数原理与分步乘法计数原理", "volume": "选必三", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "从甲地到乙地有 3 条路，从乙地到丙地有 4 条路。从甲地经乙地到丙地共有多少种走法？", "choices": [], "answerDisplay": "12", "explanation": "分两步完成，用乘法原理：3×4=12。"}, {"id": "mh5.6.2.1-q1", "topicId": "mh5.6.2.1", "topicName": "排列", "volume": "选必三", "type": "choice", "typeLabel": "选择题", "difficulty":  "m9b.33.1", "topicName": "投影", "volume": "九下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "太阳光下物体的影子属于哪种投影？", "choices": [], "answerDisplay": "平行投影", "explanation": "太阳光可近似看作平行光线，物体在平行光下形成的投影叫平行投影；灯光从一点发出才形成中心投影。"}, {"id": "m4b.1.1-q1", "topicId": "m4b.1.1", "topicName": "除数是两位数的除法", "volume": "四下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "96÷32=？（只填数字）", "choices": [], "answerDisplay": "3", "explanation": "32×3=96，所以商是 3。"}, {"id": "m4b.2.1-q1", "topicId": "m4b.2.1", "topicName": "混合运算和运算律", "volume": "四下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "25×(4+8)=？（只填数字）", "choices": [], "answerDisplay": "300", "explanation": "先算括号内 4+8=12，再乘 25 得 300；也可用分配律 100+200。"}, {"id": "m4b.3.1-q1", "topicId": "m4b.3.1", "topicName": "三角形", "volume": "四下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "三角形两个内角是 45° 和 60°，第三个内角是多少度？（只填数字）", "choices": [], "answerDisplay": "75", "explanation": "内角和 180°，180-45-60=75°。"}, {"id": "m5b.1.1-q1", "topicId": "m5b.1.1", "topicName": "因数和倍数", "volume": "五下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "12 有几个因数？（只填数字）", "choices": [], "answerDisplay": "6", "explanation": "12 的因数是 1、2、3、4、6、12，共 6 个。"}, {"id": "m5b.2.1-q1", "topicId": "m5b.2.1", "topicName": "分数的认识", "volume": "五下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "把 12/18 约成最简分数后，分子是多少？（只填数字）", "choices": [], "answerDisplay": "2", "explanation": "分子分母同除以最大公因数 6，12/18=2/3，分子是 2。"}, {"id": "m5b.3.1-q1", "topicId": "m5b.3.1", "topicName": "分数的加法和减法", "volume": "五下", "type": "numeric", "typeLabel": "填空题", "difficulty": "basic", "prompt": "计算 1/2+1/3，所得结果的分子是多少？（只填数字）", "choices": [], "answerDisplay": "5", "explanation": "通分为 3/6+2/6=5/6，分子是 5。"}, {"id": "m1a.3.1-q3", "topicId": "m1a.3.1", "topicName": "认识立体图形", "volume": "一上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "像皮球那样，表面是曲面的立体图形叫 a.6.4-q3", "topicId": "m3a.6.4", "topicName": "简单的分数大小比较", "volume": "三上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "1/3 和 1/5 哪个大？（填分数）", "choices": [], "answerDisplay": "1/3", "explanation": "分子都是 1 时，分母越小，每一份越大，所以 1/3 大于 1/5。"}, {"id": "m3b.1.1-q3", "topicId": "m3b.1.1", "topicName": "生活中的运动现象", "volume": "三下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "推拉窗沿轨道左右滑动属于什么现象？", "choices": [], "answerDisplay": "平移", "explanation": "推拉窗沿轨道左右滑动时，形状、大小和朝向都不变，只改变位置，属于平移。"}, {"id": "m4a.5.1-q3", "topicId": "m4a.5.1", "topicName": "平行和垂直", "volume": "四上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "两条直线互相垂直，它们相交成的角是多少度？", "choices": [], "answerDisplay": "90", "explanation": "两条直线互相垂直，表示它们相交成直角，所成的角是 90°。"}, {"id": "m5a.1.1-q3", "topicId": "m5a.1.1", "topicName": "观察简单组合体", "volume": "五上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "从正面看一个竖放的圆柱，看到的是什么图形？", "choices": [], "answerDisplay": "长方形", "explanation": "直立圆柱从正面平视看到的是长方形，宽等于底面直径、高等于圆柱的高；从上面看才是圆。"}, {"id": "m5a.7.1-q3", "topicId": "m5a.7.1", "topicName": "可能性", "volume": "五上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "盒子里全是红球，任意摸出一个，一定是什么颜色？", "choices": [], "answerDisplay": "红色", "explanation": "盒子里没有别的颜色，摸出红球是必然事件。"}, {"id": "m6a.1.1-q3", "topicId": "m6a.1.1", "topicName": "有序数对确定位置", "volume": "六上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "数对 (3,5) 中的 3 表示第几列？（填数字）", "choices": [], "answerDisplay": "3", "explanation": "数对先写列、后写行，所以 (3,5) 表示第 3 列第 5 行。"}, {"id": "m6a.1.2-q3", "topicId": "m6a.1.2", "topicName": "用方向和距离确定位置", "volume": "六上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "用方向和距离确定位置，除了方向还必须知道什么？", "choices": [], "answerDisplay": "距离", "explanation": "只有方向只能确定一条射线，加上距离才能锁定唯一的位置。"}, {"id": "m7a.6.1.2-q4", "topicId": "m7a.6.1.2", "topicName": "点、线、面、体", "volume": "七上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "线与线相交得到的图形是什么？", "choices": [], "answerDisplay": "点", "explanation": "体由面组成，面与面相交成线，线与线相交成点。"}, {"id": "m7b.12.1.1-q3", "topicId": "m7b.12.1.1", "topicName": "全面调查", "volume": "七下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "要了解某班 45 名学生的视力情况，适合采用全面调查还是抽样调查？", "choices": [], "answerDisplay": "全面调查", "explanation": "全班只有 45 人，范围小、逐个调查可行，适合全面调查；若总体很大或调查有破坏性，则应抽样。"}, {"id": "m7b.7.3-q3", "topicId": "m7b.7.3", "topicName": "定义、命题、定理", "volume": "七下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "命题“对顶角相等”是真命题还是假命题？", "choices": [], "answerDisplay": "真命题", "explanation": "对顶角一定相等，所以这是真命题。"}, {"id": "m8a.14.2-q3", "topicId": "m8a.14.2", "topicName": "三角形全等的判定", "volume": "八上", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "已知两边及其夹角分别对应相等，用哪个判定方法判定全等？（填字母）", "choices": [], "answerDisplay": "SAS", "explanation": "两边及其夹角对应相等，用 SAS（边角边）判定全等。"}, {"id": "m8b.21.3-q3", "topicId": "m8b.21.3", "topicName": "特殊的平行四边形", "volume": "八下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "矩形的四个角都是什么角？", "choices": [], "answerDisplay": "直角", "explanation": "矩形是有一个角是直角的平行四边形，由平行线的性质可推出四个角都是直角。"}, {"id": "m9b.31.2.2-q3", "topicId": "m9b.31.2.2", "topicName": "三角形相似的判定", "volume": "九下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "两个三角形有两组角分别相等，它们一定相似吗？（填 一定/不一定）", "choices": [], "answerDisplay": "一定", "explanation": "两个角分别相等的两个三角形相似（AA），这是最常用的判定。"}, {"id": "m9b.33.1-q3", "topicId": "m9b.33.1", "topicName": "投影", "volume": "九下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "太阳光形成的平行投影中，同一时刻不同物体的影子方向相同吗？（填 相同/不同）", "choices": [], "answerDisplay": "相同", "explanation": "太阳光是平行光线，形成的投影是平行投影；灯光是点光源，形成中心投影。"}, {"id": "m9b.33.2.2-q3", "topicId": "m9b.33.2.2", "topicName": "由三视图想象物体形状", "volume": "九下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "三视图都是正方形的立体图形是什么？", "choices": [], "answerDisplay": "正方体", "explanation": "正方体从正面、上面、侧面看都是正方形。"}, {"id": "m9b.34.1.1-q3", "topicId": "m9b.34.1.1", "topicName": "随机事件", "volume": "九下", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "“太阳每天从东方升起”属于什么事件？", "choices": [], "answerDisplay": "必然事件", "explanation": "这件事一定发生，是必然事件；必然事件的概率为 1。"}, {"id": "mh1.1.4.1-q3", "topicId": "mh1.1.4.1", "topicName": "充分条件与必要条件", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "“x>3”是“x>1”的什么条件？（填 充分不必要/必要不充分/充要/既不充分也不必要）", "choices": [], "answerDisplay": "充分不必要条件", "explanation": "x>3 一定能推出 x>1，但 x>1 推不出 x>3，所以是充分不必要条件。"}, {"id": "mh1.1.4.2-q3", "topicId": "mh1.1.4.2", "topicName": "充要条件", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "“a=b”是“a²=b²”的什么条件？（填 充分不必要/必要不充分/充要/既不充分也不必要）", "choices": [], "answerDisplay": "充分不必要条件", "explanation": "a=b 必有 a²=b²，但 a=-b 时也成立，反过来推不出，所以是充分不必要条件。"}, {"id": "mh1.1.5.1-q3", "topicId": "mh1.1.5.1", "topicName": "全称量词与存在量词", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "命题“对任意实数 x，x²≥0”是全称量词命题还是存在量词命题？", "choices": [], "answerDisplay": "全称量词命题", "explanation": "含有“任意”这类全称量词的命题是全称量词命题。"}, {"id": "mh1.1.5.2-q3", "topicId": "mh1.1.5.2", "topicName": "全称量词命题和存在量词命题的否定", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "全称量词命题的否定是哪种命题？", "choices": [], "answerDisplay": "存在量词命题", "explanation": "全称量词命题的否定是存在量词命题，量词要换、结论要否定。"}, {"id": "mh1.3.2.2-q3", "topicId": "mh1.3.2.2", "topicName": "函数的奇偶性", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "函数 f(x)=x³ 是奇函数还是偶函数？", "choices": [], "answerDisplay": "奇函数", "explanation": "f(-x)=(-x)³=-x³=-f(x)，满足奇函数定义。"}, {"id": "mh1.4.4.2-q3", "topicId": "mh1.4.4.2", "topicName": "对数函数的图象和性质", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "log₂8 等于多少？（填数字）", "choices": [], "answerDisplay": "3", "explanation": "因为 2³=8，所以 log₂8=3。"}, {"id": "mh1.4.4.3-q3", "topicId": "mh1.4.4.3", "topicName": "不同函数增长的差异", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "当 x 很大时，y=x³、y=2^x、y=log₂x 中增长最快的是哪一个？", "choices": [], "answerDisplay": "y=2^x", "explanation": "指数函数增长快于幂函数，幂函数快于对数函数。"}, {"id": "mh1.4.5.3-q3", "topicId": "mh1.4.5.3", "topicName": "函数模型的应用", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "某数据随时间均匀减少，最适宜选哪类函数模型？", "choices": [], "answerDisplay": "一次函数模型", "explanation": "均匀变化对应线性关系，选一次函数 y=kx+b（k<0）。"}, {"id": "mh1.5.1.1-q3", "topicId": "mh1.5.1.1", "topicName": "任意角", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "390° 角的终边落在第几象限？（填数字）", "choices": [], "answerDisplay": "1", "explanation": "390°=30°+360°，与 30° 终边相同，落在第一象限。"}, {"id": "mh1.5.4.1-q3", "topicId": "mh1.5.4.1", "topicName": "正弦、余弦函数的图象", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "函数 y=sinx 在 [0,2π] 上的最大值是多少？", "choices": [], "answerDisplay": "1", "explanation": "sinx 的最大值是 1，在 x=π/2 处取得。"}, {"id": "mh1.5.4.3-q3", "topicId": "mh1.5.4.3", "topicName": "正切函数的性质与图象", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "当 x=π/2 时，tanx 有意义吗？（填 有/无）", "choices": [], "answerDisplay": "无", "explanation": "x=π/2 时 cosx=0，正切无定义，图象在该处有渐近线。"}, {"id": "mh1.5.6.1-q3", "topicId": "mh1.5.6.1", "topicName": "匀速圆周运动的数学模型", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "匀速圆周运动模型 y=Asin(ωt+φ) 中的 A 表示什么？", "choices": [], "answerDisplay": "振幅", "explanation": "A 是质点做圆周运动的半径，也就是简谐运动的振幅。"}, {"id": "mh1.5.7-q3", "topicId": "mh1.5.7", "topicName": "三角函数的应用", "volume": "必修一", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "某简谐运动的周期 T=4，则 ω 等于多少？（答案可含 π）", "choices": [], "answerDisplay": "π/2", "explanation": "ω=2π/T=2π÷4=π/2。"}, {"id": "mh2.10.1.1-q3", "topicId": "mh2.10.1.1", "topicName": "有限样本空间与随机事件", "volume": "必修二", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "掷一枚骰子，样本空间中样本点的个数是多少？", "choices": [], "answerDisplay": "6", "explanation": "掷一枚骰子，朝上的点数可能是 1、2、3、4、5、6，样本空间有 6 个样本点。"}, {"id": "mh2.10.1.2-q3", "topicId": "mh2.10.1.2", "topicName": "事件的关系与运算", "volume": "必修二", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "若 A 与 B 互为对立事件，则 P(A)+P(B) 等于多少？", "choices": [], "answerDisplay": "1", "explanation": "A 与 B 互为对立事件，所以 A∩B=∅ 且 A∪B=Ω，由概率加法得 P(A)+P(B)=P(Ω)=1。"}, {"id": "mh2.10.3.2-q3", "topicId": "mh2.10.3.2", "topicName": "随机模拟", "volume": "必修二", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "用随机数模拟掷骰子，通常取 1 到几的整数随机数？", "choices": [], "answerDisplay": "6", "explanation": "骰子有 1—6 六个面，所以取 1 到 6 的整数随机数。"}, {"id": "mh2.6.1-q3", "topicId": "mh2.6.1", "topicName": "平面向量的概念", "volume": "必修二", "type": "short", "typeLabel": "短答", "difficulty": "basic", "prompt": "单位向量的模是多少？", "choices": [], "answerDisplay": "1", "explanation": "模等于 1 的向量叫单位向量，所以单位向量的模是 1。"}];
const KEY = "cnkg-review-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
let focusIdx = 0;

const list = document.getElementById("list");
const statsEl = document.getElementById("stats");
const fillEl = document.getElementById("fill");
const filterEl = document.getElementById("filter");

function save() { localStorage.setItem(KEY, JSON.stringify(store)); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  const mode = filterEl.value;
  list.textContent = "";
  let visible = 0;
  DATA.forEach((q, i) => {
    const rec = store[q.id] || {};
    if (mode === "todo" && rec.verdict) return;
    if (mode === "fail" && rec.verdict !== "fail") return;
    visible += 1;

    const card = document.createElement("article");
    card.className = "card" + (rec.verdict ? " done" : "") + (rec.verdict === "fail" ? " fail" : "") + (i === focusIdx ? " focus" : "");
    card.dataset.idx = i;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${q.volume} · ${q.topicName} · ${q.typeLabel} · ${q.difficulty} · ${q.id}`;
    card.append(meta);

    const prompt = document.createElement("p");
    prompt.className = "prompt";
    prompt.textContent = q.prompt;
    card.append(prompt);

    if (q.choices && q.choices.length) {
      const ol = document.createElement("ul");
      ol.className = "opts";
      q.choices.forEach((c, idx) => {
        const li = document.createElement("li");
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = String.fromCharCode(65 + idx) + ".";
        const t = document.createElement("span");
        t.textContent = c.text;
        li.append(k, t);
        ol.append(li);
      });
      card.append(ol);
    }

    const ans = document.createElement("div");
    ans.className = "ans";
    ans.textContent = "答案：" + q.answerDisplay;
    card.append(ans);

    if (q.explanation) {
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.textContent = "解析";
      const p = document.createElement("p");
      p.textContent = q.explanation;
      d.append(s, p);
      card.append(d);
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    [["pass", "通过 1"], ["fail", "有问题 2"], ["skip", "跳过 3"]].forEach(([v, label]) => {
      const b = document.createElement("button");
      b.dataset.v = v;
      b.textContent = label;
      if (rec.verdict === v) b.classList.add("on");
      b.addEventListener("click", (e) => { e.stopPropagation(); mark(q.id, v); });
      actions.append(b);
    });
    card.append(actions);

    if (rec.verdict === "fail") {
      const note = document.createElement("textarea");
      note.placeholder = "哪里有问题？写清应改成什么";
      note.value = rec.note || "";
      note.addEventListener("input", () => {
        store[q.id] = { ...(store[q.id] || {}), note: note.value };
        save();
      });
      actions.after(note);
    }

    card.addEventListener("click", () => setFocus(i));
    list.append(card);
  });

  if (!visible) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "这个筛选下没有题目。";
    list.append(p);
  }
  updateStats();
}

function mark(id, verdict) {
  const rec = store[id] || {};
  if (rec.verdict === verdict) {
    delete rec.verdict;
  } else {
    rec.verdict = verdict;
    if (verdict === "fail" && !rec.note) rec.note = "";
  }
  store[id] = rec;
  save();
  render();
  if (verdict === "fail") {
    const el = document.querySelector(`.card[data-idx="${focusIdx}"] textarea`);
    if (el) el.focus();
  }
}

function setFocus(i) {
  focusIdx = i;
  document.querySelectorAll(".card").forEach((c) => {
    c.classList.toggle("focus", Number(c.dataset.idx) === i);
  });
  const el = document.querySelector(`.card[data-idx="${i}"]`);
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function updateStats() {
  let pass = 0, fail = 0, skip = 0;
  for (const q of DATA) {
    const v = (store[q.id] || {}).verdict;
    if (v === "pass") pass++;
    else if (v === "fail") fail++;
    else if (v === "skip") skip++;
  }
  const done = pass + fail + skip;
  statsEl.textContent = `通过 ${pass} · 有问题 ${fail} · 跳过 ${skip} · 未复核 ${DATA.length - done} / 共 ${DATA.length}`;
  fillEl.style.width = (done / DATA.length * 100).toFixed(1) + "%";
}

document.getElementById("export").addEventListener("click", () => {
  const head = ["question_id", "topic_id", "type", "difficulty", "prompt", "answer", "explanation", "verdict", "note"];
  const rows = DATA.map((q) => {
    const rec = store[q.id] || {};
    return [q.id, q.topicId, q.type, q.difficulty, q.prompt, q.answerDisplay,
            q.explanation, rec.verdict || "", rec.note || ""];
  });
  const csv = [head, ...rows].map((r) => r.map((v) => {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "review.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("清空本机所有复核记录？导出的 CSV 不受影响。")) return;
  store = {};
  save();
  render();
});

filterEl.addEventListener("change", render);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "1" || e.key === "2" || e.key === "3") {
    const q = DATA[focusIdx];
    if (!q) return;
    mark(q.id, { "1": "pass", "2": "fail", "3": "skip" }[e.key]);
    e.preventDefault();
  } else if (e.key === "ArrowDown") {
    setFocus(Math.min(focusIdx + 1, DATA.length - 1));
    e.preventDefault();
  } else if (e.key === "ArrowUp") {
    setFocus(Math.max(focusIdx - 1, 0));
    e.preventDefault();
  }
});

render();
</script>
