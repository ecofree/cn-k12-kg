name: Content and browser release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive committed history only
        run: |
          git bundle create "$RUNNER_TEMP/repository.bundle" --all
          git bundle verify "$RUNNER_TEMP/repository.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/repository.bundle
            ${{ runner.temp }}/revision.txt
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned browser runner and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Complete content, core and browser verification
        run: python tools/release_check.py --with-browser
      - name: Verify unchanged release source
        run: |
          python tools/release_manifest.py --check
          git diff --exit-code
      - name: Preserve synthetic verification evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: learning-release-evidence
          retention-days: 14
          path: |
            build/regression_report.json
            build/regression_report.md
            build/release-check/*.log
            build/browser-check/report.*
            build/browser-check/*/result.json
            build/browser-check/*/*.png
            build/browser-check/*/*.log
